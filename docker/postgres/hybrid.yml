version: '3.0'

services:
  postgres:
    restart: always
    image: "postgres:16"
    ports:
      - "5432"
    environment:
      POSTGRES_DB: jnks_iot
      POSTGRES_PASSWORD: postgres
    volumes:
      - ../jnks-iot-monolith/postgres:/var/lib/postgresql/data
  cassandra:
    restart: always
    image: "cassandra:4.1"
    ports:
      - "9042"
    volumes:
      - ../jnks-iot-monolith/cassandra:/var/lib/cassandra
  jnks-iot-core1:
    env_file:
      - ../postgres/jnks-iot-node.hybrid.env
    depends_on:
      - postgres
      - cassandra
  jnks-iot-core2:
    env_file:
      - ../postgres/jnks-iot-node.hybrid.env
    depends_on:
      - postgres
      - cassandra
  jnks-iot-rule-engine1:
    env_file:
      - ../postgres/jnks-iot-node.hybrid.env
    depends_on:
      - postgres
      - cassandra
  jnks-iot-rule-engine2:
    env_file:
      - ../postgres/jnks-iot-node.hybrid.env
    depends_on:
      - postgres
      - cassandra
