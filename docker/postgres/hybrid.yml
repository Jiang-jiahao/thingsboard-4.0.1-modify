version: '3.0'

services:
  postgres:
    restart: always
    image: "postgres:16"
    ports:
      - "5432"
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_PASSWORD: postgres
    volumes:
      - ../tb-monolith/postgres:/var/lib/postgresql/data
  cassandra:
    restart: always
    image: "cassandra:4.1"
    ports:
      - "9042"
    volumes:
      - ../tb-monolith/cassandra:/var/lib/cassandra
  tb-core1:
    env_file:
      - ../postgres/tb-node.hybrid.env
    depends_on:
      - postgres
      - cassandra
  tb-core2:
    env_file:
      - ../postgres/tb-node.hybrid.env
    depends_on:
      - postgres
      - cassandra
  tb-rule-engine1:
    env_file:
      - ../postgres/tb-node.hybrid.env
    depends_on:
      - postgres
      - cassandra
  tb-rule-engine2:
    env_file:
      - ../postgres/tb-node.hybrid.env
    depends_on:
      - postgres
      - cassandra
