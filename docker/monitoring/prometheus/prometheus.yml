# my global config
global:
  scrape_interval:     15s # By default, scrape targets every 15 seconds.
  evaluation_interval: 15s # By default, scrape targets every 15 seconds.
  # scrape_timeout is set to the global default (10s).

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager).
  external_labels:
      monitor: 'jnks-iot'


# A scrape configuration containing exactly one endpoint to scrape:
# Here it's Prometheus itself.
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.

  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
     - targets: ['localhost:9090']

  - job_name: 'jnks-iot-core1'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'jnks-iot-core1:8080' ]

  - job_name: 'jnks-iot-core2'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'jnks-iot-core2:8080' ]

  # rule-engine 的 HTTP 端口是 8082（jnks-iot-rule-engine.yml 里 server.port 的默认值），
  # 不是 core 的 8080 —— 写成 8080 会一直 connection refused。
  - job_name: 'jnks-iot-rule-engine1'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'jnks-iot-rule-engine1:8082' ]

  - job_name: 'jnks-iot-rule-engine2'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'jnks-iot-rule-engine2:8082' ]

  - job_name: 'jnks-iot-mqtt-transport1'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'jnks-iot-mqtt-transport1:8081' ]

  - job_name: 'jnks-iot-mqtt-transport2'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'jnks-iot-mqtt-transport2:8081' ]

  - job_name: 'jnks-iot-http-transport1'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'jnks-iot-http-transport1:8081' ]

  - job_name: 'jnks-iot-http-transport2'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'jnks-iot-http-transport2:8081' ]

  - job_name: 'jnks-iot-coap-transport'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'jnks-iot-coap-transport:8081' ]

  - job_name: 'jnks-iot-lwm2m-transport'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'jnks-iot-lwm2m-transport:8081' ]

  - job_name: 'jnks-iot-snmp-transport'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'jnks-iot-snmp-transport:8081' ]
