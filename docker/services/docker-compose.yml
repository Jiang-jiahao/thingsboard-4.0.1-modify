
version: '3.0'

services:
  zookeeper:
    restart: always
    image: "zookeeper:3.8.1"
    ports:
      # 固定宿主端口：UDP transport 改用 host 网络后，容器内直连 127.0.0.1:2181
      # （见 docker/DEPLOY.md「UDP transport 走 host 网络」一节）
      - "2181:2181"
    environment:
      TZ: Asia/Shanghai
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888;zookeeper:2181
      ZOO_ADMINSERVER_ENABLED: "false"
  jnks-iot-js-executor:
    environment:
      TZ: Asia/Shanghai
    restart: always
    image: "${DOCKER_REPO}/${JS_EXECUTOR_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    deploy:
      replicas: 10
    env_file:
      - jnks-iot-js-executor/jnks-iot-js-executor.env
  jnks-iot-core1:
    restart: always
    image: "${DOCKER_REPO}/${JNKS_IOT_CORE_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "8080"
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "30"
    environment:
      TZ: Asia/Shanghai
      JNKS_IOT_SERVICE_ID: jnks-iot-core1
      JAVA_OPTS: "${JAVA_OPTS}"
    env_file:
      - jnks-iot-core/jnks-iot-core.env
    volumes:
      - ./jnks-iot-core/conf:/config
      - ../log/jnks-iot-core:/var/log/jnks-iot-core
    depends_on:
      - zookeeper
      - jnks-iot-js-executor
      - jnks-iot-rule-engine1
      - jnks-iot-rule-engine2
  jnks-iot-core2:
    restart: always
    image: "${DOCKER_REPO}/${JNKS_IOT_CORE_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "8080"
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "30"
    environment:
      TZ: Asia/Shanghai
      JNKS_IOT_SERVICE_ID: jnks-iot-core2
      JAVA_OPTS: "${JAVA_OPTS}"
    env_file:
      - jnks-iot-core/jnks-iot-core.env
    volumes:
      - ./jnks-iot-core/conf:/config
      - ../log/jnks-iot-core:/var/log/jnks-iot-core
    depends_on:
      - zookeeper
      - jnks-iot-js-executor
      - jnks-iot-rule-engine1
      - jnks-iot-rule-engine2
  jnks-iot-rule-engine1:
    restart: always
    image: "${DOCKER_REPO}/${JNKS_IOT_RULE_ENGINE_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "8080"
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "30"
    environment:
      TZ: Asia/Shanghai
      JNKS_IOT_SERVICE_ID: jnks-iot-rule-engine1
      JAVA_OPTS: "${JAVA_OPTS}"
    env_file:
      - jnks-iot-rule-engine/jnks-iot-rule-engine.env
    volumes:
      - ./jnks-iot-rule-engine/conf:/config
      - ../log/jnks-iot-rule-engine:/var/log/jnks-iot-rule-engine
    depends_on:
      - zookeeper
      - jnks-iot-js-executor
  jnks-iot-rule-engine2:
    restart: always
    image: "${DOCKER_REPO}/${JNKS_IOT_RULE_ENGINE_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "8080"
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "30"
    environment:
      TZ: Asia/Shanghai
      JNKS_IOT_SERVICE_ID: jnks-iot-rule-engine2
      JAVA_OPTS: "${JAVA_OPTS}"
    env_file:
      - jnks-iot-rule-engine/jnks-iot-rule-engine.env
    volumes:
      - ./jnks-iot-rule-engine/conf:/config
      - ../log/jnks-iot-rule-engine:/var/log/jnks-iot-rule-engine
    depends_on:
      - zookeeper
      - jnks-iot-js-executor
  jnks-iot-mqtt-transport1:
    restart: always
    image: "${DOCKER_REPO}/${MQTT_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "1883"
    environment:
      TZ: Asia/Shanghai
      JNKS_IOT_SERVICE_ID: jnks-iot-mqtt-transport1
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - jnks-iot-transports/mqtt/jnks-iot-mqtt-transport.env
    volumes:
      - ./jnks-iot-transports/mqtt/conf:/config
      - ../log/jnks-iot-transports/mqtt:/var/log/jnks-iot-mqtt-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-mqtt-transport2:
    restart: always
    image: "${DOCKER_REPO}/${MQTT_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "1883"
    environment:
      TZ: Asia/Shanghai
      JNKS_IOT_SERVICE_ID: jnks-iot-mqtt-transport2
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - jnks-iot-transports/mqtt/jnks-iot-mqtt-transport.env
    volumes:
      - ./jnks-iot-transports/mqtt/conf:/config
      - ../log/jnks-iot-transports/mqtt:/var/log/jnks-iot-mqtt-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-http-transport1:
    restart: always
    image: "${DOCKER_REPO}/${HTTP_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "8081"
    environment:
      TZ: Asia/Shanghai
      JNKS_IOT_SERVICE_ID: jnks-iot-http-transport1
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - jnks-iot-transports/http/jnks-iot-http-transport.env
    volumes:
      - ./jnks-iot-transports/http/conf:/config
      - ../log/jnks-iot-transports/http:/var/log/jnks-iot-http-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-http-transport2:
    restart: always
    image: "${DOCKER_REPO}/${HTTP_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "8081"
    environment:
      TZ: Asia/Shanghai
      JNKS_IOT_SERVICE_ID: jnks-iot-http-transport2
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - jnks-iot-transports/http/jnks-iot-http-transport.env
    volumes:
      - ./jnks-iot-transports/http/conf:/config
      - ../log/jnks-iot-transports/http:/var/log/jnks-iot-http-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-coap-transport:
    restart: always
    image: "${DOCKER_REPO}/${COAP_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "5683:5683/udp"
    environment:
      TZ: Asia/Shanghai
      JNKS_IOT_SERVICE_ID: jnks-iot-coap-transport
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - jnks-iot-transports/coap/jnks-iot-coap-transport.env
    volumes:
      - ./jnks-iot-transports/coap/conf:/config
      - ../log/jnks-iot-transports/coap:/var/log/jnks-iot-coap-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-lwm2m-transport:
    restart: always
    image: "${DOCKER_REPO}/${LWM2M_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "5685:5685/udp"
      - "5686:5686/udp"
    environment:
      TZ: Asia/Shanghai
      JNKS_IOT_SERVICE_ID: jnks-iot-lwm2m-transport
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - jnks-iot-transports/lwm2m/jnks-iot-lwm2m-transport.env
    volumes:
      - ./jnks-iot-transports/lwm2m/conf:/config
      - ../log/jnks-iot-transports/lwm2m:/var/log/jnks-iot-lwm2m-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-snmp-transport:
    restart: always
    image: "${DOCKER_REPO}/${SNMP_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "1620:1620/udp"
    environment:
      TZ: Asia/Shanghai
      JNKS_IOT_SERVICE_ID: jnks-iot-snmp-transport
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - jnks-iot-transports/snmp/jnks-iot-snmp-transport.env
    volumes:
      - ./jnks-iot-transports/snmp/conf:/config
      - ../log/jnks-iot-transports/snmp:/var/log/jnks-iot-snmp-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-tcp-transport1:
    restart: always
    image: "${DOCKER_REPO}/${TCP_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      # 只发临时宿主端口：所有 TCP 实例监听同一容器端口 5683，对外统一由入口网关（nginx-gateway）转发
      - "5683"
      - "8087"
    environment:
      TZ: Asia/Shanghai
      JNKS_IOT_SERVICE_ID: jnks-iot-tcp-transport1
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - jnks-iot-transports/tcp/jnks-iot-tcp-transport.env
    volumes:
      - ./jnks-iot-transports/tcp/conf:/config
      - ../log/jnks-iot-transports/tcp:/var/log/jnks-iot-tcp-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-tcp-transport2:
    restart: always
    image: "${DOCKER_REPO}/${TCP_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "5683"
      - "8087"
    environment:
      TZ: Asia/Shanghai
      JNKS_IOT_SERVICE_ID: jnks-iot-tcp-transport2
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - jnks-iot-transports/tcp/jnks-iot-tcp-transport.env
    volumes:
      - ./jnks-iot-transports/tcp/conf:/config
      - ../log/jnks-iot-transports/tcp:/var/log/jnks-iot-tcp-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  # UDP transport 走 host 网络：容器直接绑宿主机端口，出站源地址天然是 192.168.222.240，
  # 不再经过 docker bridge 的 NAT/conntrack。原因见 docker/DEPLOY.md「UDP transport 走 host 网络」。
  # 两个实例靠 SO_REUSEPORT（transport.udp.reuse_port=true）共享同一组 UDP 端口，内核按四元组哈希分派。
  jnks-iot-udp-transport1:
    restart: always
    image: "${DOCKER_REPO}/${UDP_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      JNKS_IOT_SERVICE_ID: jnks-iot-udp-transport1
      # 8088 已被网关的 127.0.0.1:8088:4200 占用，两个实例各用一个独立管理端口
      HTTP_BIND_PORT: "18088"
      # host 网络下走宿主机回环，不再用 docker 网络里的服务名
      ZOOKEEPER_URL: "127.0.0.1:2181"
      JNKS_IOT_KAFKA_SERVERS: "127.0.0.1:9092"
      REDIS_HOST: "127.0.0.1"
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    # Kafka 的 advertised listener 是 kafka:9092，host 网络下容器仍用自己的 /etc/hosts，
    # 需要把 kafka 指到宿主机回环
    extra_hosts:
      - "kafka:127.0.0.1"
    env_file:
      - jnks-iot-transports/udp/jnks-iot-udp-transport.env
    volumes:
      - ./jnks-iot-transports/udp/conf:/config
      - ../log/jnks-iot-transports/udp:/var/log/jnks-iot-udp-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-udp-transport2:
    restart: always
    image: "${DOCKER_REPO}/${UDP_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      JNKS_IOT_SERVICE_ID: jnks-iot-udp-transport2
      HTTP_BIND_PORT: "18089"
      ZOOKEEPER_URL: "127.0.0.1:2181"
      JNKS_IOT_KAFKA_SERVERS: "127.0.0.1:9092"
      REDIS_HOST: "127.0.0.1"
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    extra_hosts:
      - "kafka:127.0.0.1"
    env_file:
      - jnks-iot-transports/udp/jnks-iot-udp-transport.env
    volumes:
      - ./jnks-iot-transports/udp/conf:/config
      - ../log/jnks-iot-transports/udp:/var/log/jnks-iot-udp-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  # Web UI：nginx 直接发静态文件（前端产物已打进镜像），不再是 Node/Express 服务，也不需要 env 文件。
  # 两个副本纯粹是为了重启/升级时界面不断（入口网关按 least_conn 分发）。
  jnks-iot-web-ui1:
    environment:
      TZ: Asia/Shanghai
    restart: always
    image: "${DOCKER_REPO}/${WEB_UI_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "8080"
  jnks-iot-web-ui2:
    environment:
      TZ: Asia/Shanghai
    restart: always
    image: "${DOCKER_REPO}/${WEB_UI_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "8080"
  jnks-iot-vc-executor1:
    restart: always
    image: "${DOCKER_REPO}/${JNKS_IOT_VC_EXECUTOR_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "8081"
    environment:
      TZ: Asia/Shanghai
      JNKS_IOT_SERVICE_ID: jnks-iot-vc-executor1
      JAVA_OPTS: "${JAVA_OPTS}"
    env_file:
      - jnks-iot-vc-executor/jnks-iot-vc-executor.env
    volumes:
      - ./jnks-iot-vc-executor/conf:/config
      - ../log/jnks-iot-vc-executor:/var/log/jnks-iot-vc-executor
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-vc-executor2:
    restart: always
    image: "${DOCKER_REPO}/${JNKS_IOT_VC_EXECUTOR_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "8081"
    environment:
      TZ: Asia/Shanghai
      JNKS_IOT_SERVICE_ID: jnks-iot-vc-executor2
      JAVA_OPTS: "${JAVA_OPTS}"
    env_file:
      - jnks-iot-vc-executor/jnks-iot-vc-executor.env
    volumes:
      - ./jnks-iot-vc-executor/conf:/config
      - ../log/jnks-iot-vc-executor:/var/log/jnks-iot-vc-executor
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  # 统一入口网关（nginx）：4200/443 路由 + TLS、18883 MQTT、5683 TCP。
  # UDP 不再走网关 —— transport 已改 host 网络，直接绑宿主机端口，设备直连宿主机 IP:端口。
  # 配置：./nginx/config/（nginx.conf + locations.conf + proxy-headers.conf）
  # 证书：./nginx/certs/（首次用 bash nginx/gen-self-signed-cert.sh 生成自签，生产换成真实证书）
  nginx-gateway:
    environment:
      TZ: Asia/Shanghai
    restart: always
    container_name: "${LOAD_BALANCER_NAME}"
    image: "${NGINX_GATEWAY_IMAGE}"
    ports:
     # HTTP 只发 loopback：宿主上已有一个统一入口 nginx 占着 4200（/jnks/nginx/），
     # 它按路径前缀挂了多个项目，本网关作为它的一个后端，由它反代进来。
     # 直接写 "4200:4200" 会和宿主 nginx 抢端口。
     - "127.0.0.1:8088:4200"
     - "443:443"
     # 对外 18883；MQTT transport 容器内仍是 1883，由 nginx 转发（见 nginx.conf 的 stream 段）
     - "18883:18883"
     - "5683:5683"
    volumes:
     - ./nginx/config/nginx.conf:/etc/nginx/nginx.conf:ro
     - ./nginx/config:/etc/nginx/tbconf:ro
     - ./nginx/certs:/etc/nginx/certs:ro
    links:
        - jnks-iot-core1
        - jnks-iot-core2
        - jnks-iot-web-ui1
        - jnks-iot-web-ui2
        - jnks-iot-mqtt-transport1
        - jnks-iot-mqtt-transport2
        - jnks-iot-http-transport1
        - jnks-iot-http-transport2
        - jnks-iot-tcp-transport1
        - jnks-iot-tcp-transport2
    depends_on:
        - jnks-iot-core1
        - jnks-iot-core2
        - jnks-iot-web-ui1
        - jnks-iot-web-ui2
        - jnks-iot-mqtt-transport1
        - jnks-iot-mqtt-transport2
        - jnks-iot-http-transport1
        - jnks-iot-http-transport2
        - jnks-iot-tcp-transport1
        - jnks-iot-tcp-transport2
        - jnks-iot-udp-transport1
        - jnks-iot-udp-transport2
