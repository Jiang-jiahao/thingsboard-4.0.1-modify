
version: '3.0'

services:
  zookeeper:
    restart: always
    image: "zookeeper:3.8.1"
    ports:
      - "2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888;zookeeper:2181
      ZOO_ADMINSERVER_ENABLED: "false"
  jnks-iot-js-executor:
    restart: always
    image: "${DOCKER_REPO}/${JS_EXECUTOR_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    deploy:
      replicas: 10
    env_file:
      - jnks-iot-js-executor/jnks-iot-js-executor.env
  jnks-iot-core1:
    restart: always
    image: "${DOCKER_REPO}/${JNKS_IOT_CORE_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "8080"
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "30"
    environment:
      JNKS_IOT_SERVICE_ID: jnks-iot-core1
      JAVA_OPTS: "${JAVA_OPTS}"
    env_file:
      - jnks-iot-core/jnks-iot-core.env
    volumes:
      - ./jnks-iot-core/conf:/config
      - ./jnks-iot-core/log:/var/log/jnks-iot-core
    depends_on:
      - zookeeper
      - jnks-iot-js-executor
      - jnks-iot-rule-engine1
      - jnks-iot-rule-engine2
  jnks-iot-core2:
    restart: always
    image: "${DOCKER_REPO}/${JNKS_IOT_CORE_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "8080"
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "30"
    environment:
      JNKS_IOT_SERVICE_ID: jnks-iot-core2
      JAVA_OPTS: "${JAVA_OPTS}"
    env_file:
      - jnks-iot-core/jnks-iot-core.env
    volumes:
      - ./jnks-iot-core/conf:/config
      - ./jnks-iot-core/log:/var/log/jnks-iot-core
    depends_on:
      - zookeeper
      - jnks-iot-js-executor
      - jnks-iot-rule-engine1
      - jnks-iot-rule-engine2
  jnks-iot-rule-engine1:
    restart: always
    image: "${DOCKER_REPO}/${JNKS_IOT_RULE_ENGINE_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "8080"
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "30"
    environment:
      JNKS_IOT_SERVICE_ID: jnks-iot-rule-engine1
      JAVA_OPTS: "${JAVA_OPTS}"
    env_file:
      - jnks-iot-rule-engine/jnks-iot-rule-engine.env
    volumes:
      - ./jnks-iot-rule-engine/conf:/config
      - ./jnks-iot-rule-engine/log:/var/log/jnks-iot-rule-engine
    depends_on:
      - zookeeper
      - jnks-iot-js-executor
  jnks-iot-rule-engine2:
    restart: always
    image: "${DOCKER_REPO}/${JNKS_IOT_RULE_ENGINE_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "8080"
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "30"
    environment:
      JNKS_IOT_SERVICE_ID: jnks-iot-rule-engine2
      JAVA_OPTS: "${JAVA_OPTS}"
    env_file:
      - jnks-iot-rule-engine/jnks-iot-rule-engine.env
    volumes:
      - ./jnks-iot-rule-engine/conf:/config
      - ./jnks-iot-rule-engine/log:/var/log/jnks-iot-rule-engine
    depends_on:
      - zookeeper
      - jnks-iot-js-executor
  jnks-iot-mqtt-transport1:
    restart: always
    image: "${DOCKER_REPO}/${MQTT_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "1883"
    environment:
      JNKS_IOT_SERVICE_ID: jnks-iot-mqtt-transport1
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - jnks-iot-transports/mqtt/jnks-iot-mqtt-transport.env
    volumes:
      - ./jnks-iot-transports/mqtt/conf:/config
      - ./jnks-iot-transports/mqtt/log:/var/log/jnks-iot-mqtt-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-mqtt-transport2:
    restart: always
    image: "${DOCKER_REPO}/${MQTT_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "1883"
    environment:
      JNKS_IOT_SERVICE_ID: jnks-iot-mqtt-transport2
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - jnks-iot-transports/mqtt/jnks-iot-mqtt-transport.env
    volumes:
      - ./jnks-iot-transports/mqtt/conf:/config
      - ./jnks-iot-transports/mqtt/log:/var/log/jnks-iot-mqtt-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-http-transport1:
    restart: always
    image: "${DOCKER_REPO}/${HTTP_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "8081"
    environment:
      JNKS_IOT_SERVICE_ID: jnks-iot-http-transport1
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - jnks-iot-transports/http/jnks-iot-http-transport.env
    volumes:
      - ./jnks-iot-transports/http/conf:/config
      - ./jnks-iot-transports/http/log:/var/log/jnks-iot-http-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-http-transport2:
    restart: always
    image: "${DOCKER_REPO}/${HTTP_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "8081"
    environment:
      JNKS_IOT_SERVICE_ID: jnks-iot-http-transport2
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - jnks-iot-transports/http/jnks-iot-http-transport.env
    volumes:
      - ./jnks-iot-transports/http/conf:/config
      - ./jnks-iot-transports/http/log:/var/log/jnks-iot-http-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-coap-transport:
    restart: always
    image: "${DOCKER_REPO}/${COAP_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "5683:5683/udp"
    environment:
      JNKS_IOT_SERVICE_ID: jnks-iot-coap-transport
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - jnks-iot-transports/coap/jnks-iot-coap-transport.env
    volumes:
      - ./jnks-iot-transports/coap/conf:/config
      - ./jnks-iot-transports/coap/log:/var/log/jnks-iot-coap-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-lwm2m-transport:
    restart: always
    image: "${DOCKER_REPO}/${LWM2M_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "5685:5685/udp"
      - "5686:5686/udp"
    environment:
      JNKS_IOT_SERVICE_ID: jnks-iot-lwm2m-transport
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - jnks-iot-transports/lwm2m/jnks-iot-lwm2m-transport.env
    volumes:
      - ./jnks-iot-transports/lwm2m/conf:/config
      - ./jnks-iot-transports/lwm2m/log:/var/log/jnks-iot-lwm2m-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-snmp-transport:
    restart: always
    image: "${DOCKER_REPO}/${SNMP_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "1620:1620/udp"
    environment:
      JNKS_IOT_SERVICE_ID: jnks-iot-snmp-transport
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - jnks-iot-transports/snmp/jnks-iot-snmp-transport.env
    volumes:
      - ./jnks-iot-transports/snmp/conf:/config
      - ./jnks-iot-transports/snmp/log:/var/log/jnks-iot-snmp-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-tcp-transport1:
    restart: always
    image: "${DOCKER_REPO}/${TCP_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      # 只发临时宿主端口：所有 TCP 实例监听同一容器端口 5683，对外统一由入口网关（nginx-gateway）转发
      - "5683"
      - "8087"
    environment:
      JNKS_IOT_SERVICE_ID: jnks-iot-tcp-transport1
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - jnks-iot-transports/tcp/jnks-iot-tcp-transport.env
    volumes:
      - ./jnks-iot-transports/tcp/conf:/config
      - ./jnks-iot-transports/tcp/log:/var/log/jnks-iot-tcp-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-tcp-transport2:
    restart: always
    image: "${DOCKER_REPO}/${TCP_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "5683"
      - "8087"
    environment:
      JNKS_IOT_SERVICE_ID: jnks-iot-tcp-transport2
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - jnks-iot-transports/tcp/jnks-iot-tcp-transport.env
    volumes:
      - ./jnks-iot-transports/tcp/conf:/config
      - ./jnks-iot-transports/tcp/log:/var/log/jnks-iot-tcp-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-udp-transport1:
    restart: always
    image: "${DOCKER_REPO}/${UDP_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      # 同上：两个 UDP 实例都监听容器端口 5684，由入口网关按源地址哈希转发
      - "5684/udp"
      - "8088"
    environment:
      JNKS_IOT_SERVICE_ID: jnks-iot-udp-transport1
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - jnks-iot-transports/udp/jnks-iot-udp-transport.env
    volumes:
      - ./jnks-iot-transports/udp/conf:/config
      - ./jnks-iot-transports/udp/log:/var/log/jnks-iot-udp-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-udp-transport2:
    restart: always
    image: "${DOCKER_REPO}/${UDP_TRANSPORT_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "5684/udp"
      - "8088"
    environment:
      JNKS_IOT_SERVICE_ID: jnks-iot-udp-transport2
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - jnks-iot-transports/udp/jnks-iot-udp-transport.env
    volumes:
      - ./jnks-iot-transports/udp/conf:/config
      - ./jnks-iot-transports/udp/log:/var/log/jnks-iot-udp-transport
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  # Web UI：nginx 直接发静态文件（前端产物已打进镜像），不再是 Node/Express 服务，也不需要 env 文件。
  # 两个副本纯粹是为了重启/升级时界面不断（入口网关按 least_conn 分发）。
  jnks-iot-web-ui1:
    restart: always
    image: "${DOCKER_REPO}/${WEB_UI_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "8080"
  jnks-iot-web-ui2:
    restart: always
    image: "${DOCKER_REPO}/${WEB_UI_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "8080"
  jnks-iot-vc-executor1:
    restart: always
    image: "${DOCKER_REPO}/${JNKS_IOT_VC_EXECUTOR_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "8081"
    environment:
      JNKS_IOT_SERVICE_ID: jnks-iot-vc-executor1
      JAVA_OPTS: "${JAVA_OPTS}"
    env_file:
      - jnks-iot-vc-executor/jnks-iot-vc-executor.env
    volumes:
      - ./jnks-iot-vc-executor/conf:/config
      - ./jnks-iot-vc-executor/log:/var/log/jnks-iot-vc-executor
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  jnks-iot-vc-executor2:
    restart: always
    image: "${DOCKER_REPO}/${JNKS_IOT_VC_EXECUTOR_DOCKER_NAME}:${JNKS_IOT_VERSION}"
    ports:
      - "8081"
    environment:
      JNKS_IOT_SERVICE_ID: jnks-iot-vc-executor2
      JAVA_OPTS: "${JAVA_OPTS}"
    env_file:
      - jnks-iot-vc-executor/jnks-iot-vc-executor.env
    volumes:
      - ./jnks-iot-vc-executor/conf:/config
      - ./jnks-iot-vc-executor/log:/var/log/jnks-iot-vc-executor
    depends_on:
      - zookeeper
      - jnks-iot-core1
      - jnks-iot-core2
  # 统一入口网关（nginx）：80/443 路由 + TLS、1883 MQTT、5683/5684 TCP/UDP，全部入口就这一个容器。
  # 替代了原来的两个代理 —— haproxy-certbot（80/443/1883 + certbot 自动证书）与 nginx-tcpudp（5683/5684）。
  # 配置：./nginx/config/（nginx.conf + locations.conf + proxy-headers.conf）
  # 证书：./nginx/certs/（首次用 bash nginx/gen-self-signed-cert.sh 生成自签，生产换成真实证书）
  nginx-gateway:
    restart: always
    container_name: "${LOAD_BALANCER_NAME}"
    image: "${NGINX_GATEWAY_IMAGE}"
    ports:
     - "80:80"
     - "443:443"
     - "1883:1883"
     - "5683:5683"
     - "5684:5684/udp"
     # 档案级自定义监听端口（档案「udp测试设备配置」声明了 55566）；
     # 转发走透明绑定（后端直接看到真实设备 IP+端口）见 nginx.conf 的 stream 段
     - "55566:55566/udp"
     # 演示用第二个档案端口（见 nginx.conf 的同号 upstream）
     - "55570:55570/udp"
    # 透明绑定（proxy_bind ... transparent）要 bind 非本机地址，需要 CAP_NET_ADMIN。
    # 少了这一条，55566 的每个数据报都会因 EPERM 发不出去（nginx error.log 里能看到 bind 失败）。
    cap_add:
     - NET_ADMIN
    volumes:
     - ./nginx/config/nginx.conf:/etc/nginx/nginx.conf:ro
     - ./nginx/config:/etc/nginx/tbconf:ro
     - ./nginx/certs:/etc/nginx/certs:ro
    links:
        - jnks-iot-core1
        - jnks-iot-core2
        - jnks-iot-web-ui1
        - jnks-iot-web-ui2
        - jnks-iot-mqtt-transport1
        - jnks-iot-mqtt-transport2
        - jnks-iot-http-transport1
        - jnks-iot-http-transport2
        - jnks-iot-tcp-transport1
        - jnks-iot-tcp-transport2
        - jnks-iot-udp-transport1
        - jnks-iot-udp-transport2
    depends_on:
        - jnks-iot-core1
        - jnks-iot-core2
        - jnks-iot-web-ui1
        - jnks-iot-web-ui2
        - jnks-iot-mqtt-transport1
        - jnks-iot-mqtt-transport2
        - jnks-iot-http-transport1
        - jnks-iot-http-transport2
        - jnks-iot-tcp-transport1
        - jnks-iot-tcp-transport2
        - jnks-iot-udp-transport1
        - jnks-iot-udp-transport2
