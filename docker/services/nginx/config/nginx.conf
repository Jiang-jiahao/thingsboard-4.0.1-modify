# JnksIOT 统一入口网关：替代原来的 haproxy-certbot + nginx-tcpudp 两个代理。
#
# 入口分工（对应原 haproxy.cfg 的 ACL / 后端）：
#   /api/v1/**     → jnks-iot-http-transport1/2    设备 HTTP 接入
#   /api/images/** → jnks-iot-core1/2              图片资源（限流更宽：1000 次/10 秒）
#   /api/** 等     → jnks-iot-core1/2              REST API（100 次/10 秒、300 次/1 分钟）
#   /**            → jnks-iot-web-ui1/2            前端静态文件
#   1883           → jnks-iot-mqtt-transport1/2    MQTT
#   5683 / 5684udp → jnks-iot-{tcp,udp}-transport1/2
#
# 与原 haproxy 版的差异：
#   - 没有 certbot 自动签发；证书由 certs/ 提供（首次可用 gen-self-signed-cert.sh 生成自签）
#   - 健康检查是被动的（连接失败即摘除）；nginx 默认会在连接失败时换一个上游重试，
#     所以切换时不会像原来那样漏掉请求
#   - 没有 haproxy 那个 9999 统计页
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
}

stream {
    # Docker 内置 DNS。valid=10s + 上游 resolve 参数让容器重建换 IP 后自动跟上，
    # 不需要重启本网关（少了这个就只能靠重启）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format stream '$remote_addr:$remote_port -> $upstream_addr [$time_local] $status $bytes_sent $bytes_received';
    access_log /dev/stdout stream;

    # MQTT：连接级负载均衡
    upstream mqtt_transports {
        zone mqtt_transports 64k;
        least_conn;
        server jnks-iot-mqtt-transport1:1883 resolve max_fails=3 fail_timeout=5s;
        server jnks-iot-mqtt-transport2:1883 resolve max_fails=3 fail_timeout=5s;
    }
    server {
        listen 1883;
        proxy_pass mqtt_transports;
        proxy_timeout 3h;              # 设备长连接
        proxy_connect_timeout 5s;
    }

    # TCP：一条连接建立后固定在后端
    upstream tcp_transports {
        zone tcp_transports 64k;
        least_conn;
        server jnks-iot-tcp-transport1:5683 resolve max_fails=3 fail_timeout=5s;
        server jnks-iot-tcp-transport2:5683 resolve max_fails=3 fail_timeout=5s;
    }
    server {
        listen 5683;
        proxy_pass tcp_transports;
        proxy_timeout 3h;
        proxy_connect_timeout 5s;
    }

    # UDP：必须按源地址哈希。UDP 会话在传输层按 (本地端口, 对端地址) 键控，数据报若在两个副本
    # 之间跳，会话会被反复重建（设备侧表现为掉线/重复鉴权）。
    upstream udp_transports {
        zone udp_transports 64k;
        hash $remote_addr consistent;
        server jnks-iot-udp-transport1:5684 resolve;
        server jnks-iot-udp-transport2:5684 resolve;
    }
    server {
        listen 5684 udp;
        proxy_pass udp_transports;
        proxy_timeout 60s;
        # 这里不要写 proxy_responses：它会把「一个客户端数据报之后」的第 2 个及以后的
        # 上游数据报丢掉（实测 oneway RPC / 遥测上行 / NONE 鉴权会失败）。
    }


    # 档案级自定义监听端口：设备档案「udp测试设备配置」声明了 55566（udpProfileServerBindPort）。
    # 平台侧每个 transport 实例都已监听该端口，这里只负责让外部能连进来。
    #
    # 透明绑定（proxy_bind ... transparent）：nginx 用**设备自己的源地址**作为上游 socket 的源地址，
    # 后端 socket 的对端就是真实设备 —— 不需要 PROXY 头，也不需要后端记住「代理侧对端 → 真实客户端」
    # 的映射（那条路 transport 重启后映射丢失、而 nginx 会话还活着不再带头，设备会永久失联）。
    # 代价：网关容器必须给 CAP_NET_ADMIN（见 docker-compose.yml 的 cap_add），否则 bind 非本机地址 EPERM。
    #
    # **端口必须一起带上**（$remote_addr:$remote_port）。只写 $remote_addr 时源端口是 nginx 的临时端口，
    # 而 UDP 会话键是 (本地端口, 对端地址) —— 端口每包一变，就会每个数据报都重建一次会话
    # （实测：只带 IP 时连发 6 包触发 6 次 "new inbound datagram peer"，下行也随之发到临时端口而丢失）。
    upstream udp_ports_55566 {
        zone udp_ports_55566 64k;
        hash $remote_addr consistent;
        server jnks-iot-udp-transport1:55566 resolve;
        server jnks-iot-udp-transport2:55566 resolve;
    }
    server {
        listen 55566 udp;
        proxy_pass udp_ports_55566;
        proxy_bind $remote_addr:$remote_port transparent;
        # 每条客户端数据报独立成会话：nginx 发完 1 条就关会话，下一条重新建会话。
        # 也是后端故障转移的前提 —— 长会话模式下 nginx 观察不到后端失败，那台会一直留在哈希环里。
        proxy_requests 1;
        # 必须配 responses 0：会话不等响应、发完即关。否则会话会等一个永远不来的响应，
        # 占满 worker_connections(4096) —— 实测约 1700pps 就丢 55% 包。
        proxy_responses 0;
        proxy_timeout 60s;
    }

    # 演示档案「UDP 被动查询档案」的监听端口（55570）：配置与 55566 完全相同。
    upstream udp_ports_55570 {
        zone udp_ports_55570 64k;
        hash $remote_addr consistent;
        server jnks-iot-udp-transport1:55570 resolve;
        server jnks-iot-udp-transport2:55570 resolve;
    }
    server {
        listen 55570 udp;
        proxy_pass udp_ports_55570;
        proxy_bind $remote_addr:$remote_port transparent;
        proxy_requests 1;
        proxy_responses 0;
        proxy_timeout 60s;
    }

    # 测试档案「qa-defer」的监听端口（15602）：配置与 55566 完全相同。
    upstream udp_ports_15602 {
        zone udp_ports_15602 64k;
        hash $remote_addr consistent;
        server jnks-iot-udp-transport1:15602 resolve;
        server jnks-iot-udp-transport2:15602 resolve;
    }
    server {
        listen 15602 udp;
        proxy_pass udp_ports_15602;
        proxy_bind $remote_addr:$remote_port transparent;
        proxy_requests 1;
        proxy_responses 0;
        proxy_timeout 60s;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # ------------------------------------------------------------ 黑白名单
    # 对应原 haproxy.cfg 的 blocklist.txt / trustlist.txt
    geo $jnks_iot_blocked {
        default 0;
        5.136.0.0/13      1;
        217.199.254.1     1;
    }
    geo $jnks_iot_trusted {
        default 0;
        127.0.0.0/8       1;      # 本机
        10.0.0.0/8        1;
        172.16.0.0/12     1;      # docker 网段
        192.168.0.0/16    1;
    }
    # 受信任来源给空 key => 不参与任何限流
    map $jnks_iot_trusted $jnks_iot_limit_key {
        1  "";
        0  $binary_remote_addr;
    }

    # ------------------------------------------------------------ 限流
    # 对应原 haproxy 的 stick-table 规则（速率按「每源 IP」算）
    limit_req_zone $jnks_iot_limit_key zone=api_10s:10m rate=10r/s;    # /api   100 次/10 秒
    limit_req_zone $jnks_iot_limit_key zone=api_1m:10m  rate=5r/s;     # /api   300 次/1 分钟
    limit_req_zone $jnks_iot_limit_key zone=img_10s:10m rate=100r/s;   # /api/images 1000 次/10 秒
    limit_conn_zone $jnks_iot_limit_key zone=perip:10m;                # 每 IP 并发连接数
    limit_req_status 429;
    limit_conn_status 429;

    # WebSocket 升级头：界面的实时推送走 /api/ws，漏了这个会让界面能打开但数据不刷新
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ------------------------------------------------------------ 上游
    upstream jnks_iot_api {
        zone jnks_iot_api 64k;
        keepalive 32;
        server jnks-iot-core1:8080 resolve max_fails=3 fail_timeout=5s;
        server jnks-iot-core2:8080 resolve max_fails=3 fail_timeout=5s;
    }
    upstream jnks_iot_web {
        zone jnks_iot_web 64k;
        keepalive 32;
        server jnks-iot-web-ui1:8080 resolve max_fails=3 fail_timeout=5s;
        server jnks-iot-web-ui2:8080 resolve max_fails=3 fail_timeout=5s;
    }
    upstream jnks_iot_http {
        zone jnks_iot_http 64k;
        keepalive 32;
        server jnks-iot-http-transport1:8081 resolve max_fails=3 fail_timeout=5s;
        server jnks-iot-http-transport2:8081 resolve max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80 default_server;
        server_name _;

        if ($jnks_iot_blocked) { return 403; }
        limit_conn perip 50;
        client_max_body_size 128m;     # OTA 包 / 资源上传

        include /etc/nginx/tbconf/locations.conf;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/tls.pem;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        if ($jnks_iot_blocked) { return 403; }
        limit_conn perip 50;
        client_max_body_size 128m;

        include /etc/nginx/tbconf/locations.conf;
    }
}
