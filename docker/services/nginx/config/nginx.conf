# JnksIOT 统一入口网关：替代原来的 haproxy-certbot + nginx-tcpudp 两个代理。
#
# 入口分工（对应原 haproxy.cfg 的 ACL / 后端）：
#   /api/v1/**     → jnks-iot-http-transport1/2    设备 HTTP 接入
#   /api/images/** → jnks-iot-core1/2              图片资源（限流更宽：1000 次/10 秒）
#   /api/** 等     → jnks-iot-core1/2              REST API（100 次/10 秒、300 次/1 分钟）
#   /**            → jnks-iot-web-ui1/2            前端静态文件（本机 HTTP 在容器内 4200，由宿主 nginx 反代进来）
#   18883          → jnks-iot-mqtt-transport1/2    MQTT（后端仍监听 1883）
#   5683           → jnks-iot-tcp-transport1/2    TCP 接入
#   UDP 端口       → 不经网关：UDP transport 已改 host 网络，直接绑宿主机端口，设备直连宿主机 IP:端口
#
# 与原 haproxy 版的差异：
#   - 没有 certbot 自动签发；证书由 certs/ 提供（首次可用 gen-self-signed-cert.sh 生成自签）
#   - 健康检查是被动的（连接失败即摘除）；nginx 默认会在连接失败时换一个上游重试，
#     所以切换时不会像原来那样漏掉请求
#   - 没有 haproxy 那个 9999 统计页
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
}

stream {
    # Docker 内置 DNS。valid=10s + 上游 resolve 参数让容器重建换 IP 后自动跟上，
    # 不需要重启本网关（少了这个就只能靠重启）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format stream '$remote_addr:$remote_port -> $upstream_addr [$time_local] $status $bytes_sent $bytes_received';
    access_log /dev/stdout stream;

    # MQTT：连接级负载均衡
    upstream mqtt_transports {
        zone mqtt_transports 64k;
        least_conn;
        server jnks-iot-mqtt-transport1:1883 resolve max_fails=3 fail_timeout=5s;
        server jnks-iot-mqtt-transport2:1883 resolve max_fails=3 fail_timeout=5s;
    }
    server {
        # 对外 18883，后端 transport 仍监听 1883（见上面的 upstream）——
        # 只改网关这一层，设备改连接端口即可，不需要重建 MQTT transport 容器。
        listen 18883;
        proxy_pass mqtt_transports;
        proxy_timeout 3h;              # 设备长连接
        proxy_connect_timeout 5s;
    }

    # TCP：一条连接建立后固定在后端
    upstream tcp_transports {
        zone tcp_transports 64k;
        least_conn;
        server jnks-iot-tcp-transport1:5683 resolve max_fails=3 fail_timeout=5s;
        server jnks-iot-tcp-transport2:5683 resolve max_fails=3 fail_timeout=5s;
    }
    server {
        listen 5683;
        proxy_pass tcp_transports;
        proxy_timeout 3h;
        proxy_connect_timeout 5s;
    }

}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # ------------------------------------------------------------ 真实客户端 IP
    # 本网关前面还有一层宿主 nginx（持有 4200，按路径反代进来），所以这里看到的
    # $remote_addr 是回环/内网地址。而下面的受信任名单包含 127/8、10/8、172.16/12、
    # 192.168/16 —— 一旦命中，限流 key 变成空串，限流和黑名单会「静默失效」：
    # 没有报错、日志正常，但等于全关。必须从 X-Forwarded-For 还原真实客户端地址。
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # ------------------------------------------------------------ 黑白名单
    # 对应原 haproxy.cfg 的 blocklist.txt / trustlist.txt
    geo $jnks_iot_blocked {
        default 0;
        5.136.0.0/13      1;
        217.199.254.1     1;
    }
    geo $jnks_iot_trusted {
        default 0;
        127.0.0.0/8       1;      # 本机
        10.0.0.0/8        1;
        172.16.0.0/12     1;      # docker 网段
        192.168.0.0/16    1;
    }
    # 受信任来源给空 key => 不参与任何限流
    map $jnks_iot_trusted $jnks_iot_limit_key {
        1  "";
        0  $binary_remote_addr;
    }

    # ------------------------------------------------------------ 限流
    # 对应原 haproxy 的 stick-table 规则（速率按「每源 IP」算）
    limit_req_zone $jnks_iot_limit_key zone=api_10s:10m rate=10r/s;    # /api   100 次/10 秒
    limit_req_zone $jnks_iot_limit_key zone=api_1m:10m  rate=5r/s;     # /api   300 次/1 分钟
    limit_req_zone $jnks_iot_limit_key zone=img_10s:10m rate=100r/s;   # /api/images 1000 次/10 秒
    limit_conn_zone $jnks_iot_limit_key zone=perip:10m;                # 每 IP 并发连接数
    limit_req_status 429;
    limit_conn_status 429;

    # WebSocket 升级头：界面的实时推送走 /api/ws，漏了这个会让界面能打开但数据不刷新
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ------------------------------------------------------------ 上游
    upstream jnks_iot_api {
        zone jnks_iot_api 64k;
        keepalive 32;
        server jnks-iot-core1:8080 resolve max_fails=3 fail_timeout=5s;
        server jnks-iot-core2:8080 resolve max_fails=3 fail_timeout=5s;
    }
    upstream jnks_iot_web {
        zone jnks_iot_web 64k;
        keepalive 32;
        server jnks-iot-web-ui1:8080 resolve max_fails=3 fail_timeout=5s;
        server jnks-iot-web-ui2:8080 resolve max_fails=3 fail_timeout=5s;
    }
    upstream jnks_iot_http {
        zone jnks_iot_http 64k;
        keepalive 32;
        server jnks-iot-http-transport1:8081 resolve max_fails=3 fail_timeout=5s;
        server jnks-iot-http-transport2:8081 resolve max_fails=3 fail_timeout=5s;
    }

    server {
        listen 4200 default_server;
        server_name _;

        if ($jnks_iot_blocked) { return 403; }
        limit_conn perip 50;
        client_max_body_size 128m;     # OTA 包 / 资源上传

        include /etc/nginx/tbconf/locations.conf;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/tls.pem;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        if ($jnks_iot_blocked) { return 403; }
        limit_conn perip 50;
        client_max_body_size 128m;

        include /etc/nginx/tbconf/locations.conf;
    }
}
