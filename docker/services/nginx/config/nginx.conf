# ThingsBoard 统一入口网关：替代原来的 haproxy-certbot + nginx-tcpudp 两个代理。
#
# 入口分工（对应原 haproxy.cfg 的 ACL / 后端）：
#   /api/v1/**     → tb-http-transport1/2    设备 HTTP 接入
#   /api/images/** → tb-core1/2              图片资源（限流更宽：1000 次/10 秒）
#   /api/** 等     → tb-core1/2              REST API（100 次/10 秒、300 次/1 分钟）
#   /**            → tb-web-ui1/2            前端静态文件
#   1883           → tb-mqtt-transport1/2    MQTT
#   5683 / 5684udp → tb-{tcp,udp}-transport1/2
#
# 与原 haproxy 版的差异：
#   - 没有 certbot 自动签发；证书由 certs/ 提供（首次可用 gen-self-signed-cert.sh 生成自签）
#   - 健康检查是被动的（连接失败即摘除）；nginx 默认会在连接失败时换一个上游重试，
#     所以切换时不会像原来那样漏掉请求
#   - 没有 haproxy 那个 9999 统计页
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
}

stream {
    # Docker 内置 DNS。valid=10s + 上游 resolve 参数让容器重建换 IP 后自动跟上，
    # 不需要重启本网关（少了这个就只能靠重启）。
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format stream '$remote_addr:$remote_port -> $upstream_addr [$time_local] $status $bytes_sent $bytes_received';
    access_log /dev/stdout stream;

    # MQTT：连接级负载均衡
    upstream mqtt_transports {
        zone mqtt_transports 64k;
        least_conn;
        server tb-mqtt-transport1:1883 resolve max_fails=3 fail_timeout=5s;
        server tb-mqtt-transport2:1883 resolve max_fails=3 fail_timeout=5s;
    }
    server {
        listen 1883;
        proxy_pass mqtt_transports;
        proxy_timeout 3h;              # 设备长连接
        proxy_connect_timeout 5s;
    }

    # TCP：一条连接建立后固定在后端
    upstream tcp_transports {
        zone tcp_transports 64k;
        least_conn;
        server tb-tcp-transport1:5683 resolve max_fails=3 fail_timeout=5s;
        server tb-tcp-transport2:5683 resolve max_fails=3 fail_timeout=5s;
    }
    server {
        listen 5683;
        proxy_pass tcp_transports;
        proxy_timeout 3h;
        proxy_connect_timeout 5s;
    }

    # UDP：必须按源地址哈希。UDP 会话在传输层按 (本地端口, 对端地址) 键控，数据报若在两个副本
    # 之间跳，会话会被反复重建（设备侧表现为掉线/重复鉴权）。
    upstream udp_transports {
        zone udp_transports 64k;
        hash $remote_addr consistent;
        server tb-udp-transport1:5684 resolve;
        server tb-udp-transport2:5684 resolve;
    }
    server {
        listen 5684 udp;
        proxy_pass udp_transports;
        proxy_timeout 60s;
        # 这里不要写 proxy_responses：它会把「一个客户端数据报之后」的第 2 个及以后的
        # 上游数据报丢掉（实测 oneway RPC / 遥测上行 / NONE 鉴权会失败）。
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # ------------------------------------------------------------ 黑白名单
    # 对应原 haproxy.cfg 的 blocklist.txt / trustlist.txt
    geo $tb_blocked {
        default 0;
        5.136.0.0/13      1;
        217.199.254.1     1;
    }
    geo $tb_trusted {
        default 0;
        127.0.0.0/8       1;      # 本机
        10.0.0.0/8        1;
        172.16.0.0/12     1;      # docker 网段
        192.168.0.0/16    1;
    }
    # 受信任来源给空 key => 不参与任何限流
    map $tb_trusted $tb_limit_key {
        1  "";
        0  $binary_remote_addr;
    }

    # ------------------------------------------------------------ 限流
    # 对应原 haproxy 的 stick-table 规则（速率按「每源 IP」算）
    limit_req_zone $tb_limit_key zone=api_10s:10m rate=10r/s;    # /api   100 次/10 秒
    limit_req_zone $tb_limit_key zone=api_1m:10m  rate=5r/s;     # /api   300 次/1 分钟
    limit_req_zone $tb_limit_key zone=img_10s:10m rate=100r/s;   # /api/images 1000 次/10 秒
    limit_conn_zone $tb_limit_key zone=perip:10m;                # 每 IP 并发连接数
    limit_req_status 429;
    limit_conn_status 429;

    # WebSocket 升级头：界面的实时推送走 /api/ws，漏了这个会让界面能打开但数据不刷新
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ------------------------------------------------------------ 上游
    upstream tb_api {
        zone tb_api 64k;
        keepalive 32;
        server tb-core1:8080 resolve max_fails=3 fail_timeout=5s;
        server tb-core2:8080 resolve max_fails=3 fail_timeout=5s;
    }
    upstream tb_web {
        zone tb_web 64k;
        keepalive 32;
        server tb-web-ui1:8080 resolve max_fails=3 fail_timeout=5s;
        server tb-web-ui2:8080 resolve max_fails=3 fail_timeout=5s;
    }
    upstream tb_http {
        zone tb_http 64k;
        keepalive 32;
        server tb-http-transport1:8081 resolve max_fails=3 fail_timeout=5s;
        server tb-http-transport2:8081 resolve max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80 default_server;
        server_name _;

        if ($tb_blocked) { return 403; }
        limit_conn perip 50;
        client_max_body_size 128m;     # OTA 包 / 资源上传

        include /etc/nginx/tbconf/locations.conf;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/tls.pem;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        if ($tb_blocked) { return 403; }
        limit_conn perip 50;
        client_max_body_size 128m;

        include /etc/nginx/tbconf/locations.conf;
    }
}
