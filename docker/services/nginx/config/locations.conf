# 80 / 443 共用的路由规则（对应原 haproxy.cfg 里 http-in、https-in 的 ACL 与 use_backend）

# 设备 HTTP 接入（对应 acl transport_http_acl path_beg /api/v1/）
location ^~ /api/v1/ {
    limit_req zone=api_10s burst=20 nodelay;
    limit_req zone=api_1m  burst=60 nodelay;
    proxy_pass http://jnks_iot_http;
    include /etc/nginx/tbconf/proxy-headers.conf;
}

# 图片资源（对应 acl jnks_iot_images_api_acl 及其更宽的 1000 次/10 秒限流）
# 集合端点 /api/images 不带尾斜杠，必须单独精确匹配：只写 ^~ /api/images/ 时，
# nginx 会把 /api/images 301 到 /api/images/，而后端没有该路径（返回 404），图像库页面因此拿不到数据。
location = /api/images {
    limit_req zone=img_10s burst=100 nodelay;
    proxy_pass http://jnks_iot_api;
    include /etc/nginx/tbconf/proxy-headers.conf;
}

location ^~ /api/images/ {
    limit_req zone=img_10s burst=100 nodelay;
    proxy_pass http://jnks_iot_api;
    include /etc/nginx/tbconf/proxy-headers.conf;
}

# 集合端点的另一种写法：有的前端构建（以及浏览器里缓存的旧 bundle）请求的是 /api/images/?pageSize=...
# Spring Boot 3 不再兼容尾斜杠，后端只有 /api/images，所以在这里去掉斜杠再转发，否则 404。
location = /api/images/ {
    limit_req zone=img_10s burst=100 nodelay;
    rewrite ^/api/images/$ /api/images break;
    proxy_pass http://jnks_iot_api;
    include /etc/nginx/tbconf/proxy-headers.conf;
}

# REST API、规则链静态资源、OAuth 回调等（对应 acl jnks_iot_api_acl）
location ~ ^/(api/|swagger|webjars|v2/|v3/|static/rulenode/|oauth2/|login/oauth2/|static/widgets/|\.well-known/(assetlinks\.json|apple-app-site-association)) {
    limit_req zone=api_10s burst=20 nodelay;
    limit_req zone=api_1m  burst=60 nodelay;
    proxy_pass http://jnks_iot_api;
    include /etc/nginx/tbconf/proxy-headers.conf;
}

# 其余全部交给前端（含 SPA 的静态文件与深链接）
location / {
    proxy_pass http://jnks_iot_web;
    include /etc/nginx/tbconf/proxy-headers.conf;
}
