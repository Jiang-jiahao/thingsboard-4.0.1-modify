version: '3.0'

services:
  # Redis sentinel
  # The latest version of Redis compatible with JnksIOT is 7.2
  redis-master:
    image: 'bitnami/redis:7.2'
    volumes:
      - ../jnks-iot-monolith/redis-sentinel-data-master:/bitnami/redis/data
    environment:
      - 'REDIS_REPLICATION_MODE=master'
      - 'REDIS_PASSWORD=jnks-iot'

  redis-slave:
    image: 'bitnami/redis:7.2'
    volumes:
      - ../jnks-iot-monolith/redis-sentinel-data-slave:/bitnami/redis/data
    environment:
      - 'REDIS_REPLICATION_MODE=slave'
      - 'REDIS_MASTER_HOST=redis-master'
      - 'REDIS_MASTER_PASSWORD=jnks-iot'
      - 'REDIS_PASSWORD=jnks-iot'
    depends_on:
      - redis-master

  redis-sentinel:
    image: 'bitnami/redis-sentinel:7.2'
    volumes:
      - ../jnks-iot-monolith/redis-sentinel-data-sentinel:/bitnami/redis/data
    environment:
      - 'REDIS_MASTER_HOST=redis-master'
      - 'REDIS_MASTER_SET=mymaster'
      - 'REDIS_SENTINEL_PASSWORD=sentinel'
      - 'REDIS_MASTER_PASSWORD=jnks-iot'
    depends_on:
      - redis-master
      - redis-slave

  # JnksIOT setup to use redis-sentinel
  jnks-iot-core1:
    env_file:
      - ../redis/cache-redis-sentinel.env
    depends_on:
      - redis-sentinel
  jnks-iot-core2:
    env_file:
      - ../redis/cache-redis-sentinel.env
    depends_on:
      - redis-sentinel
  jnks-iot-rule-engine1:
    env_file:
      - ../redis/cache-redis-sentinel.env
    depends_on:
      - redis-sentinel
  jnks-iot-rule-engine2:
    env_file:
      - ../redis/cache-redis-sentinel.env
    depends_on:
      - redis-sentinel
  jnks-iot-mqtt-transport1:
    env_file:
      - ../redis/cache-redis-sentinel.env
    depends_on:
      - redis-sentinel
  jnks-iot-mqtt-transport2:
    env_file:
      - ../redis/cache-redis-sentinel.env
    depends_on:
      - redis-sentinel
  jnks-iot-http-transport1:
    env_file:
      - ../redis/cache-redis-sentinel.env
    depends_on:
      - redis-sentinel
  jnks-iot-http-transport2:
    env_file:
      - ../redis/cache-redis-sentinel.env
    depends_on:
      - redis-sentinel
  jnks-iot-coap-transport:
    env_file:
      - ../redis/cache-redis-sentinel.env
    depends_on:
      - redis-sentinel
  jnks-iot-lwm2m-transport:
    env_file:
      - ../redis/cache-redis-sentinel.env
    depends_on:
      - redis-sentinel
  jnks-iot-snmp-transport:
    env_file:
      - ../redis/cache-redis-sentinel.env
    depends_on:
      - redis-sentinel
  jnks-iot-vc-executor1:
    env_file:
      - ../redis/cache-redis-sentinel.env
    depends_on:
      - redis-sentinel
  jnks-iot-vc-executor2:
    env_file:
      - ../redis/cache-redis-sentinel.env
    depends_on:
      - redis-sentinel
