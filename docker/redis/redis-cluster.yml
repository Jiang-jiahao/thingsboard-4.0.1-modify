version: '3.0'

services:
# Redis cluster
# The latest version of Redis compatible with JnksIOT is 7.2
  redis-node-0:
    image: bitnami/redis-cluster:7.2
    volumes:
      - ../jnks-iot-monolith/redis-cluster-data-0:/bitnami/redis/data
    environment:
      - 'REDIS_PASSWORD=jnks-iot'
      - 'REDISCLI_AUTH=jnks-iot'
      - 'REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5'

  redis-node-1:
    image: bitnami/redis-cluster:7.2
    volumes:
      - ../jnks-iot-monolith/redis-cluster-data-1:/bitnami/redis/data
    depends_on:
      - redis-node-0
    environment:
      - 'REDIS_PASSWORD=jnks-iot'
      - 'REDISCLI_AUTH=jnks-iot'
      - 'REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5'

  redis-node-2:
    image: bitnami/redis-cluster:7.2
    volumes:
      - ../jnks-iot-monolith/redis-cluster-data-2:/bitnami/redis/data
    depends_on:
      - redis-node-1
    environment:
      - 'REDIS_PASSWORD=jnks-iot'
      - 'REDISCLI_AUTH=jnks-iot'
      - 'REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5'

  redis-node-3:
    image: bitnami/redis-cluster:7.2
    volumes:
      - ../jnks-iot-monolith/redis-cluster-data-3:/bitnami/redis/data
    depends_on:
      - redis-node-2
    environment:
      - 'REDIS_PASSWORD=jnks-iot'
      - 'REDISCLI_AUTH=jnks-iot'
      - 'REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5'

  redis-node-4:
    image: bitnami/redis-cluster:7.2
    volumes:
      - ../jnks-iot-monolith/redis-cluster-data-4:/bitnami/redis/data
    depends_on:
      - redis-node-3
    environment:
      - 'REDIS_PASSWORD=jnks-iot'
      - 'REDISCLI_AUTH=jnks-iot'
      - 'REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5'

  redis-node-5:
    image: bitnami/redis-cluster:7.2
    volumes:
      - ../jnks-iot-monolith/redis-cluster-data-5:/bitnami/redis/data
    depends_on:
      - redis-node-0
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
    environment:
      - 'REDIS_PASSWORD=jnks-iot'
      - 'REDISCLI_AUTH=jnks-iot'
      - 'REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5'
      - 'REDIS_CLUSTER_REPLICAS=1'
      - 'REDIS_CLUSTER_CREATOR=yes'

# JnksIOT setup to use redis-cluster
  jnks-iot-core1:
    env_file:
      - ../redis/cache-redis-cluster.env
    depends_on:
      - redis-node-5
  jnks-iot-core2:
    env_file:
      - ../redis/cache-redis-cluster.env
    depends_on:
      - redis-node-5
  jnks-iot-rule-engine1:
    env_file:
      - ../redis/cache-redis-cluster.env
    depends_on:
      - redis-node-5
  jnks-iot-rule-engine2:
    env_file:
      - ../redis/cache-redis-cluster.env
    depends_on:
      - redis-node-5
  jnks-iot-mqtt-transport1:
    env_file:
      - ../redis/cache-redis-cluster.env
    depends_on:
      - redis-node-5
  jnks-iot-mqtt-transport2:
    env_file:
      - ../redis/cache-redis-cluster.env
    depends_on:
      - redis-node-5
  jnks-iot-http-transport1:
    env_file:
      - ../redis/cache-redis-cluster.env
    depends_on:
      - redis-node-5
  jnks-iot-http-transport2:
    env_file:
      - ../redis/cache-redis-cluster.env
    depends_on:
      - redis-node-5
  jnks-iot-coap-transport:
    env_file:
      - ../redis/cache-redis-cluster.env
    depends_on:
      - redis-node-5
  jnks-iot-lwm2m-transport:
    env_file:
      - ../redis/cache-redis-cluster.env
    depends_on:
      - redis-node-5
  jnks-iot-snmp-transport:
    env_file:
      - ../redis/cache-redis-cluster.env
    depends_on:
      - redis-node-5
  jnks-iot-vc-executor1:
    env_file:
      - ../redis/cache-redis-cluster.env
    depends_on:
      - redis-node-5
  jnks-iot-vc-executor2:
    env_file:
      - ../redis/cache-redis-cluster.env
    depends_on:
      - redis-node-5
