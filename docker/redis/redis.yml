version: '3.0'

services:
# Redis standalone
# TB 侧不用改：cache-redis.env 只给了 REDIS_HOST=redis、没有密码，而官方镜像默认就是无密码。
  redis:
    restart: always
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - ../data/redis-data:/data

# JnksIOT setup to use redis-standalone
  jnks-iot-core1:
    env_file:
      - ../redis/cache-redis.env
    depends_on:
      - redis
  jnks-iot-core2:
    env_file:
      - ../redis/cache-redis.env
    depends_on:
      - redis
  jnks-iot-rule-engine1:
    env_file:
      - ../redis/cache-redis.env
    depends_on:
      - redis
  jnks-iot-rule-engine2:
    env_file:
      - ../redis/cache-redis.env
    depends_on:
      - redis
  jnks-iot-mqtt-transport1:
    env_file:
      - ../redis/cache-redis.env
    depends_on:
      - redis
  jnks-iot-mqtt-transport2:
    env_file:
      - ../redis/cache-redis.env
    depends_on:
      - redis
  jnks-iot-http-transport1:
    env_file:
      - ../redis/cache-redis.env
    depends_on:
      - redis
  jnks-iot-http-transport2:
    env_file:
      - ../redis/cache-redis.env
    depends_on:
      - redis
  jnks-iot-coap-transport:
    env_file:
      - ../redis/cache-redis.env
    depends_on:
      - redis
  jnks-iot-lwm2m-transport:
    env_file:
      - ../redis/cache-redis.env
    depends_on:
      - redis
  jnks-iot-snmp-transport:
    env_file:
      - ../redis/cache-redis.env
    depends_on:
      - redis
  jnks-iot-vc-executor1:
    env_file:
      - ../redis/cache-redis.env
    depends_on:
      - redis
  jnks-iot-vc-executor2:
    env_file:
      - ../redis/cache-redis.env
    depends_on:
      - redis
  # TCP/UDP transport 是后来加的，最初写这个覆盖文件时还没有它们（同理见 docker-compose.kafka.yml）
  jnks-iot-tcp-transport1:
    env_file:
      - ../redis/cache-redis.env
    depends_on:
      - redis
  jnks-iot-tcp-transport2:
    env_file:
      - ../redis/cache-redis.env
    depends_on:
      - redis
  jnks-iot-udp-transport1:
    env_file:
      - ../redis/cache-redis.env
    depends_on:
      - redis
  jnks-iot-udp-transport2:
    env_file:
      - ../redis/cache-redis.env
    depends_on:
      - redis
