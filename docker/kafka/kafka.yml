version: '3.0'

services:
  kafka:
    restart: always
    image: "apache/kafka:3.7.0"
    ports:
      - "9092:9092"
    env_file:
      - ../kafka/kafka.env
    # KRaft 不需要 zookeeper 管 broker 元数据；TB 自己的服务发现仍在用下面那个 zookeeper 服务
  tb-js-executor:
    env_file:
      - ../kafka/kafka-client.env
    depends_on:
      - kafka
  tb-core1:
    env_file:
      - ../kafka/kafka-client.env
    depends_on:
      - kafka
  tb-core2:
    env_file:
      - ../kafka/kafka-client.env
    depends_on:
      - kafka
  tb-rule-engine1:
    env_file:
      - ../kafka/kafka-client.env
    depends_on:
      - kafka
  tb-rule-engine2:
    env_file:
      - ../kafka/kafka-client.env
    depends_on:
      - kafka
  tb-mqtt-transport1:
    env_file:
      - ../kafka/kafka-client.env
    depends_on:
      - kafka
  tb-mqtt-transport2:
    env_file:
      - ../kafka/kafka-client.env
    depends_on:
      - kafka
  tb-http-transport1:
    env_file:
      - ../kafka/kafka-client.env
    depends_on:
      - kafka
  tb-http-transport2:
    env_file:
      - ../kafka/kafka-client.env
    depends_on:
      - kafka
  tb-coap-transport:
    env_file:
      - ../kafka/kafka-client.env
    depends_on:
      - kafka
  tb-lwm2m-transport:
    env_file:
      - ../kafka/kafka-client.env
    depends_on:
      - kafka
  tb-snmp-transport:
    env_file:
      - ../kafka/kafka-client.env
    depends_on:
      - kafka
  tb-vc-executor1:
    env_file:
      - ../kafka/kafka-client.env
    depends_on:
      - kafka
  tb-vc-executor2:
    env_file:
      - ../kafka/kafka-client.env
    depends_on:
      - kafka
  # TCP/UDP transport 是后来加的，最初写这个覆盖文件时还没有它们 —— 漏在这里会导致
  # 它们拿不到 TB_KAFKA_SERVERS，回落到应用默认的 localhost:9092 并反复重启。
  tb-tcp-transport1:
    env_file:
      - ../kafka/kafka-client.env
    depends_on:
      - kafka
  tb-tcp-transport2:
    env_file:
      - ../kafka/kafka-client.env
    depends_on:
      - kafka
  tb-udp-transport1:
    env_file:
      - ../kafka/kafka-client.env
    depends_on:
      - kafka
  tb-udp-transport2:
    env_file:
      - ../kafka/kafka-client.env
    depends_on:
      - kafka
