version: '3.0'

services:
  zookeeper:
    restart: always
    image: "zookeeper:3.8.1"
    ports:
      - "2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888;zookeeper:2181
      ZOO_ADMINSERVER_ENABLED: "false"
  tb-js-executor:
    restart: always
    image: "${DOCKER_REPO}/${JS_EXECUTOR_DOCKER_NAME}:${TB_VERSION}"
    deploy:
      replicas: 10
    env_file:
      - tb-js-executor.env
  tb-core1:
    restart: always
    image: "${DOCKER_REPO}/${TB_CORE_DOCKER_NAME}:${TB_VERSION}"
    ports:
      - "8080"
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "30"
    environment:
      TB_SERVICE_ID: tb-core1
      JAVA_OPTS: "${JAVA_OPTS}"
    env_file:
      - tb-node.env
    volumes:
      - ./tb-core/conf:/config
      - ./tb-core/log:/var/log/thingsboard-core
    depends_on:
      - zookeeper
      - tb-js-executor
      - tb-rule-engine1
      - tb-rule-engine2
  tb-core2:
    restart: always
    image: "${DOCKER_REPO}/${TB_CORE_DOCKER_NAME}:${TB_VERSION}"
    ports:
      - "8080"
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "30"
    environment:
      TB_SERVICE_ID: tb-core2
      JAVA_OPTS: "${JAVA_OPTS}"
    env_file:
      - tb-node.env
    volumes:
      - ./tb-core/conf:/config
      - ./tb-core/log:/var/log/thingsboard-core
    depends_on:
      - zookeeper
      - tb-js-executor
      - tb-rule-engine1
      - tb-rule-engine2
  tb-rule-engine1:
    restart: always
    image: "${DOCKER_REPO}/${TB_RULE_ENGINE_DOCKER_NAME}:${TB_VERSION}"
    ports:
      - "8080"
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "30"
    environment:
      TB_SERVICE_ID: tb-rule-engine1
      JAVA_OPTS: "${JAVA_OPTS}"
    env_file:
      - tb-node.env
    volumes:
      - ./tb-rule-engine/conf:/config
      - ./tb-rule-engine/log:/var/log/thingsboard-rule-engine
    depends_on:
      - zookeeper
      - tb-js-executor
  tb-rule-engine2:
    restart: always
    image: "${DOCKER_REPO}/${TB_RULE_ENGINE_DOCKER_NAME}:${TB_VERSION}"
    ports:
      - "8080"
    logging:
      driver: "json-file"
      options:
        max-size: "200m"
        max-file: "30"
    environment:
      TB_SERVICE_ID: tb-rule-engine2
      JAVA_OPTS: "${JAVA_OPTS}"
    env_file:
      - tb-node.env
    volumes:
      - ./tb-rule-engine/conf:/config
      - ./tb-rule-engine/log:/var/log/thingsboard-rule-engine
    depends_on:
      - zookeeper
      - tb-js-executor
  tb-mqtt-transport1:
    restart: always
    image: "${DOCKER_REPO}/${MQTT_TRANSPORT_DOCKER_NAME}:${TB_VERSION}"
    ports:
      - "1883"
    environment:
      TB_SERVICE_ID: tb-mqtt-transport1
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - tb-mqtt-transport.env
    volumes:
      - ./tb-transports/mqtt/conf:/config
      - ./tb-transports/mqtt/log:/var/log/tb-mqtt-transport
    depends_on:
      - zookeeper
      - tb-core1
      - tb-core2
  tb-mqtt-transport2:
    restart: always
    image: "${DOCKER_REPO}/${MQTT_TRANSPORT_DOCKER_NAME}:${TB_VERSION}"
    ports:
      - "1883"
    environment:
      TB_SERVICE_ID: tb-mqtt-transport2
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - tb-mqtt-transport.env
    volumes:
      - ./tb-transports/mqtt/conf:/config
      - ./tb-transports/mqtt/log:/var/log/tb-mqtt-transport
    depends_on:
      - zookeeper
      - tb-core1
      - tb-core2
  tb-http-transport1:
    restart: always
    image: "${DOCKER_REPO}/${HTTP_TRANSPORT_DOCKER_NAME}:${TB_VERSION}"
    ports:
      - "8081"
    environment:
      TB_SERVICE_ID: tb-http-transport1
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - tb-http-transport.env
    volumes:
      - ./tb-transports/http/conf:/config
      - ./tb-transports/http/log:/var/log/tb-http-transport
    depends_on:
      - zookeeper
      - tb-core1
      - tb-core2
  tb-http-transport2:
    restart: always
    image: "${DOCKER_REPO}/${HTTP_TRANSPORT_DOCKER_NAME}:${TB_VERSION}"
    ports:
      - "8081"
    environment:
      TB_SERVICE_ID: tb-http-transport2
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - tb-http-transport.env
    volumes:
      - ./tb-transports/http/conf:/config
      - ./tb-transports/http/log:/var/log/tb-http-transport
    depends_on:
      - zookeeper
      - tb-core1
      - tb-core2
  tb-coap-transport:
    restart: always
    image: "${DOCKER_REPO}/${COAP_TRANSPORT_DOCKER_NAME}:${TB_VERSION}"
    ports:
      - "5683:5683/udp"
    environment:
      TB_SERVICE_ID: tb-coap-transport
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - tb-coap-transport.env
    volumes:
      - ./tb-transports/coap/conf:/config
      - ./tb-transports/coap/log:/var/log/tb-coap-transport
    depends_on:
      - zookeeper
      - tb-core1
      - tb-core2
  tb-lwm2m-transport:
    restart: always
    image: "${DOCKER_REPO}/${LWM2M_TRANSPORT_DOCKER_NAME}:${TB_VERSION}"
    ports:
      - "5685:5685/udp"
      - "5686:5686/udp"
    environment:
      TB_SERVICE_ID: tb-lwm2m-transport
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - tb-lwm2m-transport.env
    volumes:
      - ./tb-transports/lwm2m/conf:/config
      - ./tb-transports/lwm2m/log:/var/log/tb-lwm2m-transport
    depends_on:
      - zookeeper
      - tb-core1
      - tb-core2
  tb-snmp-transport:
    restart: always
    image: "${DOCKER_REPO}/${SNMP_TRANSPORT_DOCKER_NAME}:${TB_VERSION}"
    ports:
      - "1620:1620/udp"
    environment:
      TB_SERVICE_ID: tb-snmp-transport
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - tb-snmp-transport.env
    volumes:
      - ./tb-transports/snmp/conf:/config
      - ./tb-transports/snmp/log:/var/log/tb-snmp-transport
    depends_on:
      - zookeeper
      - tb-core1
      - tb-core2
  tb-tcp-transport1:
    restart: always
    image: "${DOCKER_REPO}/${TCP_TRANSPORT_DOCKER_NAME}:${TB_VERSION}"
    ports:
      # 只发临时宿主端口：所有 TCP 实例监听同一容器端口 5683，对外统一由入口网关（nginx-gateway）转发
      - "5683"
      - "8087"
    environment:
      TB_SERVICE_ID: tb-tcp-transport1
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - tb-tcp-transport.env
    volumes:
      - ./tb-transports/tcp/conf:/config
      - ./tb-transports/tcp/log:/var/log/tb-tcp-transport
    depends_on:
      - zookeeper
      - tb-core1
      - tb-core2
  tb-tcp-transport2:
    restart: always
    image: "${DOCKER_REPO}/${TCP_TRANSPORT_DOCKER_NAME}:${TB_VERSION}"
    ports:
      - "5683"
      - "8087"
    environment:
      TB_SERVICE_ID: tb-tcp-transport2
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - tb-tcp-transport.env
    volumes:
      - ./tb-transports/tcp/conf:/config
      - ./tb-transports/tcp/log:/var/log/tb-tcp-transport
    depends_on:
      - zookeeper
      - tb-core1
      - tb-core2
  tb-udp-transport1:
    restart: always
    image: "${DOCKER_REPO}/${UDP_TRANSPORT_DOCKER_NAME}:${TB_VERSION}"
    ports:
      # 同上：两个 UDP 实例都监听容器端口 5684，由入口网关按源地址哈希转发
      - "5684/udp"
      - "8088"
    environment:
      TB_SERVICE_ID: tb-udp-transport1
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - tb-udp-transport.env
    volumes:
      - ./tb-transports/udp/conf:/config
      - ./tb-transports/udp/log:/var/log/tb-udp-transport
    depends_on:
      - zookeeper
      - tb-core1
      - tb-core2
  tb-udp-transport2:
    restart: always
    image: "${DOCKER_REPO}/${UDP_TRANSPORT_DOCKER_NAME}:${TB_VERSION}"
    ports:
      - "5684/udp"
      - "8088"
    environment:
      TB_SERVICE_ID: tb-udp-transport2
      JAVA_OPTS: "${JAVA_OPTS_TRANSPORT:--Xmx256M -Xms128M}"
    env_file:
      - tb-udp-transport.env
    volumes:
      - ./tb-transports/udp/conf:/config
      - ./tb-transports/udp/log:/var/log/tb-udp-transport
    depends_on:
      - zookeeper
      - tb-core1
      - tb-core2
  # Web UI：nginx 直接发静态文件（前端产物已打进镜像），不再是 Node/Express 服务，也不需要 env 文件。
  # 两个副本纯粹是为了重启/升级时界面不断（入口网关按 least_conn 分发）。
  tb-web-ui1:
    restart: always
    image: "${DOCKER_REPO}/${WEB_UI_DOCKER_NAME}:${TB_VERSION}"
    ports:
      - "8080"
  tb-web-ui2:
    restart: always
    image: "${DOCKER_REPO}/${WEB_UI_DOCKER_NAME}:${TB_VERSION}"
    ports:
      - "8080"
  tb-vc-executor1:
    restart: always
    image: "${DOCKER_REPO}/${TB_VC_EXECUTOR_DOCKER_NAME}:${TB_VERSION}"
    ports:
      - "8081"
    environment:
      TB_SERVICE_ID: tb-vc-executor1
      JAVA_OPTS: "${JAVA_OPTS}"
    env_file:
      - tb-vc-executor.env
    volumes:
      - ./tb-vc-executor/conf:/config
      - ./tb-vc-executor/log:/var/log/tb-vc-executor
    depends_on:
      - zookeeper
      - tb-core1
      - tb-core2
  tb-vc-executor2:
    restart: always
    image: "${DOCKER_REPO}/${TB_VC_EXECUTOR_DOCKER_NAME}:${TB_VERSION}"
    ports:
      - "8081"
    environment:
      TB_SERVICE_ID: tb-vc-executor2
      JAVA_OPTS: "${JAVA_OPTS}"
    env_file:
      - tb-vc-executor.env
    volumes:
      - ./tb-vc-executor/conf:/config
      - ./tb-vc-executor/log:/var/log/tb-vc-executor
    depends_on:
      - zookeeper
      - tb-core1
      - tb-core2
  # 统一入口网关（nginx）：80/443 路由 + TLS、1883 MQTT、5683/5684 TCP/UDP，全部入口就这一个容器。
  # 替代了原来的两个代理 —— haproxy-certbot（80/443/1883 + certbot 自动证书）与 nginx-tcpudp（5683/5684）。
  # 配置：./nginx/config/（nginx.conf + locations.conf + proxy-headers.conf）
  # 证书：./nginx/certs/（首次用 bash nginx/gen-self-signed-cert.sh 生成自签，生产换成真实证书）
  nginx-gateway:
    restart: always
    container_name: "${LOAD_BALANCER_NAME}"
    image: "${NGINX_GATEWAY_IMAGE}"
    ports:
     - "80:80"
     - "443:443"
     - "1883:1883"
     - "5683:5683"
     - "5684:5684/udp"
    volumes:
     - ./nginx/config/nginx.conf:/etc/nginx/nginx.conf:ro
     - ./nginx/config:/etc/nginx/tbconf:ro
     - ./nginx/certs:/etc/nginx/certs:ro
    links:
        - tb-core1
        - tb-core2
        - tb-web-ui1
        - tb-web-ui2
        - tb-mqtt-transport1
        - tb-mqtt-transport2
        - tb-http-transport1
        - tb-http-transport2
        - tb-tcp-transport1
        - tb-tcp-transport2
        - tb-udp-transport1
        - tb-udp-transport2
    depends_on:
        - tb-core1
        - tb-core2
        - tb-web-ui1
        - tb-web-ui2
        - tb-mqtt-transport1
        - tb-mqtt-transport2
        - tb-http-transport1
        - tb-http-transport2
        - tb-tcp-transport1
        - tb-tcp-transport2
        - tb-udp-transport1
        - tb-udp-transport2
