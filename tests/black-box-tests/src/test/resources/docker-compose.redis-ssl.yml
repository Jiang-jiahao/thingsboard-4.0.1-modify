version: '3.0'

services:
# Redis standalone
# The latest version of Redis compatible with JnksIOT is 7.2
  redis:
    restart: always
    image: bitnami/redis:7.2
    environment:
      # ALLOW_EMPTY_PASSWORD is recommended only for development.
      - 'ALLOW_EMPTY_PASSWORD=yes'
      - 'REDIS_TLS_ENABLED=yes'
      - 'REDIS_TLS_CERT_FILE=/redis/certs/redis.crt'
      - 'REDIS_TLS_KEY_FILE=/redis/certs/redis.key'
      - 'REDIS_TLS_CA_FILE=/redis/certs/redisCA.crt'
      - 'REDIS_TLS_AUTH_CLIENTS=no'
    ports:
      - '6379:6379'
    volumes:
      - ./jnks-iot-node/redis-data:/bitnami/redis/data
      - ./redis-certs:/redis/certs

# JnksIOT setup to use redis-standalone
  jnks-iot-core1:
    env_file:
      - cache-redis.env
    volumes:
      - ./redis-certs:/redis/certs
    depends_on:
      - redis
  jnks-iot-core2:
    env_file:
      - cache-redis.env
    volumes:
      - ./redis-certs:/redis/certs
    depends_on:
      - redis
  jnks-iot-rule-engine1:
    env_file:
      - cache-redis.env
    volumes:
      - ./redis-certs:/redis/certs
    depends_on:
      - redis
  jnks-iot-rule-engine2:
    env_file:
      - cache-redis.env
    volumes:
      - ./redis-certs:/redis/certs
    depends_on:
      - redis
  jnks-iot-mqtt-transport1:
    env_file:
      - cache-redis.env
    volumes:
      - ./redis-certs:/redis/certs
    depends_on:
      - redis
  jnks-iot-mqtt-transport2:
    env_file:
      - cache-redis.env
    volumes:
      - ./redis-certs:/redis/certs
    depends_on:
      - redis
  jnks-iot-http-transport1:
    env_file:
      - cache-redis.env
    volumes:
      - ./redis-certs:/redis/certs
    depends_on:
      - redis
  jnks-iot-http-transport2:
    env_file:
      - cache-redis.env
    volumes:
      - ./redis-certs:/redis/certs
    depends_on:
      - redis
  jnks-iot-coap-transport:
    env_file:
      - cache-redis.env
    volumes:
      - ./redis-certs:/redis/certs
    depends_on:
      - redis
  jnks-iot-lwm2m-transport:
    env_file:
      - cache-redis.env
    volumes:
      - ./redis-certs:/redis/certs
    depends_on:
      - redis
  jnks-iot-snmp-transport:
    env_file:
      - cache-redis.env
    volumes:
      - ./redis-certs:/redis/certs
    depends_on:
      - redis
  jnks-iot-vc-executor1:
    env_file:
      - cache-redis.env
    volumes:
      - ./redis-certs:/redis/certs
    depends_on:
      - redis
  jnks-iot-vc-executor2:
    env_file:
      - cache-redis.env
    volumes:
      - ./redis-certs:/redis/certs
    depends_on:
      - redis
