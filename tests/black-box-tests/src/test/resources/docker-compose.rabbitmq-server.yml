version: '3.0'

services:
  rabbitmq:
    restart: always
    image: rabbitmq:3
    ports:
      - '5672:5672'
    environment:
      RABBITMQ_DEFAULT_USER: YOUR_USERNAME
      RABBITMQ_DEFAULT_PASS: YOUR_PASSWORD
  jnks-iot-js-executor:
    depends_on:
      - rabbitmq
  jnks-iot-core1:
    depends_on:
      - rabbitmq
  jnks-iot-core2:
    depends_on:
      - rabbitmq
  jnks-iot-rule-engine1:
    depends_on:
      - rabbitmq
  jnks-iot-rule-engine2:
    depends_on:
      - rabbitmq
  jnks-iot-mqtt-transport1:
    depends_on:
      - rabbitmq
  jnks-iot-mqtt-transport2:
    depends_on:
      - rabbitmq
  jnks-iot-http-transport1:
    depends_on:
      - rabbitmq
  jnks-iot-http-transport2:
    depends_on:
      - rabbitmq
  jnks-iot-coap-transport:
    depends_on:
      - rabbitmq
  jnks-iot-lwm2m-transport:
    depends_on:
      - rabbitmq
  jnks-iot-snmp-transport:
    depends_on:
      - rabbitmq
  jnks-iot-vc-executor1:
    depends_on:
      - rabbitmq
  jnks-iot-vc-executor2:
    depends_on:
      - rabbitmq
