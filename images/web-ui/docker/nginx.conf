# ThingsBoard Web UI 的静态托管配置（替代上游的 Node/Express 版本）。
#
# 上游 web-ui 是个 Express 服务，实际只做四件事：发静态文件、SPA 回退、gzip、转发 API。
# 本镜像直接用 nginx 做同样的事（`/api` 的转发交给前面的 haproxy，所以这里不需要 proxy_pass）。
#
# 监听 8080：haproxy 的 tb-web-backend 指向 tb-web-ui1:8080 / tb-web-ui2:8080。
worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # 对应原来 Express 的 compression()
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 对应原来的 historyApiFallback：路径找不到就回 index.html 交给前端路由
        # （`/resources/scada-symbols/{system,tenant}/xxx` 这类前端路由也由这里兜住）
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 入口文件绝不缓存：升级后必须拿到新的 index.html（它引用的 chunk 名带 hash）
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }
}
