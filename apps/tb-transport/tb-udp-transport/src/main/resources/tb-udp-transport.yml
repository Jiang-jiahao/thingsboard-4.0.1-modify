# Spring 通用参数
spring.main.web-environment: "${WEB_APPLICATION_ENABLE:false}" # 若启用了进程指标，还应启用 web-environment。
spring.main.web-application-type: "${WEB_APPLICATION_TYPE:none}" # 若启用了进程指标，应将 web-application-type 设为 servlet。
spring.main.allow-circular-references: "true" # Spring Boot 配置项，控制是否允许 Bean 之间的循环依赖。

# 服务器通用参数
server:
  # 服务器绑定地址
  address: "${HTTP_BIND_ADDRESS:0.0.0.0}"
  # 服务器绑定端口
  port: "${HTTP_BIND_PORT:8088}"

# ZooKeeper 连接参数
zk:
  # 启用/禁用 ZooKeeper 发现服务。
  enabled: "${ZOOKEEPER_ENABLED:true}"
  # ZooKeeper 连接字符串
  url: "${ZOOKEEPER_URL:localhost:2181}"
  # ZooKeeper 重试间隔（毫秒）
  retry_interval_ms: "${ZOOKEEPER_RETRY_INTERVAL_MS:3000}"
  # ZooKeeper 连接超时（毫秒）
  connection_timeout_ms: "${ZOOKEEPER_CONNECTION_TIMEOUT_MS:3000}"
  # ZooKeeper 会话超时（毫秒）
  session_timeout_ms: "${ZOOKEEPER_SESSION_TIMEOUT_MS:3000}"
  # ZooKeeper "文件系统" 中的目录名称
  zk_dir: "${ZOOKEEPER_NODES_DIR:/thingsboard}"
  # 在微服务架构的规则引擎服务中建议配置 recalculate_delay 属性。
  # 此属性提供暂停时间，确保规则引擎服务重启时，其他节点不会立即尝试重新计算其分区。
  # 建议设置延迟，因为规则链 Actor 的初始化较耗时。重启期间避免不必要的重新计算可提升系统性能与稳定性。
  recalculate_delay: "${ZOOKEEPER_RECALCULATE_DELAY_MS:0}"

# 缓存设置参数
cache:
  # caffeine 或 redis（7.2 - 最新兼容版本）
  type: "${CACHE_TYPE:caffeine}"
  specs:
    relations:
      timeToLiveInMinutes: "${CACHE_SPECS_RELATIONS_TTL:1440}" # 关系缓存 TTL
      maxSize: "${CACHE_SPECS_RELATIONS_MAX_SIZE:10000}" # 0 表示禁用缓存
    deviceCredentials:
      timeToLiveInMinutes: "${CACHE_SPECS_DEVICE_CREDENTIALS_TTL:1440}" # 设备凭证缓存 TTL
      maxSize: "${CACHE_SPECS_DEVICE_CREDENTIALS_MAX_SIZE:10000}" # 0 表示禁用缓存
    devices:
      timeToLiveInMinutes: "${CACHE_SPECS_DEVICES_TTL:1440}" # 设备缓存 TTL
      maxSize: "${CACHE_SPECS_DEVICES_MAX_SIZE:10000}" # 0 表示禁用缓存
    sessions:
      timeToLiveInMinutes: "${CACHE_SPECS_SESSIONS_TTL:1440}" # 会话缓存 TTL
      maxSize: "${CACHE_SPECS_SESSIONS_MAX_SIZE:10000}" # 0 表示禁用缓存
    assets:
      timeToLiveInMinutes: "${CACHE_SPECS_ASSETS_TTL:1440}" # 资产缓存 TTL
      maxSize: "${CACHE_SPECS_ASSETS_MAX_SIZE:10000}" # 0 表示禁用缓存
    customers:
      timeToLiveInMinutes: "${CACHE_SPECS_CUSTOMERS_TTL:1440}" # 客户缓存 TTL
      maxSize: "${CACHE_SPECS_CUSTOMERS_MAX_SIZE:10000}" # 0 表示禁用缓存
    users:
      timeToLiveInMinutes: "${CACHE_SPECS_USERS_TTL:1440}" # 用户缓存 TTL
      maxSize: "${CACHE_SPECS_USERS_MAX_SIZE:10000}" # 0 表示禁用缓存
    entityViews:
      timeToLiveInMinutes: "${CACHE_SPECS_ENTITY_VIEWS_TTL:1440}" # 实体视图缓存 TTL
      maxSize: "${CACHE_SPECS_ENTITY_VIEWS_MAX_SIZE:10000}" # 0 表示禁用缓存
    claimDevices:
      timeToLiveInMinutes: "${CACHE_SPECS_CLAIM_DEVICES_TTL:1440}" # 认领设备缓存 TTL
      maxSize: "${CACHE_SPECS_CLAIM_DEVICES_MAX_SIZE:1000}" # 0 表示禁用缓存
    securitySettings:
      timeToLiveInMinutes: "${CACHE_SPECS_SECURITY_SETTINGS_TTL:1440}" # 安全设置缓存 TTL
      maxSize: "${CACHE_SPECS_SECURITY_SETTINGS_MAX_SIZE:10000}" # 0 表示禁用缓存
    tenantProfiles:
      timeToLiveInMinutes: "${CACHE_SPECS_TENANT_PROFILES_TTL:1440}" # 租户配置文件缓存 TTL
      maxSize: "${CACHE_SPECS_TENANT_PROFILES_MAX_SIZE:10000}" # 0 表示禁用缓存
    tenants:
      timeToLiveInMinutes: "${CACHE_SPECS_TENANTS_TTL:1440}" # 租户缓存 TTL
      maxSize: "${CACHE_SPECS_TENANTS_MAX_SIZE:10000}" # 0 表示禁用缓存
    tenantsExist:
      # 环境变量有意与 'tenants' 缓存保持一致。
      timeToLiveInMinutes: "${CACHE_SPECS_TENANTS_TTL:1440}"
      maxSize: "${CACHE_SPECS_TENANTS_MAX_SIZE:10000}" # 0 表示禁用缓存
    deviceProfiles:
      timeToLiveInMinutes: "${CACHE_SPECS_DEVICE_PROFILES_TTL:1440}" # 设备配置文件缓存 TTL
      maxSize: "${CACHE_SPECS_DEVICE_PROFILES_MAX_SIZE:10000}" # 0 表示禁用缓存
    assetProfiles:
      timeToLiveInMinutes: "${CACHE_SPECS_ASSET_PROFILES_TTL:1440}" # 资产配置文件缓存 TTL
      maxSize: "${CACHE_SPECS_ASSET_PROFILES_MAX_SIZE:10000}" # 0 表示禁用缓存
    notificationSettings:
      timeToLiveInMinutes: "${CACHE_SPECS_NOTIFICATION_SETTINGS_TTL:10}" # 通知设置缓存 TTL
      maxSize: "${CACHE_SPECS_NOTIFICATION_SETTINGS_MAX_SIZE:1000}" # 0 表示禁用缓存
    sentNotifications:
      timeToLiveInMinutes: "${CACHE_SPECS_SENT_NOTIFICATIONS_TTL:1440}" # 已发送通知缓存 TTL
      maxSize: "${CACHE_SPECS_SENT_NOTIFICATIONS_MAX_SIZE:10000}" # 0 表示禁用缓存
    attributes:
      timeToLiveInMinutes: "${CACHE_SPECS_ATTRIBUTES_TTL:1440}" # 属性缓存 TTL
      maxSize: "${CACHE_SPECS_ATTRIBUTES_MAX_SIZE:100000}" # 0 表示禁用缓存
    tsLatest:
      timeToLiveInMinutes: "${CACHE_SPECS_TS_LATEST_TTL:1440}" # 时序最新数据缓存 TTL
      maxSize: "${CACHE_SPECS_TS_LATEST_MAX_SIZE:100000}" # 0 表示禁用缓存
    userSessionsInvalidation:
      # 此 TTL 值将被忽略，并替换为 JWT 刷新令牌过期时间
      timeToLiveInMinutes: "0"
      maxSize: "${CACHE_SPECS_USERS_UPDATE_TIME_MAX_SIZE:10000}" # 0 表示禁用缓存
    otaPackages:
      timeToLiveInMinutes: "${CACHE_SPECS_OTA_PACKAGES_TTL:60}" # OTA 包缓存 TTL
      maxSize: "${CACHE_SPECS_OTA_PACKAGES_MAX_SIZE:10}" # 0 表示禁用缓存
    otaPackagesData:
      timeToLiveInMinutes: "${CACHE_SPECS_OTA_PACKAGES_DATA_TTL:60}" # OTA 包数据缓存 TTL
      maxSize: "${CACHE_SPECS_OTA_PACKAGES_DATA_MAX_SIZE:10}" # 0 表示禁用缓存
    repositorySettings:
      timeToLiveInMinutes: "${CACHE_SPECS_REPOSITORY_SETTINGS_TTL:1440}" # 仓库设置缓存 TTL
      maxSize: "${CACHE_SPECS_REPOSITORY_SETTINGS_MAX_SIZE:10000}" # 0 表示禁用缓存
    autoCommitSettings:
      timeToLiveInMinutes: "${CACHE_SPECS_AUTO_COMMIT_SETTINGS_TTL:1440}" # 自动提交设置缓存 TTL
      maxSize: "${CACHE_SPECS_AUTO_COMMIT_SETTINGS_MAX_SIZE:10000}" # 0 表示禁用缓存
    twoFaVerificationCodes:
      timeToLiveInMinutes: "${CACHE_SPECS_TWO_FA_VERIFICATION_CODES_TTL:60}" # 双因素验证码缓存 TTL
      maxSize: "${CACHE_SPECS_TWO_FA_VERIFICATION_CODES_MAX_SIZE:100000}" # 0 表示禁用缓存
    versionControlTask:
      timeToLiveInMinutes: "${CACHE_SPECS_VERSION_CONTROL_TASK_TTL:20}" # 版本控制任务缓存 TTL
      maxSize: "${CACHE_SPECS_VERSION_CONTROL_TASK_MAX_SIZE:100000}" # 0 表示禁用缓存
    userSettings:
      timeToLiveInMinutes: "${CACHE_SPECS_USER_SETTINGS_TTL:1440}" # 用户设置缓存 TTL
      maxSize: "${CACHE_SPECS_USER_SETTINGS_MAX_SIZE:100000}" # 0 表示禁用缓存
    dashboardTitles:
      timeToLiveInMinutes: "${CACHE_SPECS_DASHBOARD_TITLES_TTL:1440}" # 仪表板标题缓存 TTL
      maxSize: "${CACHE_SPECS_DASHBOARD_TITLES_MAX_SIZE:100000}" # 0 表示禁用缓存
    entityCount:
      timeToLiveInMinutes: "${CACHE_SPECS_ENTITY_COUNT_TTL:1440}" # 实体计数缓存 TTL
      maxSize: "${CACHE_SPECS_ENTITY_COUNT_MAX_SIZE:100000}" # 0 表示禁用缓存
    resourceInfo:
      timeToLiveInMinutes: "${CACHE_SPECS_RESOURCE_INFO_TTL:1440}" # 资源信息缓存 TTL
      maxSize: "${CACHE_SPECS_RESOURCE_INFO_MAX_SIZE:100000}" # 0 表示禁用缓存
    alarmTypes:
      timeToLiveInMinutes: "${CACHE_SPECS_ALARM_TYPES_TTL:60}" # 告警类型缓存 TTL
      maxSize: "${CACHE_SPECS_ALARM_TYPES_MAX_SIZE:10000}" # 0 表示禁用缓存
    qrCodeSettings:
      timeToLiveInMinutes: "${CACHE_SPECS_MOBILE_APP_SETTINGS_TTL:1440}" # 二维码设置缓存 TTL
      maxSize: "${CACHE_SPECS_MOBILE_APP_SETTINGS_MAX_SIZE:10000}" # 0 表示禁用缓存
    mobileSecretKey:
      timeToLiveInMinutes: "${CACHE_MOBILE_SECRET_KEY_TTL:2}" # QR 密钥缓存 TTL
      maxSize: "${CACHE_MOBILE_SECRET_KEY_MAX_SIZE:10000}" # 0 表示禁用缓存

  # 有意放置于上方 'specs' 组之外
  entityLimits:
    timeToLiveInMinutes: "${CACHE_SPECS_ENTITY_LIMITS_TTL:5}" # 实体限制缓存 TTL
    maxSize: "${CACHE_SPECS_ENTITY_LIMITS_MAX_SIZE:100000}" # 0 表示禁用缓存

# Redis 配置参数
redis:
  connection:
    # Redis 部署类型：Standalone（单 Redis 节点部署）或 Cluster
    type: "${REDIS_CONNECTION_TYPE:standalone}"
  standalone:
    # Redis 连接主机
    host: "${REDIS_HOST:localhost}"
    # Redis 连接端口
    port: "${REDIS_PORT:6379}"
    # 使用默认 Redis 配置文件
    useDefaultClientConfig: "${REDIS_USE_DEFAULT_CLIENT_CONFIG:true}"
    # 仅在使用非默认 ClientConfig 时可使用此值
    clientName: "${REDIS_CLIENT_NAME:standalone}"
    # 仅在使用非默认 ClientConfig 时可使用此值
    connectTimeout: "${REDIS_CLIENT_CONNECT_TIMEOUT:30000}"
    # 仅在使用非默认 ClientConfig 时可使用此值
    readTimeout: "${REDIS_CLIENT_READ_TIMEOUT:60000}"
    # 仅在使用非默认 ClientConfig 时可使用此值
    usePoolConfig: "${REDIS_CLIENT_USE_POOL_CONFIG:false}"
  cluster:
    # 逗号分隔的 "host:port" 列表，用于引导连接。
    nodes: "${REDIS_NODES:}"
    # 跨集群执行命令时跟随重定向的最大次数。
    max-redirects: "${REDIS_MAX_REDIRECTS:12}"
    # 若设为 false，将使用 pool config 节的值构建连接池配置
    useDefaultPoolConfig: "${REDIS_USE_DEFAULT_POOL_CONFIG:true}"
  sentinel:
    # 主节点名称
    master: "${REDIS_MASTER:}"
    # 逗号分隔的 Sentinel "host:port" 列表
    sentinels: "${REDIS_SENTINELS:}"
    # 连接 Sentinel 的认证密码
    password: "${REDIS_SENTINEL_PASSWORD:}"
    # 若设为 false，将使用 pool config 节的值构建连接池配置
    useDefaultPoolConfig: "${REDIS_USE_DEFAULT_POOL_CONFIG:true}"
  # 数据库索引
  db: "${REDIS_DB:0}"
  # 数据库密码
  password: "${REDIS_PASSWORD:}"
  ssl:
    # 启用/禁用安全连接
    enabled: "${TB_REDIS_SSL_ENABLED:false}"
    # 服务端 SSL 凭证（仅支持 PEM 格式）
    credentials:
      # Redis 服务端（CA）证书路径
      cert_file: "${TB_REDIS_SSL_PEM_CERT:}"
      # 用户证书文件路径。客户端可选，可用于客户端双向认证
      user_cert_file: "${TB_REDIS_SSL_PEM_KEY:}"
      # 用户私钥文件路径。客户端可选，仅在配置了 'user_cert_file' 时需要
      user_key_file: "${TB_REDIS_SSL_PEM_KEY_PASSWORD:}"
  # 连接池配置
  pool_config:
    # 连接池可分配的最大连接数
    maxTotal: "${REDIS_POOL_CONFIG_MAX_TOTAL:128}"
    # 连接池中可保持而不关闭的最大空闲连接数
    maxIdle: "${REDIS_POOL_CONFIG_MAX_IDLE:128}"
    # 连接池中可保持而不关闭的最小空闲连接数
    minIdle: "${REDIS_POOL_CONFIG_MIN_IDLE:16}"
    # 启用/禁用借出连接时发送 PING 命令
    testOnBorrow: "${REDIS_POOL_CONFIG_TEST_ON_BORROW:true}"
    # 用于指定在将连接归还连接池之前是否测试连接。
    testOnReturn: "${REDIS_POOL_CONFIG_TEST_ON_RETURN:true}"
    # 此属性用于 Redis 连接池上下文
    testWhileIdle: "${REDIS_POOL_CONFIG_TEST_WHILE_IDLE:true}"
    # 空闲连接在被连接池驱逐前应保持空闲的最短时间（毫秒）
    minEvictableMs: "${REDIS_POOL_CONFIG_MIN_EVICTABLE_MS:60000}"
    # 两次连续驱逐运行之间的时间间隔（毫秒）
    evictionRunsMs: "${REDIS_POOL_CONFIG_EVICTION_RUNS_MS:30000}"
    # 所有连接耗尽时，客户端等待从连接池获取连接的最大时间（毫秒）
    maxWaitMills: "${REDIS_POOL_CONFIG_MAX_WAIT_MS:60000}"
    # 每次驱逐运行时要测试的连接数
    numberTestsPerEvictionRun: "${REDIS_POOL_CONFIG_NUMBER_TESTS_PER_EVICTION_RUN:3}"
    # 当线程从连接池请求连接但没有可用连接且因 maxTotal 配置无法创建更多连接时的行为
    blockWhenExhausted: "${REDIS_POOL_CONFIG_BLOCK_WHEN_EXHAUSTED:true}"

# 传输配置参数
transport:
  udp:
    enabled: "${UDP_TRANSPORT_ENABLED:true}"
    server:
      enabled: "${UDP_SERVER_ENABLED:true}"
      # SERVER 入站首帧分帧（鉴权）。鉴权成功后切换为设备配置文件中的 udpTransportFramingMode。
      auth_framing_mode: "${UDP_SERVER_AUTH_FRAMING_MODE:NONE}"
      auth_fixed_frame_length: "${UDP_SERVER_AUTH_FIXED_FRAME_LENGTH:512}"
    # 绑定地址；监听端口仅由设备档案 SERVER 模式下的 udpProfileServerBindPort 决定（不再默认占用 5684，避免与 CoAP DTLS 冲突）。
    bind_address: "${UDP_BIND_ADDRESS:0.0.0.0}"
    bind_port: "${UDP_BIND_PORT:5684}"
    netty:
      leak_detector_level: "${UDP_NETTY_LEAK_DETECTOR_LEVEL:PARANOID}"
      worker_group_thread_count: "${UDP_NETTY_WORKER_GROUP_THREADS:0}"
      max_datagram_length: "${UDP_NETTY_MAX_DATAGRAM_LENGTH:65536}"
  sessions:
    # 会话不活动超时是全局配置参数，定义设备最后一条消息到达后会话保持打开的时长。
    # 参数值单位为毫秒。
    # 若设备发送任何消息（包括 keepalive），设备会话的最后活动时间会更新
    # 若无活动，会话将关闭，所有订阅将被删除。
    # 建议此参数与设备不活动超时（"state.defaultInactivityTimeoutInSec" 或 DEFAULT_INACTIVITY_TIMEOUT）参数保持一致
    # 该参数负责在平台核心服务中检测设备连接状态。
    # 会话不活动超时参数值应大于或等于设备不活动超时。
    # 注意：会话不活动超时以毫秒为单位，设备不活动超时以秒为单位。
    inactivity_timeout: "${TB_TRANSPORT_SESSIONS_INACTIVITY_TIMEOUT:600000}"
    # 定期检查过期会话并上报会话最后活动时间变更的间隔
    report_timeout: "${TB_TRANSPORT_SESSIONS_REPORT_TIMEOUT:3000}"
  json:
    # 处理 Telemetry/Attributes JSON 时，尽可能将 String 类型转换为 Numeric
    type_cast_enabled: "${JSON_TYPE_CAST_ENABLED:true}"
    # 处理 Telemetry/Attributes JSON 时允许的最大字符串长度（0 表示禁用字符串长度检查）
    max_string_value_length: "${JSON_MAX_STRING_VALUE_LENGTH:0}"
  log:
    # 启用/禁用将传输消息记录到 telemetry 的日志，例如 LwM2M 注册更新日志
    enabled: "${TB_TRANSPORT_LOG_ENABLED:true}"
    # 日志消息的最大长度，超出时将截断至指定值
    max_length: "${TB_TRANSPORT_LOG_MAX_LENGTH:1024}"
  stats:
    # 启用/禁用传输统计信息收集
    enabled: "${TB_TRANSPORT_STATS_ENABLED:true}"
    # 传输统计信息日志输出间隔
    print-interval-ms: "${TB_TRANSPORT_STATS_PRINT_INTERVAL_MS:60000}"

# 队列配置参数
queue:
  type: "${TB_QUEUE_TYPE:kafka}" # in-memory 或 kafka (Apache Kafka)
  prefix: "${TB_QUEUE_PREFIX:}" # 全局队列前缀。若指定，前缀将加在默认主题名之前：'prefix.default_topic_name'。前缀应用于所有主题（Kafka 还包括 consumer groups）。
  kafka:
    # Kafka Bootstrap 节点，格式为 "host:port"
    bootstrap.servers: "${TB_KAFKA_SERVERS:localhost:9092}"
    ssl:
      # 启用/禁用 Kafka SSL 通信
      enabled: "${TB_KAFKA_SSL_ENABLED:false}"
      # trust store 文件的位置
      truststore.location: "${TB_KAFKA_SSL_TRUSTSTORE_LOCATION:}"
      # 若指定则 trust store 文件的密码
      truststore.password: "${TB_KAFKA_SSL_TRUSTSTORE_PASSWORD:}"
      # key store 文件的位置。对客户端为可选，可用于客户端双向认证
      keystore.location: "${TB_KAFKA_SSL_KEYSTORE_LOCATION:}"
      # key store 文件的 store 密码。对客户端为可选，仅在配置了 ‘ssl.keystore.location’ 时需要。PEM 格式不支持 key store 密码
      keystore.password: "${TB_KAFKA_SSL_KEYSTORE_PASSWORD:}"
      # key store 文件中私钥或 ‘keystore.key’ 指定的 PEM 密钥的密码
      key.password: "${TB_KAFKA_SSL_KEY_PASSWORD:}"
    # producer 认为请求完成前要求 leader 收到的确认数。控制发送记录的持久性。允许的值：0、1 和 all
    acks: "${TB_KAFKA_ACKS:all}"
    # 重试次数。对因可能为瞬时错误而发送失败的记录进行重发
    retries: "${TB_KAFKA_RETRIES:1}"
    # producer 生成的所有数据的压缩类型。默认为 none（即不压缩）。有效值：none 或 gzip
    compression.type: "${TB_KAFKA_COMPRESSION_TYPE:none}" # none 或 gzip
    # 默认 batch 大小。此设置给出待发送 batch 大小的上限
    batch.size: "${TB_KAFKA_BATCH_SIZE:16384}"
    # 此变量产生少量人为延迟，即不会立即发送记录
    linger.ms: "${TB_KAFKA_LINGER_MS:1}"
    # 请求的最大字节大小。此设置限制 producer 在单次请求中发送的 record batch 数量，以避免发送过大请求
    max.request.size: "${TB_KAFKA_MAX_REQUEST_SIZE:1048576}"
    # 客户端在阻塞前可在单条连接上发送的最大未确认请求数
    max.in.flight.requests.per.connection: "${TB_KAFKA_MAX_IN_FLIGHT_REQUESTS_PER_CONNECTION:5}"
    # producer 可用于缓冲待发送到服务器的记录的内存总字节数
    buffer.memory: "${TB_BUFFER_MEMORY:33554432}"
    # Kafka 多个 broker 上的数据副本数
    replication_factor: "${TB_QUEUE_KAFKA_REPLICATION_FACTOR:1}"
    # 使用 consumer group 管理时 poll() 方法调用之间的最大延迟。限制 consumer 在获取更多记录前可空闲的最长时间
    max_poll_interval_ms: "${TB_QUEUE_KAFKA_MAX_POLL_INTERVAL_MS:300000}"
    # 单次 poll() 调用返回的最大记录数
    max_poll_records: "${TB_QUEUE_KAFKA_MAX_POLL_RECORDS:8192}"
    # 服务器每个分区返回的最大数据量。consumer 以 batch 方式获取记录
    max_partition_fetch_bytes: "${TB_QUEUE_KAFKA_MAX_PARTITION_FETCH_BYTES:16777216}"
    # 服务器返回的最大数据量。consumer 以 batch 方式获取记录
    fetch_max_bytes: "${TB_QUEUE_KAFKA_FETCH_MAX_BYTES:134217728}"
    request.timeout.ms: "${TB_QUEUE_KAFKA_REQUEST_TIMEOUT_MS:30000}" # (30 秒) # 参见 https://docs.confluent.io/platform/current/installation/configuration/producer-configs.html#producerconfigs_request.timeout.ms
    session.timeout.ms: "${TB_QUEUE_KAFKA_SESSION_TIMEOUT_MS:10000}" # (10 秒) # 参见 https://docs.confluent.io/platform/current/installation/configuration/consumer-configs.html#consumerconfigs_session.timeout.ms
    auto_offset_reset: "${TB_QUEUE_KAFKA_AUTO_OFFSET_RESET:earliest}" # earliest、latest 或 none
    # 启用/禁用 Confluent Cloud
    use_confluent_cloud: "${TB_QUEUE_KAFKA_USE_CONFLUENT_CLOUD:false}"
    confluent:
      # 客户端用于验证服务器主机名的端点识别算法。默认值为 https
      ssl.algorithm: "${TB_QUEUE_KAFKA_CONFLUENT_SSL_ALGORITHM:https}"
      # 用于认证 Schema Registry 请求的机制。SASL/PLAIN 应仅与 TLS/SSL 传输层一起使用，以确保明文密码不会在未加密的情况下传输
      sasl.mechanism: "${TB_QUEUE_KAFKA_CONFLUENT_SASL_MECHANISM:PLAIN}"
      # 使用 JAAS 配置在 broker 上指定多个 SASL 机制
      sasl.config: "${TB_QUEUE_KAFKA_CONFLUENT_SASL_JAAS_CONFIG:org.apache.kafka.common.security.plain.PlainLoginModule required username=\"CLUSTER_API_KEY\" password=\"CLUSTER_API_SECRET\";}"
      # 与 broker 通信使用的协议。有效值：PLAINTEXT、SSL、SASL_PLAINTEXT、SASL_SSL
      security.protocol: "${TB_QUEUE_KAFKA_CONFLUENT_SECURITY_PROTOCOL:SASL_SSL}"
    other-inline: "${TB_QUEUE_KAFKA_OTHER_PROPERTIES:}" # 在此可指定 Kafka consumer/producer/admin 的自定义参数（分号分隔） # 示例 "metrics.recording.level:INFO;metrics.sample.window.ms:30000"
    other: # 已弃用。在此可指定 Kafka consumer/producer 的自定义参数，并暴露环境变量以便外部配置
    #  - key: "request.timeout.ms" # 参见 https://docs.confluent.io/platform/current/installation/configuration/producer-configs.html#producerconfigs_request.timeout.ms
    #    value: "${TB_QUEUE_KAFKA_REQUEST_TIMEOUT_MS:30000}" # (30 秒)
    #  - key: "session.timeout.ms" # 参见 https://docs.confluent.io/platform/current/installation/configuration/consumer-configs.html#consumerconfigs_session.timeout.ms
    #    value: "${TB_QUEUE_KAFKA_SESSION_TIMEOUT_MS:10000}" # (10 秒)
    topic-properties:
      # Rule Engine 的 Kafka 属性
      rule-engine: "${TB_QUEUE_KAFKA_RE_TOPIC_PROPERTIES:retention.ms:604800000;segment.bytes:52428800;retention.bytes:1048576000;partitions:1;min.insync.replicas:1}"
      # Core 主题的 Kafka 属性
      core: "${TB_QUEUE_KAFKA_CORE_TOPIC_PROPERTIES:retention.ms:604800000;segment.bytes:52428800;retention.bytes:1048576000;partitions:1;min.insync.replicas:1}"
      # Transport Api 主题的 Kafka 属性
      transport-api: "${TB_QUEUE_KAFKA_TA_TOPIC_PROPERTIES:retention.ms:604800000;segment.bytes:52428800;retention.bytes:1048576000;partitions:10;min.insync.replicas:1}"
      # Notifications 主题的 Kafka 属性
      notifications: "${TB_QUEUE_KAFKA_NOTIFICATIONS_TOPIC_PROPERTIES:retention.ms:604800000;segment.bytes:52428800;retention.bytes:1048576000;partitions:1;min.insync.replicas:1}"
      # Housekeeper 任务主题的 Kafka 属性
      housekeeper: "${TB_QUEUE_KAFKA_HOUSEKEEPER_TOPIC_PROPERTIES:retention.ms:604800000;segment.bytes:52428800;retention.bytes:1048576000;partitions:10;min.insync.replicas:1}"
    consumer-stats:
      # 打印 Kafka 主题中 consumer group 偏移量与最后消息偏移量之间的 lag
      enabled: "${TB_QUEUE_KAFKA_CONSUMER_STATS_ENABLED:true}"
      # Kafka consumer-groups 统计信息的打印间隔
      print-interval-ms: "${TB_QUEUE_KAFKA_CONSUMER_STATS_MIN_PRINT_INTERVAL_MS:60000}"
      # 等待向 Kafka 发送的统计加载请求完成的时间
      kafka-response-timeout-ms: "${TB_QUEUE_KAFKA_CONSUMER_STATS_RESPONSE_TIMEOUT_MS:1000}"
  partitions:
    hash_function_name: "${TB_QUEUE_PARTITIONS_HASH_FUNCTION_NAME:murmur3_128}"  # murmur3_32、murmur3_128 或 sha256
  transport_api:
    # 用于消费来自 transport 微服务 API 请求的主题
    requests_topic: "${TB_QUEUE_TRANSPORT_API_REQUEST_TOPIC:tb_transport.api.requests}"
    # 用于向 transport 微服务生产 API 响应的主题
    responses_topic: "${TB_QUEUE_TRANSPORT_API_RESPONSE_TOPIC:tb_transport.api.responses}"
    # 服务器待处理的来自 transport 微服务的最大 API 请求数
    max_pending_requests: "${TB_QUEUE_TRANSPORT_MAX_PENDING_REQUESTS:10000}"
    # 服务器处理来自 transport 微服务 API 请求的最大超时时间（毫秒）
    max_requests_timeout: "${TB_QUEUE_TRANSPORT_MAX_REQUEST_TIMEOUT:10000}"
    # 用于调用回调的线程数
    max_callback_threads: "${TB_QUEUE_TRANSPORT_MAX_CALLBACK_THREADS:100}"
    # 从 transport 微服务轮询 API 请求的间隔（毫秒）
    request_poll_interval: "${TB_QUEUE_TRANSPORT_REQUEST_POLL_INTERVAL_MS:25}"
    # 从 transport 微服务轮询 API 响应的间隔（毫秒）
    response_poll_interval: "${TB_QUEUE_TRANSPORT_RESPONSE_POLL_INTERVAL_MS:25}"
  core:
    # 默认主题名
    topic: "${TB_QUEUE_CORE_TOPIC:tb_core}"
    # 需要最低延迟和处理时间的高优先级通知
    notifications_topic: "${TB_QUEUE_CORE_NOTIFICATIONS_TOPIC:tb_core.notifications}"
    # Core 微服务轮询消息的间隔（毫秒）
    poll-interval: "${TB_QUEUE_CORE_POLL_INTERVAL_MS:25}"
    # Core 微服务使用的分区数
    partitions: "${TB_QUEUE_CORE_PARTITIONS:10}"
    # Core 微服务处理消息包的超时时间
    pack-processing-timeout: "${TB_QUEUE_CORE_PACK_PROCESSING_TIMEOUT_MS:60000}"
    # 统计主题名
    usage-stats-topic: "${TB_QUEUE_US_TOPIC:tb_usage_stats}"
    stats:
      # 启用/禁用 Core 微服务统计
      enabled: "${TB_QUEUE_CORE_STATS_ENABLED:false}"
      # Core 微服务统计信息打印间隔
      print-interval-ms: "${TB_QUEUE_CORE_STATS_PRINT_INTERVAL_MS:10000}"
    housekeeper:
      # Housekeeper 任务的主题名
      topic: "${TB_HOUSEKEEPER_TOPIC:tb_housekeeper}"
  rule-engine:
    # 已弃用。将在近期版本中移除
    topic: "${TB_QUEUE_RULE_ENGINE_TOPIC:tb_rule_engine}"
    # 需要最低延迟和处理时间的高优先级通知
    notifications_topic: "${TB_QUEUE_RULE_ENGINE_NOTIFICATIONS_TOPIC:tb_rule_engine.notifications}"
    # Rule Engine 轮询消息的间隔（毫秒）
    poll-interval: "${TB_QUEUE_RULE_ENGINE_POLL_INTERVAL_MS:25}"
    # Rule Engine 处理消息包的超时时间
    pack-processing-timeout: "${TB_QUEUE_RULE_ENGINE_PACK_PROCESSING_TIMEOUT_MS:60000}"
    stats:
      # 启用/禁用 Rule Engine 统计
      enabled: "${TB_QUEUE_RULE_ENGINE_STATS_ENABLED:true}"
      # Rule Engine 统计信息打印间隔
      print-interval-ms: "${TB_QUEUE_RULE_ENGINE_STATS_PRINT_INTERVAL_MS:60000}"
  transport:
    # 需要最低延迟和处理时间的高优先级通知
    notifications_topic: "${TB_QUEUE_TRANSPORT_NOTIFICATIONS_TOPIC:tb_transport.notifications}"
    # 轮询消息的间隔（毫秒）
    poll_interval: "${TB_QUEUE_TRANSPORT_NOTIFICATIONS_POLL_INTERVAL_MS:25}"

# 通用服务参数
service:
  type: "${TB_SERVICE_TYPE:tb-transport}" # monolith 或 tb-core 或 tb-rule-engine
  # 此服务的唯一 id（为空则自动生成）
  id: "${TB_SERVICE_ID:tb-udp-transport1}"

# 使用统计参数
usage:
  stats:
    report:
      # 启用/禁用 API 使用统计收集。默认在系统和租户级别收集
      enabled: "${USAGE_STATS_REPORT_ENABLED:true}"
      # 启用/禁用客户级别的 API 使用统计收集
      enabled_per_customer: "${USAGE_STATS_REPORT_PER_CUSTOMER_ENABLED:false}"
      # 统计报告间隔，默认每 10 秒发送汇总数据
      interval: "${USAGE_STATS_REPORT_INTERVAL:60}"
      # 每个数据包中的统计消息数量
      pack_size: "${USAGE_STATS_REPORT_PACK_SIZE:1024}"

# Metrics 参数
metrics:
  # 启用/禁用 actuator metrics。
  enabled: "${METRICS_ENABLED:false}"

# 通用 management 参数
management:
  endpoints:
    web:
      exposure:
        # 暴露 metrics 端点（使用值 'prometheus' 启用 prometheus metrics）。
        include: '${METRICS_ENDPOINTS_EXPOSE:info}'

# 通知系统参数
notification_system:
  rules:
    # 触发类型的去重时长（毫秒，分号分隔）。格式：'NotificationRuleTriggerType1:123;NotificationRuleTriggerType2:456'
    deduplication_durations: "${TB_NOTIFICATION_RULES_DEDUPLICATION_DURATIONS:RATE_LIMITS:14400000;}"
