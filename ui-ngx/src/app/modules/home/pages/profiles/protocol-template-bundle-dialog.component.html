<h2 mat-dialog-title>{{ (isNew ? 'profiles.protocol-templates-dialog-add-title' : 'profiles.protocol-templates-dialog-edit-title') | translate }}</h2>

<div mat-dialog-content class="protocol-template-bundle-dialog-content flex flex-col gap-2">
  <mat-form-field class="mat-block w-full flex-none" subscriptSizing="fixed" [formGroup]="bundleMetaForm">
    <mat-label translate>profiles.protocol-templates-bundle-display-name</mat-label>
    <input matInput formControlName="name" autocomplete="off">
  </mat-form-field>

  <div class="protocol-template-bundle-tabs-shell">
    <mat-tab-group mat-stretch-tabs="false" animationDuration="0ms" class="protocol-template-bundle-tabs">
      <mat-tab [label]="'profiles.protocol-templates-tab-templates' | translate">
        <div class="tab-scroll">
          <tb-protocol-template-bundle-editor
            [layoutMode]="'templatesOnly'"
            [protocolTemplateFormGroup]="bundleContentForm"
            [disabled]="false">
          </tb-protocol-template-bundle-editor>
        </div>
      </mat-tab>
      <mat-tab [label]="'profiles.protocol-templates-tab-commands' | translate">
        <div class="tab-scroll">
          <tb-protocol-template-bundle-editor
            [layoutMode]="'commandsOnly'"
            [protocolTemplateFormGroup]="bundleContentForm"
            [disabled]="false">
          </tb-protocol-template-bundle-editor>
        </div>
      </mat-tab>
    </mat-tab-group>
  </div>

  <div class="protocol-template-bundle-dialog-footer">
    <mat-form-field class="mat-block w-full bundle-meta-description-field"
                    subscriptSizing="fixed"
                    [formGroup]="bundleMetaForm"
                    [matTooltip]="descriptionDialogFullTooltip"
                    matTooltipShowDelay="400"
                    matTooltipMaxWidth="360px">
      <mat-label translate>profiles.protocol-templates-bundle-description</mat-label>
      <textarea matInput formControlName="description" rows="1" autocomplete="off"></textarea>
      <mat-hint translate>profiles.protocol-templates-bundle-description-hint-inline</mat-hint>
    </mat-form-field>
  </div>
</div>

<div mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ 'action.cancel' | translate }}</button>
  <button mat-raised-button color="primary" type="button" (click)="save()">{{ 'action.save' | translate }}</button>
</div>
