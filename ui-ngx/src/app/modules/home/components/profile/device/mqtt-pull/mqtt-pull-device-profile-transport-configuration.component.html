<form [formGroup]="form" class="mqtt-pull-form">
  <p class="tb-hint" translate>device-profile.mqtt-pull.profile-connection-hint</p>
  <p class="tb-hint" translate>device-profile.mqtt-pull.uav-protocol-preset-hint</p>
  <section class="flex flex-row gap-2 xs:flex-col global-timing">
    <mat-form-field class="flex-1 mat-block">
      <mat-label translate>device-profile.mqtt-pull.connect-timeout-ms</mat-label>
      <input matInput type="number" formControlName="connectTimeoutMs" required>
    </mat-form-field>
    <mat-form-field class="flex-1 mat-block">
      <mat-label translate>device-profile.mqtt-pull.keep-alive-sec</mat-label>
      <input matInput type="number" formControlName="keepAliveSec" required>
    </mat-form-field>
    <mat-form-field class="flex-1 mat-block">
      <mat-label translate>device-profile.mqtt-pull.reconnect-interval-ms</mat-label>
      <input matInput type="number" formControlName="reconnectIntervalMs" required>
    </mat-form-field>
  </section>
  <mat-checkbox formControlName="cleanSession">
    {{ 'device-profile.mqtt-pull.clean-session' | translate }}
  </mat-checkbox>

  <tb-mqtt-pull-subscribe-requests-config
    formControlName="subscribeRequests">
  </tb-mqtt-pull-subscribe-requests-config>
</form>
