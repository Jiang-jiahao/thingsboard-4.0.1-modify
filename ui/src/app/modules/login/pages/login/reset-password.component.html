<div class="jnks-iot-reset-password-content mat-app-background jnks-iot-dark flex flex-row items-center justify-center" style="width: 100%;">
  <mat-card appearance="raised" class="jnks-iot-reset-password-card flex-initial">
    <mat-card-header>
      <mat-card-title class="layout-padding jnks-iot-card-title">
        <span translate class="mat-headline-5 jnks-iot-card-title">login.password-reset</span>
      </mat-card-title>
      <mat-card-subtitle *ngIf="isExpiredPassword" class="layout-padding jnks-iot-card-title">
        <div class="jnks-iot-card-title" translate>login.expired-password-reset-message</div>
      </mat-card-subtitle>
    </mat-card-header>
    <mat-progress-bar color="warn" mode="indeterminate" *ngIf="isLoading$ | async">
    </mat-progress-bar>
    <span style="height: 4px;" *ngIf="!(isLoading$ | async)"></span>
    <mat-card-content>
      <form [formGroup]="resetPassword" (ngSubmit)="onResetPassword()">
        <fieldset [disabled]="isLoading$ | async">
          <div jnks-iot-toast class="layout-padding flex flex-col">
            <span style="height: 50px;"></span>
            <mat-form-field class="mat-block jnks-iot-appearance-transparent">
              <mat-label translate>login.new-password</mat-label>
              <input matInput type="password" autofocus formControlName="newPassword"/>
              <mat-icon class="material-icons" matPrefix>lock</mat-icon>
              <jnks-iot-toggle-password matSuffix></jnks-iot-toggle-password>
            </mat-form-field>
            <mat-form-field class="mat-block jnks-iot-appearance-transparent">
              <mat-label translate>login.new-password-again</mat-label>
              <input matInput type="password" formControlName="newPassword2"/>
              <mat-icon class="material-icons" matPrefix>lock</mat-icon>
              <jnks-iot-toggle-password matSuffix></jnks-iot-toggle-password>
            </mat-form-field>
            <div class="flex flex-col items-center justify-start gap-4 gt-sm:flex-row gt-sm:items-start gt-sm:justify-center">
              <button mat-raised-button color="accent" type="submit" [disabled]="(isLoading$ | async)">
                {{ 'login.reset-password' | translate }}
              </button>
              <button mat-button type="button" [disabled]="(isLoading$ | async)"
                      routerLink="/login">
                {{ 'action.cancel' | translate }}
              </button>
            </div>
          </div>
        </fieldset>
      </form>
    </mat-card-content>
  </mat-card>
</div>
