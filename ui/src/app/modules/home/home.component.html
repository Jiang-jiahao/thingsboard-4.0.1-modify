<mat-sidenav-container>
  <mat-sidenav #sidenav class="jnks-iot-site-sidenav mat-elevation-z2"
               [disableClose]="sidenavOpened"
               (click)="sidenavClicked()"
               [mode]="sidenavMode"
               [opened]="sidenavOpened && !forceFullscreen">
    <header class="jnks-iot-nav-header">
      <mat-toolbar color="primary" class="jnks-iot-nav-header-toolbar">
        <div class="flex flex-auto">
          <jnks-iot-logo class="jnks-iot-nav-logo"></jnks-iot-logo>
        </div>
      </mat-toolbar>
    </header>
    <mat-toolbar color="primary" class="jnks-iot-side-menu-toolbar flex flex-1 flex-col" role="navigation">
      <jnks-iot-side-menu></jnks-iot-side-menu>
    </mat-toolbar>
  </mat-sidenav>
  <mat-sidenav-content>
    <div class="flex flex-col" role="main" style="height: 100%;">
      <mat-toolbar class="jnks-iot-primary-toolbar flex flex-row">
        <button mat-icon-button id="main"
                [class.!hidden]="forceFullscreen || displaySearchMode()"
                class="gt-sm:!hidden" (click)="sidenav.toggle()">
          <mat-icon class="material-icons">menu</mat-icon>
        </button>
        <button mat-icon-button
                [class.!hidden]="!forceFullscreen || displaySearchMode"
                (click)="goBack()">
          <mat-icon class="material-icons">arrow_back</mat-icon>
        </button>
        <button mat-icon-button
                [class.!hidden]="!displaySearchMode()"
                (click)="closeSearch()">
          <mat-icon class="material-icons">arrow_back</mat-icon>
        </button>
        <jnks-iot-breadcrumb
            [class.!hidden]="displaySearchMode()"
            class="mat-toolbar-tools flex-1">
        </jnks-iot-breadcrumb>
        <div [class.!hidden]="!displaySearchMode()" class="jnks-iot-dark flex flex-1 flex-row">
          <mat-form-field class="jnks-iot-appearance-transparent flex-1">
            <input #searchInput matInput
                   [formControl]="textSearch"
                   placeholder="{{ 'common.enter-search' | translate }}"/>
          </mat-form-field>
        </div>
        <button [class.!hidden]="!searchEnabled"
                mat-icon-button (click)="openSearch()">
          <mat-icon class="material-icons">search</mat-icon>
        </button>
        <button *ngIf="fullscreenEnabled"
                [class.!hidden]="displaySearchMode()"
                class="lt-md:!hidden"
                mat-icon-button (click)="toggleFullscreen()">
          <mat-icon class="material-icons">{{ isFullscreen() ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
        </button>
        <jnks-iot-notification-bell></jnks-iot-notification-bell>
        <jnks-iot-user-menu [displayUserInfo]="!displaySearchMode()"></jnks-iot-user-menu>
      </mat-toolbar>
      <!-- 顶部加载指示：样式在 ui-refinements.scss 的 .jnks-iot-top-loading（扫描光带），
           不要 color="warn"（Material 的 warn 是红，加载不是异常）。 -->
      <mat-progress-bar class="jnks-iot-top-loading" style="z-index: 10; margin-bottom: -4px; width: 100%;" mode="indeterminate"
                        *ngIf="!hideLoadingBar && (isLoading$ | async)">
      </mat-progress-bar>
      <div jnks-iot-toast class="jnks-iot-main-content flex flex-1 flex-col">
        <router-outlet (activate)="activeComponentChanged($event)"></router-outlet>
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
