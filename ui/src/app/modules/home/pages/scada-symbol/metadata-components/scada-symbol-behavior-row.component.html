<div [formGroup]="behaviorRowFormGroup" class="jnks-iot-form-table-row jnks-iot-scada-symbol-metadata-behavior-row">
  <mat-form-field class="jnks-iot-inline-field jnks-iot-id-field" appearance="outline" subscriptSizing="dynamic">
    <input #idInput required matInput formControlName="id" placeholder="{{ 'widget-config.set' | translate }}">
  </mat-form-field>
  <mat-form-field class="jnks-iot-inline-field jnks-iot-name-field" appearance="outline" subscriptSizing="dynamic">
    <input required matInput formControlName="name" placeholder="{{ 'widget-config.set' | translate }}">
  </mat-form-field>
  <mat-form-field class="jnks-iot-inline-field jnks-iot-type-field fixed-height" appearance="outline" subscriptSizing="dynamic">
    <mat-select formControlName="type">
      <mat-option *ngFor="let type of scadaSymbolBehaviorTypes" [value]="type">
        {{ scadaSymbolBehaviorTypeTranslations.get(type) | translate }}
      </mat-option>
    </mat-select>
  </mat-form-field>
  <div class="jnks-iot-form-table-row-cell-buttons">
    <button type="button"
            mat-icon-button
            #editButton
            (click)="editBehavior($event, editButton)"
            matTooltip="{{ 'scada.behavior.behavior-settings' | translate }}"
            matTooltipPosition="above">
      <mat-icon>settings</mat-icon>
    </button>
    <button *ngIf="!disabled"
            type="button"
            mat-icon-button
            (click)="behaviorRemoved.emit()"
            matTooltip="{{ 'scada.behavior.remove-behavior' | translate }}"
            matTooltipPosition="above">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
</div>
