<div class="jnks-iot-form-panel jnks-iot-scada-symbol-behaviors">
  <div class="jnks-iot-form-table">
    <div class="jnks-iot-form-table-header" [class.no-padding-right]="!disabled">
      <div class="jnks-iot-form-table-header-cell jnks-iot-id-header" translate>scada.behavior.id</div>
      <div class="jnks-iot-form-table-header-cell jnks-iot-name-header" translate>scada.behavior.name</div>
      <div class="jnks-iot-form-table-header-cell jnks-iot-type-header" translate>scada.behavior.type</div>
      <div class="jnks-iot-form-table-header-cell jnks-iot-actions-header" [class.disabled]="disabled"></div>
    </div>
    <div *ngIf="behaviorsFormArray().controls.length; else noBehaviors" class="jnks-iot-form-table-body jnks-iot-drop-list"
         cdkDropList cdkDropListOrientation="vertical"
         [cdkDropListDisabled]="!dragEnabled"
         (cdkDropListDropped)="behaviorDrop($event)">
      <div cdkDrag [cdkDragDisabled]="!dragEnabled"
           [class.jnks-iot-draggable]="!disabled"
           [class.jnks-iot-draggable-form-table-row]="!disabled"
           *ngFor="let behaviorControl of behaviorsFormArray().controls; trackBy: trackByBehavior; let $index = index;">
        <jnks-iot-scada-symbol-metadata-behavior-row class="flex-1"
          [index]="$index"
          [formControl]="behaviorControl"
          [aliasController]="aliasController"
          [callbacks]="callbacks"
          (behaviorRemoved)="removeBehavior($index)">
        </jnks-iot-scada-symbol-metadata-behavior-row>
        <div class="jnks-iot-form-table-row-cell-buttons">
          <button mat-icon-button
                  *ngIf="!disabled"
                  type="button"
                  cdkDragHandle
                  [class.jnks-iot-hidden]="!dragEnabled"
                  matTooltip="{{ 'action.drag' | translate }}"
                  matTooltipPosition="above">
            <mat-icon>drag_indicator</mat-icon>
          </button>
        </div>
      </div>
    </div>
    <jnks-iot-error *ngIf="errorText" noMargin [error]="errorText" style="padding-left: 12px;"></jnks-iot-error>
  </div>
  <div *ngIf="!disabled">
    <button type="button" mat-stroked-button color="primary" (click)="addBehavior()">
      {{ 'scada.behavior.add-behavior' | translate }}
    </button>
  </div>
</div>

<ng-template #noBehaviors>
  <span class="jnks-iot-prompt flex items-center justify-center">{{ 'scada.behavior.no-behaviors' | translate }}</span>
</ng-template>
