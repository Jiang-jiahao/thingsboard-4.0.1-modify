<form (ngSubmit)="add()" class="dialog-container">
  <mat-toolbar color="primary">
    <h2 translate>rulenode.add</h2>
    <span class="flex-1">: {{ruleNode.component.name}}</span>
    <button mat-icon-button
            (click)="cancel()"
            type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  <mat-progress-bar color="warn" mode="indeterminate" *ngIf="isLoading$ | async">
  </mat-progress-bar>
  <div mat-dialog-content>
    <jnks-iot-rule-node #jnksIotRuleNode
                  [ruleNode]="ruleNode"
                  [ruleChainId]="ruleChainId"
                  [ruleChainType]="ruleChainType"
                  isAdd>
    </jnks-iot-rule-node>
  </div>
  <div mat-dialog-actions class="flex items-center justify-end">
    <button mat-button color="primary"
            type="button"
            [disabled]="(isLoading$ | async)"
            (click)="cancel()" cdkFocusInitial>
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button color="primary"
            type="submit"
            [disabled]="(isLoading$ | async) || jnksIotRuleNode.ruleNodeFormGroup.invalid || !jnksIotRuleNode.ruleNodeFormGroup.dirty">
      {{ 'action.add' | translate }}
    </button>
  </div>
</form>
