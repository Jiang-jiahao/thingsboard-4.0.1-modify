<div [formGroup]="ruleNodeConfigFormGroup">
  <ng-container #definedConfigContent></ng-container>
  <div class="jnks-iot-rulenode-directive-error" *ngIf="definedDirectiveError">{{definedDirectiveError}}</div>
  <jnks-iot-json-object-edit *ngIf="!useDefinedDirective()" #jsonObjectEditComponent
                       class="jnks-iot-rule-node-configuration-json"
                       formControlName="configuration"
                       [label]="'rulenode.configuration' | translate"
                       [jsonRequired]="required"
                       [fillHeight]="true">
  </jnks-iot-json-object-edit>
</div>
