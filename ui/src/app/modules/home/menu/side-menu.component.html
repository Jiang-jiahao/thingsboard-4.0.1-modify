<ul class="jnks-iot-side-menu flex flex-col items-stretch justify-start">
  <li *ngFor="let section of menuSections$ | async; trackBy: trackByMenuSection" [ngSwitch]="section.type === 'link'">
    <jnks-iot-menu-link *ngSwitchCase="true" [section]="section"></jnks-iot-menu-link>
    <jnks-iot-menu-toggle *ngSwitchCase="false" [section]="section"></jnks-iot-menu-toggle>
  </li>
</ul>
