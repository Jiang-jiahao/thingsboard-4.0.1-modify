<a mat-button routerLinkActive="jnks-iot-active" [routerLinkActiveOptions]="{paths: 'subset', queryParams: 'ignored', matrixParams: 'ignored', fragment: 'ignored'}" routerLink="{{section.path}}">
  <jnks-iot-icon matButtonIcon *ngIf="section.icon !== null">{{section.icon}}</jnks-iot-icon>
  <span>{{section.customTranslate ? (section.name | customTranslate) : (section.name | translate)}}</span>
</a>
