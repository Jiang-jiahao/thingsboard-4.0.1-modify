<section [formGroup]="deviceProfile" class="jnks-iot-form-panel stroked">
  <div class="jnks-iot-form-hint jnks-iot-primary-fill" translate>rule-node-config.device-profile-node-hint</div>
  <div jnks-iot-hint-tooltip-icon="{{'rule-node-config.persist-alarm-rules-hint' | translate }}"
       class="jnks-iot-form-row no-border no-padding slide-toggle">
    <mat-slide-toggle class="mat-slide" formControlName="persistAlarmRulesState">
      {{ 'rule-node-config.persist-alarm-rules' | translate }}
    </mat-slide-toggle>
  </div>
  <div jnks-iot-hint-tooltip-icon="{{'rule-node-config.fetch-alarm-rules-hint' | translate }}"
       class="jnks-iot-form-row no-border no-padding slide-toggle">
    <mat-slide-toggle class="mat-slide" formControlName="fetchAlarmRulesStateOnStart">
      {{ 'rule-node-config.fetch-alarm-rules' | translate }}
    </mat-slide-toggle>
  </div>
</section>
