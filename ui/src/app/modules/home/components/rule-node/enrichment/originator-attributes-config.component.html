<section class="jnks-iot-form-panel no-padding no-border" [formGroup]="originatorAttributesConfigForm">
  <div class="jnks-iot-form-panel stroked">
    <div class="jnks-iot-form-row no-padding no-border space-between">
      <div class="jnks-iot-form-panel-title jnks-iot-required" translate>rule-node-config.originator-attributes</div>
      <div class="jnks-iot-form-panel-hint jnks-iot-error" translate
           [hidden]="!(originatorAttributesConfigForm.get('attributesControl').touched &&
                        originatorAttributesConfigForm.get('attributesControl').hasError('atLeastOneRequired'))">
        rule-node-config.at-least-one-field-required
      </div>
    </div>
    <jnks-iot-select-attributes formControlName="attributesControl"
                          popupHelpLink="rulenode/originator_attributes_node_fields_templatization">
    </jnks-iot-select-attributes>
    <jnks-iot-msg-metadata-chip [labelText]="'rule-node-config.add-originator-attributes-to' | translate"
                          formControlName="fetchTo">
    </jnks-iot-msg-metadata-chip>
  </div>
  <div jnks-iot-hint-tooltip-icon="{{ 'rule-node-config.tell-failure-tooltip' | translate }}" class="jnks-iot-form-row same-padding">
    <mat-slide-toggle class="mat-slide margin" formControlName="tellFailureIfAbsent">
      {{ 'rule-node-config.tell-failure' | translate }}
    </mat-slide-toggle>
  </div>
</section>
