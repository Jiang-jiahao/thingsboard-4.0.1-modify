<div class="flex flex-1 flex-col" style="width: 100%;">
  <div class="flex flex-row" style="width: 100%;">
    <nav *ngIf="!routerOutlet?.activatedRouteData?.hideTabs && !hideCurrentTabs && (tabs$ | async).length > 1" mat-tab-nav-bar mat-stretch-tabs="false" class="jnks-iot-router-tabs flex-1" [tabPanel]="tabPanel">
      <a *ngFor="let tab of tabs$ | async"
         routerLink="{{tab.path}}"
         replaceUrl="{{ replaceUrl }}"
         routerLinkActive
         #rla="routerLinkActive"
         mat-tab-link
         [active]="rla.isActive">
        <jnks-iot-icon *ngIf="tab.icon !== null" class="jnks-iot-mat-18">{{tab.icon}}</jnks-iot-icon>
        <span>{{tab.name | translate}}</span>
      </a>
    </nav>
    <jnks-iot-anchor #tabsHeaderComponent></jnks-iot-anchor>
  </div>
  <mat-tab-nav-panel #tabPanel class="jnks-iot-router-tabs-content flex flex-1 flex-col">
    <router-outlet #routerOutlet="outlet" (activate)="activeComponentChanged($event)"></router-outlet>
  </mat-tab-nav-panel>
</div>
