<button type="button"
        mat-stroked-button
        class="jnks-iot-box-button"
        [disabled]="disabled"
        #matButton
        (click)="openImageSettingsPopup($event, matButton)">
  <jnks-iot-icon matButtonIcon *ngIf="modelValue?.type === MarkerImageType.function; else imagePreview">mdi:function-variant</jnks-iot-icon>
</button>
<ng-template #imagePreview>
  <img width="24px" height="24px" style="object-fit: contain;" [src]="modelValue?.image | image : {preview: true} | async" [class.disabled]="disabled"/>
</ng-template>
