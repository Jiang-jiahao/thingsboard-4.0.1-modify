<div class="jnks-iot-widget-button-custom-style">
  <div class="jnks-iot-widget-button-preview-panel jnks-iot-primary-fill">
    <jnks-iot-widget-button
      [appearance]="previewAppearance"
      [borderRadius]="borderRadius"
      [autoScale]="autoScale"
      disableEvents
      [hovered]="state === widgetButtonState.hovered"
      [pressed]="state === widgetButtonState.pressed"
      [activated]="state === widgetButtonState.activated"
      [disabled]="state === widgetButtonState.disabled">
    </jnks-iot-widget-button>
    <button *ngIf="modelValue"
            mat-icon-button
            [matTooltip]="'widgets.button.clear-style' | translate"
            matTooltipPosition="above"
            class="jnks-iot-mat-32"
            (click)="clearStyle()">
      <jnks-iot-icon>mdi:broom</jnks-iot-icon>
    </button>
  </div>
  <button mat-icon-button
          class="jnks-iot-mat-32"
          #matIconButton
          (click)="openButtonCustomStylePopup($event, matIconButton)">
    <mat-icon>edit</mat-icon>
  </button>
</div>
