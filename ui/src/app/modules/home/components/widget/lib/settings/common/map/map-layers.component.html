<div class="jnks-iot-form-panel no-padding no-border">
  <div class="jnks-iot-form-table jnks-iot-map-layers">
    <div class="jnks-iot-form-table-header no-padding-right">
      <div class="jnks-iot-form-table-header-cell jnks-iot-label-header" translate>widgets.maps.layer.label</div>
      <div class="jnks-iot-form-table-header-cell jnks-iot-provider-header" translate>widgets.maps.layer.provider.provider</div>
      <div class="jnks-iot-form-table-header-cell jnks-iot-layer-header" translate>widgets.maps.layer.layer</div>
      <div class="jnks-iot-form-table-header-cell jnks-iot-actions-header"></div>
    </div>
    <div *ngIf="layersFormArray().controls.length; else noLayers" class="jnks-iot-form-table-body jnks-iot-drop-list max-h-64 overflow-y-auto"
         cdkDropList cdkDropListOrientation="vertical"
         [cdkDropListDisabled]="!dragEnabled"
         (cdkDropListDropped)="layerDrop($event)">
      <div cdkDrag [cdkDragDisabled]="!dragEnabled"
           class="jnks-iot-draggable-form-table-row"
           *ngFor="let layerControl of layersFormArray().controls; trackBy: trackByLayer; let $index = index;">
        <jnks-iot-map-layer-row class="flex-1"
                          [formControl]="layerControl"
                          (layerRemoved)="removeLayer($index)"></jnks-iot-map-layer-row>
        <div class="jnks-iot-form-table-row-cell-buttons">
          <button [class.jnks-iot-hidden]="!dragEnabled"
                  mat-icon-button
                  type="button"
                  cdkDragHandle
                  matTooltip="{{ 'action.drag' | translate }}"
                  matTooltipPosition="above">
            <mat-icon>drag_indicator</mat-icon>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div>
    <button type="button" mat-stroked-button color="primary" (click)="addLayer()">
      {{ 'widgets.maps.layer.add-layer' | translate }}
    </button>
  </div>
</div>
<ng-template #noLayers>
  <span class="jnks-iot-prompt flex items-center justify-center">{{ 'widgets.maps.layer.no-layers' | translate }}</span>
</ng-template>
