<div class="jnks-iot-axis-settings-panel" [formGroup]="axisSettingsFormGroup">
  <div class="jnks-iot-axis-settings-title">{{ panelTitle }}</div>
  <div class="jnks-iot-axis-settings-panel-content">
    <jnks-iot-time-series-chart-axis-settings
      formControlName="axis"
      alwaysExpanded
      [advanced]="advanced"
      [axisType]="axisType">
    </jnks-iot-time-series-chart-axis-settings>
  </div>
  <div class="jnks-iot-axis-settings-panel-buttons">
    <button mat-button
            color="primary"
            type="button"
            (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button
            color="primary"
            type="button"
            (click)="applyAxisSettings()"
            [disabled]="axisSettingsFormGroup.invalid || !axisSettingsFormGroup.dirty">
      {{ 'action.apply' | translate }}
    </button>
  </div>
</div>
