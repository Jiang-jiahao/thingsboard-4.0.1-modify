<div #statusWidgetPanel class="jnks-iot-status-widget-panel" [style]="backgroundStyle$ | async">
  <div class="jnks-iot-status-widget-overlay" [style]="overlayStyle" [style.inset]="overlayInset"></div>
  <div class="jnks-iot-status-widget-title-panel">
    <ng-container *ngTemplateOutlet="widgetTitlePanel"></ng-container>
  </div>
  <div #statusWidgetContent class="jnks-iot-status-widget-content" [class]="this.layout" [style.padding]="padding">
    <div class="jnks-iot-status-widget-icon-container">
      <jnks-iot-icon [style]="iconStyle">{{ icon }}</jnks-iot-icon>
    </div>
    <div class="jnks-iot-status-widget-labels-container">
      <div *ngIf="showLabel" class="jnks-iot-status-widget-label" [style]="labelStyle">{{ label$ | async }}</div>
      <div *ngIf="showStatus" class="jnks-iot-status-widget-status" [style]="statusStyle">{{ status$ | async }}</div>
    </div>
  </div>
  <mat-progress-bar class="jnks-iot-action-widget-progress" style="height: 4px;" color="accent" mode="indeterminate" *ngIf="loading$ | async"></mat-progress-bar>
</div>
