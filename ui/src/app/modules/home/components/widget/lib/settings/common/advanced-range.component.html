<div class="jnks-iot-form-row no-padding no-border" style="gap: 0; width: 100%;" [formGroup]="advancedRangeLevelFormGroup">
  <div class="range-container">
    <div class="range-input range-input-fields">
      <div class="flex flex-1 flex-row items-center justify-start">
        <div class="range-text" translate>widgets.color.from</div>
        <jnks-iot-value-source-data-key class="flex-1"
                                  formControlName="from"
                                  [aliasController]="aliasController"
                                  [dataKeyCallbacks]="dataKeyCallbacks"
                                  [datasource]="datasource">
        </jnks-iot-value-source-data-key>
      </div>
      <div class="flex flex-1 flex-row items-center justify-start">
        <div class="range-text" translate>widgets.color.to</div>
        <jnks-iot-value-source-data-key class="flex-1"
                                  formControlName="to"
                                  [aliasController]="aliasController"
                                  [dataKeyCallbacks]="dataKeyCallbacks"
                                  [datasource]="datasource">
        </jnks-iot-value-source-data-key>
      </div>
    </div>
    <jnks-iot-color-input asBoxInput
                    class="range-input"
                    required
                    colorClearButton
                    noBorder
                    formControlName="color">
    </jnks-iot-color-input>
  </div>
  <button *ngIf="!disabled" mat-icon-button style="min-width: 40px;"
          type="button"
          class="jnks-iot-box-button"
          (click)="removeAdvancedRange.emit()"
          matTooltip="{{ 'action.remove' | translate }}"
          matTooltipPosition="above">
    <mat-icon>delete</mat-icon>
  </button>
</div>
