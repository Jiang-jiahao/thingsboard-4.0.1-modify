<div class="jnks-iot-image-map-source-settings jnks-iot-form-panel stroked" [formGroup]="imageMapSourceFormGroup">
  <div class="flex flex-row items-center justify-between">
    <div class="jnks-iot-form-panel-title">
      {{ 'widgets.maps.image.image-source' | translate }}
    </div>
    <jnks-iot-toggle-select formControlName="sourceType">
      <jnks-iot-toggle-option [value]="ImageSourceType.image">{{ 'widgets.maps.image.image-source-image' | translate }}</jnks-iot-toggle-option>
      <jnks-iot-toggle-option [value]="ImageSourceType.entityKey">{{ 'widgets.maps.image.image-source-entity-key' | translate }}</jnks-iot-toggle-option>
    </jnks-iot-toggle-select>
  </div>
  <jnks-iot-gallery-image-input *ngIf="ImageSourceType.image === imageMapSourceFormGroup.get('sourceType').value"
                          required
                          formControlName="url">
  </jnks-iot-gallery-image-input>
  <ng-container *ngIf="ImageSourceType.entityKey === imageMapSourceFormGroup.get('sourceType').value">
    <div class="jnks-iot-form-row column-xs">
      <div class="fixed-title-width" translate>widgets.maps.image.source-entity-alias</div>
      <jnks-iot-entity-alias-select
        class="flex-1"
        jnksIotRequired
        inlineField
        [aliasController]="context.aliasController"
        formControlName="entityAliasId"
        [callbacks]="context.callbacks">
      </jnks-iot-entity-alias-select>
    </div>
    <div class="jnks-iot-form-row jnks-iot-standard-fields column-xs">
      <div class="fixed-title-width" translate>widgets.maps.image.image-url-key</div>
      <jnks-iot-data-key-input
        class="flex-1"
        required
        requiredText="widgets.maps.image.image-url-key-required"
        [datasourceType]="DatasourceType.entity"
        [entityAliasId]="imageMapSourceFormGroup.get('entityAliasId').value"
        [aliasController]="context.aliasController"
        [widgetType]="widgetType.latest"
        [dataKeyTypes]="[DataKeyType.attribute, DataKeyType.timeseries]"
        [callbacks]="context.callbacks"
        [generateKey]="context.generateDataKey"
        (keyEdit)="editKey()"
        formControlName="entityKey">
      </jnks-iot-data-key-input>
    </div>
  </ng-container>
</div>
