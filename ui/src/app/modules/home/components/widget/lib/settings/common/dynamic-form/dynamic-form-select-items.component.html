<div class="jnks-iot-form-panel jnks-iot-dynamic-form-select-items no-border no-padding">
  <div class="jnks-iot-form-table">
    <div class="jnks-iot-form-table-header" [class.no-padding-right]="!disabled">
      <div class="jnks-iot-form-table-header-cell jnks-iot-value-header" translate>dynamic-form.property.value</div>
      <div class="jnks-iot-form-table-header-cell jnks-iot-label-header" translate>dynamic-form.property.label</div>
      <div class="jnks-iot-form-table-header-cell jnks-iot-actions-header" [class.disabled]="disabled"></div>
    </div>
    <div *ngIf="selectItemsFormArray().controls.length; else noSelectItems" class="jnks-iot-form-table-body jnks-iot-drop-list"
         cdkDropList cdkDropListOrientation="vertical"
         [cdkDropListDisabled]="!dragEnabled"
         (cdkDropListDropped)="selectItemDrop($event)">
      <div cdkDrag [cdkDragDisabled]="!dragEnabled"
           [class.jnks-iot-draggable]="!disabled"
           [class.jnks-iot-draggable-form-table-row]="!disabled"
           *ngFor="let selectItemControl of selectItemsFormArray().controls; trackBy: trackBySelectItem; let $index = index;">
        <jnks-iot-dynamic-form-select-item-row class="flex-1"
                                         [index]="$index"
                                         [formControl]="selectItemControl"
                                         (selectItemRemoved)="removeSelectItem($index)">
        </jnks-iot-dynamic-form-select-item-row>
        <div class="jnks-iot-form-table-row-cell-buttons">
          <button mat-icon-button
                  *ngIf="!disabled"
                  type="button"
                  cdkDragHandle
                  [class.jnks-iot-hidden]="!dragEnabled"
                  matTooltip="{{ 'action.drag' | translate }}"
                  matTooltipPosition="above">
            <mat-icon>drag_indicator</mat-icon>
          </button>
        </div>
      </div>
    </div>
    <jnks-iot-error *ngIf="errorText" noMargin [error]="errorText" style="padding-left: 12px;"></jnks-iot-error>
  </div>
  <div *ngIf="!disabled">
    <button type="button" mat-stroked-button color="primary" (click)="addSelectItem()">
      {{ 'dynamic-form.property.add-option' | translate }}
    </button>
  </div>
</div>

<ng-template #noSelectItems>
  <span class="jnks-iot-prompt flex items-center justify-center">{{ 'dynamic-form.property.no-options' | translate }}</span>
</ng-template>
