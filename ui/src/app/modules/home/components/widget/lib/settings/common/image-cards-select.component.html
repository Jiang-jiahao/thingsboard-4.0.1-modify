<div class="jnks-iot-image-cards-select jnks-iot-form-panel stroked no-padding">
  <mat-expansion-panel class="jnks-iot-settings" [expanded]="expanded" disabled>
    <mat-expansion-panel-header class="flex flex-row flex-wrap">
      <div class="jnks-iot-form-row no-border flex-1"  [class.expanded]="expanded">
        <div class="fixed-title-width">{{ label }}</div>
        <mat-form-field class="jnks-iot-image-cards-value-field flex-1" appearance="outline" subscriptSizing="dynamic" (click)="toggleSelectPanel($event)">
          <input readonly matInput [formControl]="valueFormControl" placeholder="{{ 'widget-config.set' | translate }}">
          <mat-icon matSuffix>{{ expanded ? 'expand_less' : 'expand_more' }}</mat-icon>
        </mat-form-field>
      </div>
    </mat-expansion-panel-header>
    <ng-template matExpansionPanelContent>
      <mat-grid-list class="jnks-iot-image-cards-options" [cols]="cols$ | async" [rowHeight]="rowHeight" gutterSize="8">
        <mat-grid-tile *ngFor="let option of options" (click)="updateModel(option.value)">
          <div class="jnks-iot-image-cards-option" [class.selected]="modelValue === option.value">
            <div class="jnks-iot-image-cards-option-background"></div>
            <div class="jnks-iot-image-cards-option-title">{{ option.name }}</div>
            <div class="jnks-iot-image-cards-option-image-container">
              <img class="jnks-iot-image-cards-option-image" [src]="option.image"/>
            </div>
          </div>
        </mat-grid-tile>
      </mat-grid-list>
    </ng-template>
  </mat-expansion-panel>
</div>
