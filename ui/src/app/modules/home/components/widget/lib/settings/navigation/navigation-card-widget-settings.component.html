<section class="jnks-iot-widget-settings flex flex-col" [formGroup]="navigationCardWidgetSettingsForm">
  <mat-form-field class="mat-block flex-1">
    <mat-label translate>widgets.navigation.title</mat-label>
    <input required matInput formControlName="name">
  </mat-form-field>
  <jnks-iot-material-icon-select class="flex-1"
                           iconClearButton
                           required
                           formControlName="icon">
  </jnks-iot-material-icon-select>
  <mat-form-field class="mat-block flex-1">
    <mat-label translate>widgets.navigation.navigation-path</mat-label>
    <input required matInput formControlName="path">
  </mat-form-field>
</section>
