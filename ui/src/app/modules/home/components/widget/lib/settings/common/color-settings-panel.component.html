<div class="jnks-iot-color-settings-panel" [formGroup]="colorSettingsFormGroup">
  <div class="jnks-iot-color-settings-title" translate>widgets.color.color-settings</div>
  <div class="flex flex-row">
    <jnks-iot-toggle-select formControlName="type" class="max-w-70% flex-full xs:flex-1">
      <jnks-iot-toggle-option *ngFor="let type of colorTypes"
                        [value]="type">
        {{ colorTypeTranslationsMap.get(type) | translate }}
      </jnks-iot-toggle-option>
    </jnks-iot-toggle-select>
  </div>
  <div class="jnks-iot-form-row space-between">
    <div translate>widgets.color.color</div>
    <jnks-iot-color-input asBoxInput
                    formControlName="color">
    </jnks-iot-color-input>
  </div>
  <div class="jnks-iot-color-settings-panel-body" [class.!hidden]="colorSettingsFormGroup.get('type').value !== colorType.constant">
  </div>
  <div class="jnks-iot-color-settings-panel-body" [class.!hidden]="colorSettingsFormGroup.get('type').value !== colorType.gradient">
    <jnks-iot-gradient class="jnks-iot-gradient-panel"
                 formControlName="gradient"
                 [minValue]="minValue"
                 [maxValue]="maxValue"
                 [advancedMode]="gradientAdvancedMode"
                 [aliasController]="aliasController"
                 [dataKeyCallbacks]="dataKeyCallbacks"
                 [datasource]="datasource"
                 [popover]="popover">
    </jnks-iot-gradient>
  </div>
  <div class="jnks-iot-color-settings-panel-body" [class.!hidden]="colorSettingsFormGroup.get('type').value !== colorType.range">
    <jnks-iot-color-range-list class="jnks-iot-color-ranges-panel"
                         formControlName="rangeList"
                         panelTitle="{{ 'widgets.color.value-range' | translate }}"
                         [advancedMode]="rangeAdvancedMode"
                         [aliasController]="aliasController"
                         [dataKeyCallbacks]="dataKeyCallbacks"
                         [datasource]="datasource"
                         [popover]="popover">
    </jnks-iot-color-range-list>
  </div>
  <div class="jnks-iot-color-settings-panel-body" [class.!hidden]="colorSettingsFormGroup.get('type').value !== colorType.function">
    <ng-container *ngTemplateOutlet="function"></ng-container>
  </div>
  <div class="jnks-iot-color-settings-panel-buttons">
    <button *ngIf="settingsComponents?.length"
            #copySettingsButton
            mat-stroked-button
            color="primary"
            type="button"
            [matMenuTriggerFor]="settingsSourcesMenu" [matMenuTriggerData]="{menuWidth: copySettingsButton._elementRef.nativeElement.clientWidth}">
      <span class="xs:!hidden">{{ 'widgets.color.copy-color-settings-from' | translate }}</span>
      <span class="gt-xs:!hidden">{{ 'widgets.color.copy-from' | translate }}</span>
    </button>
    <mat-menu #settingsSourcesMenu="matMenu">
      <ng-template matMenuContent let-menuWidth="menuWidth">
        <div [style.min-width.px]="menuWidth">
          <button mat-menu-item *ngFor="let comp of settingsComponents" (click)="copyColorSettings(comp)">{{ comp.settingsKey }}</button>
        </div>
      </ng-template>
    </mat-menu>
    <span class="flex-1"></span>
    <button mat-button
            color="primary"
            type="button"
            (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button
            color="primary"
            type="button"
            (click)="applyColorSettings()"
            [disabled]="colorSettingsFormGroup.invalid || !colorSettingsFormGroup.dirty">
      {{ 'action.apply' | translate }}
    </button>
  </div>
</div>

<ng-template #function>
  <div class="jnks-iot-form-panel no-padding no-border" [formGroup]="colorSettingsFormGroup">
    <jnks-iot-js-func formControlName="colorFunction"
                [functionArgs]="['value']"
                [globalVariables]="functionScopeVariables"
                functionTitle="{{ 'widgets.color.color-function' | translate }}"
                helpId="widget/lib/card/value_color_fn">
    </jnks-iot-js-func>
  </div>
</ng-template>
