<ng-container  [formGroup]="colorRangeListFormGroup">
  <div class="flex flex-row items-center justify-start" *ngIf="advancedMode; else basicMode">
    <div class="jnks-iot-form-panel-title flex-1" translate>widgets.color.settings-type</div>
    <jnks-iot-toggle-select formControlName="advancedMode" class="flex-1">
      <jnks-iot-toggle-option [value]="false">
        {{ 'widgets.color.basic-mode' | translate }}
      </jnks-iot-toggle-option>
      <jnks-iot-toggle-option [value]="true">
        {{ 'widgets.color.advanced-mode' | translate}}
      </jnks-iot-toggle-option>
    </jnks-iot-toggle-select>
  </div>

  <ng-template #basicMode>
    <div class="flex flex-row items-center justify-start">
      <div *ngIf="panelTitle" class="jnks-iot-form-panel-title flex-1">{{ panelTitle }}</div>
    </div>
  </ng-template>

  <div class="jnks-iot-color-ranges" [ngSwitch]="colorRangeListFormGroup.get('advancedMode').value">
    <ng-template [ngSwitchCase]="false">
      <div class="jnks-iot-control-list jnks-iot-drop-list" cdkDropList cdkDropListOrientation="vertical"
           (cdkDropListDropped)="rangeDrop($event, 'range')">
        <div cdkDrag class="jnks-iot-draggable jnks-iot-advanced-range-drag"
             [formGroup]="rangeFormGroup"
             *ngFor="let rangeFormGroup of rangeListFormGroups; trackBy: trackByRange; let $index = index; last as isLast;"
             [class.pb-2]="!isLast">
          <div class="flex flex-1 flex-row items-center justify-start">
            <div class="jnks-iot-form-row range-container">
              <div class="jnks-iot-value-range-text" translate>widgets.color.from</div>
              <mat-form-field appearance="outline" class="center number flex-1" subscriptSizing="dynamic">
                <input matInput type="number" formControlName="from" placeholder="{{ 'widget-config.set' | translate }}">
              </mat-form-field>

              <div class="jnks-iot-value-range-text jnks-iot-value-range-text-to" translate>widgets.color.to</div>
              <mat-form-field appearance="outline" class="center number flex-1" subscriptSizing="dynamic">
                <input matInput type="number" formControlName="to" placeholder="{{ 'widget-config.set' | translate }}">
              </mat-form-field>

              <jnks-iot-color-input asBoxInput
                              formControlName="color">
              </jnks-iot-color-input>
            </div>
            <button type="button"
                    mat-icon-button
                    class="jnks-iot-box-button"
                    (click)="removeRange($index)"
                    matTooltip="{{ 'action.remove' | translate }}"
                    matTooltipPosition="above">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
          <button class="jnks-iot-box-button"
                  mat-icon-button
                  type="button"
                  cdkDragHandle
                  matTooltip="{{ 'action.drag' | translate }}"
                  matTooltipPosition="above">
            <mat-icon>drag_indicator</mat-icon>
          </button>
        </div>
      </div>
    </ng-template>
    <ng-template [ngSwitchCase]="true">

      <div class="jnks-iot-control-list jnks-iot-drop-list" cdkDropList cdkDropListOrientation="vertical"
           (cdkDropListDropped)="rangeDrop($event, 'rangeAdvanced')">
        <div cdkDrag class="jnks-iot-draggable jnks-iot-advanced-range-drag"
             *ngFor="let advancedRangeControl of advancedRangeControls; trackBy: trackByAdvancedRange;let $index = index; last as isLast;"
             [class.pb-2]="!isLast">
          <jnks-iot-advanced-range [formControl]="advancedRangeControl"
                             [aliasController]="aliasController"
                             [dataKeyCallbacks]="dataKeyCallbacks"
                             [datasource]="datasource"
                             (removeAdvancedRange)="removeAdvancedRange($index)">
          </jnks-iot-advanced-range>
          <button class="jnks-iot-box-button"
                  mat-icon-button
                  type="button"
                  cdkDragHandle
                  matTooltip="{{ 'action.drag' | translate }}"
                  matTooltipPosition="above">
            <mat-icon>drag_indicator</mat-icon>
          </button>
        </div>
      </div>

    </ng-template>

  </div>
  <div class="jnks-iot-add-color-range">
    <button mat-stroked-button
            (click)="addRange()">
      <mat-icon>add</mat-icon>
    </button>
  </div>
</ng-container>
