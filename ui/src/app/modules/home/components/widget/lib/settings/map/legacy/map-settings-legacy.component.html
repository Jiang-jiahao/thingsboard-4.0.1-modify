<section class="jnks-iot-widget-settings" [formGroup]="mapSettingsFormGroup">
  <jnks-iot-map-provider-settings
    [aliasController]="aliasController"
    formControlName="mapProviderSettings">
  </jnks-iot-map-provider-settings>
  <jnks-iot-common-map-settings
    [widget]="widget"
    [provider]="mapSettingsFormGroup.get('mapProviderSettings').value.provider"
    formControlName="commonMapSettings">
  </jnks-iot-common-map-settings>
  <jnks-iot-markers-settings
    [provider]="mapSettingsFormGroup.get('mapProviderSettings').value.provider"
    formControlName="markersSettings">
  </jnks-iot-markers-settings>
  <jnks-iot-polygon-settings
    [widget]="widget"
    formControlName="polygonSettings">
  </jnks-iot-polygon-settings>
  <jnks-iot-circle-settings
    [widget]="widget"
    formControlName="circleSettings">
  </jnks-iot-circle-settings>
  <jnks-iot-marker-clustering-settings
    *ngIf="!routeMap"
    [class.!hidden]="mapSettingsFormGroup.get('mapProviderSettings').value.provider === mapProvider.image"
    formControlName="markerClusteringSettings">
  </jnks-iot-marker-clustering-settings>
  <jnks-iot-route-map-settings
    *ngIf="routeMap"
    formControlName="routeMapSettings">
  </jnks-iot-route-map-settings>
  <jnks-iot-map-editor-settings
    [class.!hidden]="!displayEditorSettings()"
    formControlName="mapEditorSettings">
  </jnks-iot-map-editor-settings>
</section>
