<button type="button"
        mat-stroked-button
        class="jnks-iot-box-button"
        [disabled]="disabled"
        #matButton
        (click)="openColorSettingsPopup($event, matButton)">
  <jnks-iot-icon matButtonIcon *ngIf="modelValue?.type === DataLayerColorType.function; else colorPreview">mdi:function-variant</jnks-iot-icon>
</button>
<ng-template #colorPreview>
  <div class="jnks-iot-color-preview box" [class.disabled]="disabled">
    <div class="jnks-iot-color-result" [style]="colorStyle"></div>
  </div>
</ng-template>
