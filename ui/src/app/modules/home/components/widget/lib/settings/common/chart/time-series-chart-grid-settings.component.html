<ng-container [formGroup]="gridSettingsFormGroup">
  <div class="jnks-iot-form-panel stroked jnks-iot-slide-toggle">
    <mat-expansion-panel class="jnks-iot-settings" [(expanded)]="settingsExpanded"
                         [disabled]="!gridSettingsFormGroup.get('show').value">
      <mat-expansion-panel-header class="flex flex-row flex-wrap">
        <mat-panel-title>
          <mat-slide-toggle class="mat-slide flex items-stretch justify-center" formControlName="show" (click)="$event.stopPropagation()">
            {{ 'widgets.time-series-chart.grid.grid' | translate }}
          </mat-slide-toggle>
        </mat-panel-title>
      </mat-expansion-panel-header>
      <ng-template matExpansionPanelContent>
        <div class="jnks-iot-form-row space-between">
          <div>{{ 'widgets.time-series-chart.grid.background-color' | translate }}</div>
          <jnks-iot-color-input asBoxInput
                          colorClearButton
                          formControlName="backgroundColor">
          </jnks-iot-color-input>
        </div>
        <div class="jnks-iot-form-row space-between">
          <div>{{ 'widgets.time-series-chart.grid.border' | translate }}</div>
          <div class="flex flex-row items-center justify-start gap-2">
            <mat-form-field appearance="outline" class="number" subscriptSizing="dynamic">
              <input matInput formControlName="borderWidth" type="number" min="0" placeholder="{{ 'widget-config.set' | translate }}">
              <span matSuffix>px</span>
            </mat-form-field>
            <jnks-iot-color-input asBoxInput
                            colorClearButton
                            formControlName="borderColor">
            </jnks-iot-color-input>
          </div>
        </div>
      </ng-template>
    </mat-expansion-panel>
  </div>
</ng-container>
