<div class="jnks-iot-segmented-button-widget">
  <ng-container *ngTemplateOutlet="widgetTitlePanel"></ng-container>
  <div class="jnks-iot-segmented-button-container">
    <jnks-iot-widget-button-toggle
      class="jnks-iot-widget-button-toggle"
      [appearance]="appearance"
      [autoScale]="autoScale"
      [disabled]="disabled || (loading$ | async)"
      [disableEvents]="ctx.isEdit"
      [value]="value"
      [ctx]="ctx"
      (clicked)="onClick($event)">
    </jnks-iot-widget-button-toggle>
  </div>
  <mat-progress-bar class="jnks-iot-action-widget-progress" style="height: 4px;" color="accent" mode="indeterminate" *ngIf="loading$ | async"></mat-progress-bar>
</div>
