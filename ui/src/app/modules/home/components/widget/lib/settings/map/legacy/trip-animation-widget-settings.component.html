<section class="jnks-iot-widget-settings" [formGroup]="tripAnimationWidgetSettingsForm">
  <jnks-iot-map-provider-settings
    [ignoreImageMap]="true"
    [aliasController]="aliasController"
    formControlName="mapProviderSettings">
  </jnks-iot-map-provider-settings>
  <jnks-iot-trip-animation-common-settings
    [widget]="widget"
    formControlName="commonMapSettings">
  </jnks-iot-trip-animation-common-settings>
  <jnks-iot-trip-animation-marker-settings
    formControlName="markersSettings">
  </jnks-iot-trip-animation-marker-settings>
  <jnks-iot-trip-animation-path-settings
    formControlName="pathSettings">
  </jnks-iot-trip-animation-path-settings>
  <jnks-iot-trip-animation-point-settings
    formControlName="pointSettings">
  </jnks-iot-trip-animation-point-settings>
  <jnks-iot-polygon-settings
    [widget]="widget"
    formControlName="polygonSettings">
  </jnks-iot-polygon-settings>
  <jnks-iot-circle-settings
    [widget]="widget"
    formControlName="circleSettings">
  </jnks-iot-circle-settings>
</section>
