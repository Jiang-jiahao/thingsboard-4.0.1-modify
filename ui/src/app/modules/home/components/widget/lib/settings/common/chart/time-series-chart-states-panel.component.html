<div class="jnks-iot-form-panel jnks-iot-time-series-states-panel">
  <div class="jnks-iot-form-panel-title">{{ 'widgets.time-series-chart.state.states' | translate }}</div>
  <div class="jnks-iot-form-table">
    <div class="jnks-iot-form-table-header">
      <div class="jnks-iot-form-table-header-cell jnks-iot-state-label-header" translate>widgets.time-series-chart.state.label</div>
      <div class="jnks-iot-form-table-header-cell jnks-iot-state-value-header" translate>widgets.time-series-chart.state.ticks-value</div>
      <div class="jnks-iot-form-table-header-cell jnks-iot-state-source-header" translate>widgets.time-series-chart.state.source</div>
      <div class="jnks-iot-form-table-header-cell jnks-iot-state-source-value-header" translate>widgets.time-series-chart.state.value-range</div>
      <div class="jnks-iot-form-table-header-cell jnks-iot-actions-header"></div>
    </div>
    <div *ngIf="statesFormArray().controls.length; else noStates" class="jnks-iot-form-table-body">
      <div *ngFor="let stateControl of statesFormArray().controls; trackBy: trackByState; let $index = index; let $last = last">
        <jnks-iot-time-series-chart-state-row class="flex-1"
                                        [formControl]="stateControl"
                                        (stateRemoved)="removeState($index)">
        </jnks-iot-time-series-chart-state-row>
        <mat-divider *ngIf="!$last"></mat-divider>
      </div>
    </div>
  </div>
  <div>
    <button type="button" mat-stroked-button color="primary" (click)="addState()">
      {{ 'widgets.time-series-chart.state.add-state' | translate }}
    </button>
  </div>
</div>
<ng-template #noStates>
  <span class="jnks-iot-prompt flex items-center justify-center">{{ 'widgets.time-series-chart.state.no-states' | translate }}</span>
</ng-template>
