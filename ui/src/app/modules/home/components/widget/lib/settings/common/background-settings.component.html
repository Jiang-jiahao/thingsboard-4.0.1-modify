<button type="button"
        mat-stroked-button
        class="jnks-iot-box-button jnks-iot-background-settings"
        [disabled]="disabled"
        #matButton
        (click)="openBackgroundSettingsPopup($event, matButton)">
  <div class="jnks-iot-color-preview box" [class.disabled]="disabled">
    <div class="jnks-iot-color-result" [style]="backgroundStyle$ | async">
      <div class="jnks-iot-color-overlay" [style]="overlayStyle">
      </div>
    </div>
  </div>
</button>
