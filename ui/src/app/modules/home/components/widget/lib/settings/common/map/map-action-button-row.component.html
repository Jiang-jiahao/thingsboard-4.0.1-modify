<div [formGroup]="mapActionButton" class="jnks-iot-form-table-row">
  <mat-form-field class="jnks-iot-inline-field jnks-iot-label-field min-w-32" style="flex: 1 1 40%" appearance="outline" subscriptSizing="dynamic">
    <input matInput formControlName="label" placeholder="{{ 'widget-config.set' | translate }}">
    <mat-icon matSuffix
              matTooltipPosition="above"
              matTooltipClass="jnks-iot-error-tooltip"
              matTooltip="{{ 'widgets.maps.map-action.button-requires' | translate }}"
              *ngIf="mapActionButton.hasError('invalidButtonConfig')"
              class="jnks-iot-error">
      warning
    </mat-icon>
  </mat-form-field>
  <jnks-iot-material-icon-select formControlName="icon" asBoxInput iconClearButton [color]="this.mapActionButton.get('color').value"></jnks-iot-material-icon-select>
  <jnks-iot-color-input formControlName="color" asBoxInput required></jnks-iot-color-input>
  <jnks-iot-widget-action-settings class="min-w-32" style="flex: 1 1 60%"
                             formControlName="action"
                             panelTitle="{{ 'widgets.maps.map-action.map-action-button' | translate }}"
                             [widgetType]="widgetType.latest"
                             [additionalWidgetActionTypes]="additionalWidgetActionTypes">
  </jnks-iot-widget-action-settings>
  <div class="jnks-iot-form-table-row-cell-buttons w-10 min-w-10">
    <button type="button"
            mat-icon-button
            (click)="buttonRemoved.emit()"
            matTooltip="{{ 'widgets.maps.map-action.remove-action-button' | translate }}"
            matTooltipPosition="above">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
</div>
