<div [formGroup]="widgetSettingsFormGroup">
  <ng-container #definedSettingsContent></ng-container>
  <div class="jnks-iot-settings-directive-error" *ngIf="definedDirectiveError">{{definedDirectiveError}}</div>
  <jnks-iot-dynamic-form *ngIf="useDynamicForm()"
    [properties]="settingsForm"
    formControlName="settings">
  </jnks-iot-dynamic-form>
</div>
