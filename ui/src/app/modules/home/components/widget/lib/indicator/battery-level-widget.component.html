<div class="jnks-iot-battery-level-panel" [style.padding]="padding" [style]="backgroundStyle$ | async"
     [class.jnks-iot-battery-level-pointer]="hasCardClickAction" (click)="cardClick($event)">
  <div class="jnks-iot-battery-level-overlay" [style]="overlayStyle"></div>
  <ng-container *ngTemplateOutlet="widgetTitlePanel"></ng-container>
  <div #batteryLevelContent class="jnks-iot-battery-level-content" [class]="layoutClass">
    <div #batteryLevelBox class="jnks-iot-battery-level-box">
      <div #batteryLevelRectangle class="jnks-iot-battery-level-rectangle" [class]="layoutClass" [class.solid]="solid" [class.divided]="!solid">
        <div class="jnks-iot-battery-level-shape" [style.background]="batteryShapeColor.color"></div>
        <div class="jnks-iot-battery-level-container" [style.gap]="dividedGap">
          <div *ngIf="solid; else dividedIndicator" class="jnks-iot-battery-level-indicator-box solid"
               [style.background-image]="'linear-gradient(0deg, ' + batteryLevelColor.color + ' 0% 100%)'"
               [style.background-size]="vertical ? '100% ' + (batteryFillValue + 1) + '%' : (batteryFillValue + 1) + '% 100%'">
          </div>
        </div>
      </div>
    </div>
    <div *ngIf="showValue" #batteryLevelValueBox class="jnks-iot-battery-level-value-box">
      <div #batteryLevelValue class="jnks-iot-battery-level-value" [style]="valueStyle" [style.color]="valueColor.color">{{ valueText }}</div>
    </div>
  </div>
</div>
<ng-template #dividedIndicator>
  <div *ngFor="let section of batterySections; trackBy: trackBySection" class="jnks-iot-battery-level-indicator-box divided"
       [style.background]="batteryLevelColor.color"
       [style.border-radius]="dividedBorderRadius"
       [style.opacity]="section ? '1': '0'"></div>
</ng-template>
