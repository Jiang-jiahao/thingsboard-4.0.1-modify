<div class="jnks-iot-slider-panel" [class.no-pointer-events]="ctx.isEdit" [style.padding]="padding" [style]="backgroundStyle$ | async">
  <div class="jnks-iot-slider-overlay" [style]="overlayStyle"></div>
  <div *ngIf="showWidgetTitlePanel" class="jnks-iot-slider-title-panel">
    <ng-container *ngTemplateOutlet="widgetTitlePanel"></ng-container>
  </div>
  <div #sliderContent class="jnks-iot-slider-content">
    <div #sliderValueContainer class="jnks-iot-slider-value-container" *ngIf="showValue" >
      <div #sliderValue class="jnks-iot-slider-value" [style]="valueStyle">{{ valueText }}</div>
    </div>
    <div class="jnks-iot-slider-container" [class.jnks-iot-min-height]="!showValue">
      <div #leftSliderIconContainer *ngIf="showLeftRightIcon" >
        <jnks-iot-icon #leftSliderIcon [style]="leftIconStyle"
                 [style.color]="(disabled || (loading$ | async)) ? settings.mainColorDisabled : settings.leftIconColor">{{ leftIcon }}</jnks-iot-icon>
      </div>
      <div class="jnks-iot-slider-column">
        <mat-slider class="jnks-iot-slider"
                    [disabled]="disabled || (loading$ | async)"
                    [displayWith]="sliderValueText"
                    [showTickMarks]="settings.showTickMarks"
                    [step]="sliderStep"
                    [min]="settings.tickMin"
                    [max]="settings.tickMax"
                    discrete>
          <input matSliderThumb [(ngModel)]="value" (valueChange)="onSliderChange()">
        </mat-slider>
        <div *ngIf="showTicks" class="jnks-iot-slider-ticks" [style]="ticksStyle">
          <div #sliderTickMinContainer>
            <div #sliderTickMin>{{ settings.tickMin }}</div>
          </div>
          <div #sliderTickMaxContainer>
            <div #sliderTickMax>{{ settings.tickMax }}</div>
          </div>
        </div>
      </div>
      <div #rightSliderIconContainer *ngIf="showLeftRightIcon" >
        <jnks-iot-icon #rightSliderIcon [style]="rightIconStyle"
                 [style.color]="(disabled || (loading$ | async)) ? settings.mainColorDisabled : settings.rightIconColor">{{ rightIcon }}</jnks-iot-icon>
      </div>
    </div>
  </div>
  <mat-progress-bar class="jnks-iot-action-widget-progress" style="height: 4px;" color="accent" mode="indeterminate" *ngIf="loading$ | async"></mat-progress-bar>
</div>
