<div class="jnks-iot-data-layer-color-settings-panel" [formGroup]="colorSettingsFormGroup">
  <div class="jnks-iot-data-layer-color-settings-title" translate>widgets.maps.data-layer.color-settings</div>
  <div class="flex flex-row">
    <jnks-iot-toggle-select formControlName="type" class="flex-1">
      <jnks-iot-toggle-option [value]="DataLayerColorType.constant">
        {{ 'widgets.maps.data-layer.color-type-constant' | translate }}
      </jnks-iot-toggle-option>
      <jnks-iot-toggle-option [value]="DataLayerColorType.range">
        {{ 'widgets.maps.data-layer.color-type-range' | translate }}
      </jnks-iot-toggle-option>
      <jnks-iot-toggle-option [value]="DataLayerColorType.function">
        {{ 'widgets.maps.data-layer.color-type-function' | translate }}
      </jnks-iot-toggle-option>
    </jnks-iot-toggle-select>
  </div>
  <div class="jnks-iot-form-row space-between">
    <div translate>widgets.maps.data-layer.color</div>
    <jnks-iot-color-input asBoxInput
                    formControlName="color">
    </jnks-iot-color-input>
  </div>
  <div class="jnks-iot-data-layer-color-settings-panel-body" [class.!hidden]="colorSettingsFormGroup.get('type').value !== DataLayerColorType.constant">
  </div>
  <div class="jnks-iot-data-layer-color-settings-panel-body" [class.!hidden]="colorSettingsFormGroup.get('type').value !== DataLayerColorType.range">
    <jnks-iot-data-key-input style="padding-top: 6px;"
      inlineField="false"
      appearance="outline"
      subscriptSizing="fixed"
      label="{{ 'widgets.maps.data-layer.color-range-source-key' | translate }}"
      required
      requiredText="{{ 'widgets.maps.data-layer.color-range-source-key-required' }}"
      [datasourceType]="dsType"
      [entityAliasId]="dsEntityAliasId"
      [deviceId]="dsDeviceId"
      [aliasController]="context.aliasController"
      [widgetType]="widgetType.latest"
      [dataKeyType]="context.functionsOnly ? DataKeyType.function : null"
      [dataKeyTypes]="[DataKeyType.attribute, DataKeyType.timeseries]"
      [callbacks]="context.callbacks"
      [generateKey]="context.generateDataKey"
      (keyEdit)="editRangeKey()"
      formControlName="rangeKey">
    </jnks-iot-data-key-input>
    <div class="jnks-iot-form-panel stroked">
      <div translate>widgets.maps.data-layer.color-range</div>
      <jnks-iot-color-range-list class="jnks-iot-color-ranges-panel"
                           simpleRange
                           formControlName="range"
                           [popover]="popover">
      </jnks-iot-color-range-list>
    </div>
  </div>
  <div class="jnks-iot-data-layer-color-settings-panel-body" [class.!hidden]="colorSettingsFormGroup.get('type').value !== DataLayerColorType.function">
    <ng-container *ngTemplateOutlet="function"></ng-container>
  </div>
  <div class="jnks-iot-data-layer-color-settings-panel-buttons">
    <span class="flex-1"></span>
    <button mat-button
            color="primary"
            type="button"
            (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button
            color="primary"
            type="button"
            (click)="applyColorSettings()"
            [disabled]="colorSettingsFormGroup.invalid || !colorSettingsFormGroup.dirty">
      {{ 'action.apply' | translate }}
    </button>
  </div>
</div>

<ng-template #function>
  <div class="jnks-iot-form-panel no-padding no-border" [formGroup]="colorSettingsFormGroup">
    <jnks-iot-js-func formControlName="colorFunction"
                withModules
                [functionArgs]="['data', 'dsData']"
                [globalVariables]="functionScopeVariables"
                functionTitle="{{ 'widgets.maps.data-layer.color-function' | translate }}"
                [helpId]="helpId"
                [helpPopupStyle]="{width: '900px'}">
    </jnks-iot-js-func>
  </div>
</ng-template>
