<div class="jnks-iot-marker-shapes-panel">
  <div class="jnks-iot-marker-shapes-title" translate>widgets.maps.data-layer.marker.marker-shapes</div>
  <div class="flex flex-row flex-wrap gap-3">
    <ng-container *ngFor="let shapeInfo of shapes">
      <button *ngIf="shapeInfo.shape === shape"
              class="jnks-iot-select-shape-button"
              mat-raised-button
              (click)="selectShape(shapeInfo.shape)"
              type="button">
        <img matButtonIcon class="jnks-iot-marker-shape" [src]="shapeInfo.url$ | async"/>
      </button>
      <button *ngIf="shapeInfo.shape !== shape"
              class="jnks-iot-select-shape-button"
              mat-button
              (click)="selectShape(shapeInfo.shape)"
              type="button">
        <img matButtonIcon class="jnks-iot-marker-shape" [src]="shapeInfo.url$ | async"/>
      </button>
    </ng-container>
  </div>
</div>
