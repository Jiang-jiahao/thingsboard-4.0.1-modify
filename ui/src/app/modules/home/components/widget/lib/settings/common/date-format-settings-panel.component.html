<div class="jnks-iot-date-format-settings-panel">
  <div class="jnks-iot-date-format-settings-title" translate>date.custom-date</div>
  <div class="jnks-iot-form-row no-border no-padding">
    <div class="fixed-title-width" translate>date.format</div>
    <mat-form-field class="jnks-iot-date-format-input flex-1" required appearance="outline" subscriptSizing="dynamic">
      <input matInput [formControl]="dateFormatFormControl" placeholder="{{ 'widget-config.set' | translate }}">
    </mat-form-field>
  </div>
  <mat-divider></mat-divider>
  <div class="jnks-iot-form-row no-border no-padding date-format-preview">
    <div class="fixed-title-width" translate>date.preview</div>
    <div class="preview-text flex-1">{{ previewText }}</div>
  </div>
  <div class="jnks-iot-date-format-settings-panel-buttons">
    <button mat-button
            color="primary"
            type="button"
            (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button
            color="primary"
            type="button"
            (click)="applyDateFormat()"
            [disabled]="dateFormatFormControl.invalid || !dateFormatFormControl.dirty">
      {{ 'action.apply' | translate }}
    </button>
  </div>
</div>
