<div class="jnks-iot-range-chart-panel" [style.padding]="padding" [style]="backgroundStyle$ | async">
  <div class="jnks-iot-range-chart-overlay" [style]="overlayStyle"></div>
  @if (widgetComponent.dashboardWidget.showWidgetTitlePanel) {
    <div class="jnks-iot-widget-title-row flex justify-between">
      <ng-container *ngTemplateOutlet="widgetComponent.widgetTitlePanel"></ng-container>
      <ng-container *ngTemplateOutlet="widgetComponent.widgetHeaderActionsPanel"></ng-container>
    </div>
  } @else {
    <ng-container class="jnks-iot-widget-actions-absolute" *ngTemplateOutlet="widgetComponent.widgetHeaderActionsPanel; context: {absolute: true}"></ng-container>
  }
  <div class="jnks-iot-range-chart-content" [class]="legendClass">
    <div #chartShape class="jnks-iot-range-chart-shape">
    </div>
    <div *ngIf="showLegend" class="jnks-iot-range-chart-legend">
      <div class="jnks-iot-range-chart-legend-item" *ngFor="let rangeItem of visibleRangeItems"
           (click)="toggleRangeItem(rangeItem)">
        <div class="jnks-iot-range-chart-legend-item-label">
          <div class="jnks-iot-range-chart-legend-item-label-circle" [style]="{background: rangeItem.enabled ? rangeItem.color : null}"></div>
          <div [style]="rangeItem.enabled ? legendLabelStyle : disabledLegendLabelStyle">{{ rangeItem.label }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
