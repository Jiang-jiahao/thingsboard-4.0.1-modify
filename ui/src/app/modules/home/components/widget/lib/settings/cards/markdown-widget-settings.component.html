<section class="jnks-iot-widget-settings flex flex-col" [formGroup]="markdownWidgetSettingsForm">
  <mat-slide-toggle class="mat-slide" formControlName="useMarkdownTextFunction">
    {{ 'widgets.markdown.use-markdown-text-function' | translate }}
  </mat-slide-toggle>
  <jnks-iot-js-func [class.!hidden]="!markdownWidgetSettingsForm.get('useMarkdownTextFunction').value"
              formControlName="markdownTextFunction"
              withModules
              [globalVariables]="functionScopeVariables"
              [functionArgs]="['data', 'ctx']"
              functionTitle="{{ 'widgets.markdown.markdown-text-function' | translate }}"
              helpId="widget/lib/markdown/markdown_text_fn">
  </jnks-iot-js-func>
  <jnks-iot-markdown-editor [class.!hidden]="markdownWidgetSettingsForm.get('useMarkdownTextFunction').value"
                      formControlName="markdownTextPattern"
                      label="{{ 'widgets.markdown.markdown-text-pattern' | translate }}"
                      helpId="widget/editor/widget_js_markdown_pattern">
  </jnks-iot-markdown-editor>
  <mat-slide-toggle class="mat-slide" formControlName="applyDefaultMarkdownStyle">
    {{ 'widgets.markdown.apply-default-markdown-style' | translate }}
  </mat-slide-toggle>
  <jnks-iot-css formControlName="markdownCss"
          label="{{ 'widgets.markdown.markdown-css' | translate }}">
  </jnks-iot-css>
</section>
