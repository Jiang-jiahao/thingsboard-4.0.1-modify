<div class="jnks-iot-card-content flex flex-col gap-2">
  <div class="jnks-iot-card-header">
    <div class="jnks-iot-title">{{ 'widgets.quick-links.title' | translate }}</div>
    <button class="jnks-iot-title-icon"
            matTooltip="{{ 'action.edit' | translate }}"
            matTooltipPosition="above"
            mat-icon-button
            (click)="edit()">
      <jnks-iot-icon>edit</jnks-iot-icon>
    </button>
  </div>
  <mat-grid-list class="jnks-iot-links-list flex-1" [cols]="columns" [rowHeight]="rowHeight" [gutterSize]="gutterSize">
    <mat-grid-tile class="jnks-iot-links-tile" *ngFor="let quickLink of menuLinks$() | async">
      <a class="jnks-iot-link-button flex-1"
         [routerLink]="quickLink.path">
        <div class="jnks-iot-link-container">
          <div class="jnks-iot-link-icon-container">
            <jnks-iot-icon color="primary">{{ quickLink.icon }}</jnks-iot-icon>
          </div>
          <div class="jnks-iot-link-text">{{ (quickLink.fullName || quickLink.name) | translate }}</div>
        </div>
      </a>
    </mat-grid-tile>
    <mat-grid-tile class="jnks-iot-links-tile">
      <div class="jnks-iot-add-link-button flex-1"
           matTooltip="{{ 'widgets.quick-links.add-link' | translate }}"
           matTooltipPosition="above"
           (click)="addLink()">
        <jnks-iot-icon class="jnks-iot-add-icon">add</jnks-iot-icon>
      </div>
    </mat-grid-tile>
  </mat-grid-list>
</div>
