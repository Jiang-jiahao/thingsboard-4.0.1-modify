<form class="jnks-iot-add-doc-link-dialog" [formGroup]="addDocLinkFormGroup">
  <mat-toolbar style="background: transparent;">
    <h2 translate>widgets.documentation.add-link-title</h2>
    <span class="flex-1"></span>
    <button mat-icon-button
            (click)="cancel()"
            type="button">
      <jnks-iot-icon>close</jnks-iot-icon>
    </button>
  </mat-toolbar>
  <div mat-dialog-content>
    <jnks-iot-doc-link formControlName="docLink" [addOnly]="true"
                      (docLinkAdded)="add($event)">
    </jnks-iot-doc-link>
  </div>
</form>
