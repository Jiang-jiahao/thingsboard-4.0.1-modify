<div class="flex flex-row" *ngIf="addMode || editMode; else quickLinkTemplate">
  <div class="jnks-iot-edit-link flex flex-1 flex-col" [class.edit-mode]="editMode" [formGroup]="editQuickLinkFormGroup">
    <mat-form-field class="mat-block flex-1">
      <mat-label translate>widgets.quick-links.quick-link</mat-label>
      <input matInput type="text"
             #linkInput
             formControlName="link"
             (focusin)="onFocus()"
             required
             [matAutocomplete]="linkAutocomplete">
      <jnks-iot-icon matPrefix *ngIf="quickLink" color="primary">{{ quickLink.icon }}</jnks-iot-icon>
      <button *ngIf="editQuickLinkFormGroup.get('link').value && !disabled"
              type="button"
              matSuffix mat-icon-button aria-label="Clear"
              (click)="clear()">
        <jnks-iot-icon>close</jnks-iot-icon>
      </button>
      <mat-autocomplete
        class="jnks-iot-autocomplete jnks-iot-quick-links"
        #linkAutocomplete="matAutocomplete"
        [displayWith]="displayLinkFn">
        <mat-option *ngFor="let link of filteredLinks | async" [value]="link">
          <jnks-iot-icon>{{ link.icon }}</jnks-iot-icon>
          <span [innerHTML]="link.name | highlight:searchText"></span>
        </mat-option>
        <mat-option *ngIf="!(filteredLinks | async)?.length" [value]="null">
          <span>
              {{ translate.get('widgets.quick-links.no-links-matching', {name: searchText}) | async }}
          </span>
        </mat-option>
      </mat-autocomplete>
      <mat-error *ngIf="editQuickLinkFormGroup.get('link').hasError('required')">
        {{ 'widgets.quick-links.quick-link-required' | translate }}
      </mat-error>
    </mat-form-field>
    <div *ngIf="addMode" class="flex flex-row items-stretch justify-end gap-2">
      <button *ngIf="!addOnly" mat-button color="primary" (click)="cancelAdd()">{{ 'action.cancel' | translate }}</button>
      <button mat-raised-button color="primary" (click)="add()">{{ 'action.add' | translate }}</button>
    </div>
  </div>
  <div *ngIf="editMode" class="jnks-iot-edit-buttons flex flex-row">
    <button mat-icon-button (click)="apply()"><jnks-iot-icon>check</jnks-iot-icon></button>
    <button mat-icon-button (click)="cancelEdit()"><jnks-iot-icon>close</jnks-iot-icon></button>
  </div>
</div>
<ng-template #quickLinkTemplate>
  <div class="flex flex-row">
    <div class="jnks-iot-link flex-1">
      <div class="jnks-iot-link-container">
        <div class="jnks-iot-link-icon-container">
          <jnks-iot-icon color="primary">{{ quickLink?.icon }}</jnks-iot-icon>
        </div>
        <div class="jnks-iot-link-text">{{ displayLinkFn(quickLink) }}</div>
      </div>
    </div>
    <div class="jnks-iot-edit-buttons flex flex-row items-center justify-start">
      <button mat-icon-button
              matTooltip="{{ 'action.edit' | translate }}"
              matTooltipPosition="above"
              (click)="switchToEditMode()">
        <jnks-iot-icon>edit</jnks-iot-icon>
      </button>
      <button mat-icon-button
              matTooltip="{{ 'action.delete' | translate }}"
              matTooltipPosition="above"
              (click)="delete()">
        <jnks-iot-icon>delete</jnks-iot-icon>
      </button>
    </div>
  </div>
</ng-template>
