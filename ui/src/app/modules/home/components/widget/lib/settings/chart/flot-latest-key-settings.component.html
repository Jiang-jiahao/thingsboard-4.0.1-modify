<ng-container [formGroup]="flotLatestKeySettingsForm">
  <div class="jnks-iot-form-panel jnks-iot-slide-toggle">
    <div class="jnks-iot-form-panel-title" translate>widgets.chart.threshold-settings</div>
    <mat-expansion-panel class="jnks-iot-settings" [expanded]="flotLatestKeySettingsForm.get('useAsThreshold').value"
                         [disabled]="!flotLatestKeySettingsForm.get('useAsThreshold').value">
      <mat-expansion-panel-header class="flex flex-row flex-wrap">
        <mat-panel-title>
          <mat-slide-toggle class="mat-slide flex items-stretch justify-center" formControlName="useAsThreshold" (click)="$event.stopPropagation()">
            {{ 'widgets.chart.use-as-threshold' | translate }}
          </mat-slide-toggle>
        </mat-panel-title>
      </mat-expansion-panel-header>
      <ng-template matExpansionPanelContent>
        <div class="jnks-iot-form-row space-between">
          <div translate>widgets.chart.threshold-line-width</div>
          <mat-form-field appearance="outline" class="number" subscriptSizing="dynamic">
            <input matInput formControlName="thresholdLineWidth" type="number" min="0" placeholder="{{ 'widget-config.set' | translate }}">
            <span matSuffix>px</span>
          </mat-form-field>
        </div>
        <div class="jnks-iot-form-row space-between">
          <div>{{ 'widgets.chart.threshold-color' | translate }}</div>
          <jnks-iot-color-input asBoxInput
                          formControlName="thresholdColor">
          </jnks-iot-color-input>
        </div>
      </ng-template>
    </mat-expansion-panel>
  </div>
</ng-container>
