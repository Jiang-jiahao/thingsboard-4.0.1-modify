<div #labelCardPanel class="jnks-iot-label-value-card-panel" [style.padding]="padding" [style]="backgroundStyle$ | async"
     [class.jnks-iot-label-value-card-pointer]="hasCardClickAction" (click)="cardClick($event)">
  <div class="jnks-iot-label-value-card-overlay" [style]="overlayStyle"></div>
  <div class="jnks-iot-label-value-card-title-panel">
    <ng-container *ngTemplateOutlet="widgetTitlePanel"></ng-container>
  </div>
  <div #labelCardContent class="jnks-iot-label-value-card-content">
    <div #labelCardRow class="jnks-iot-label-value-card-row">
      <div *ngIf="showIcon || showLabel" class="jnks-iot-label-value-card-icon-label">
        <jnks-iot-icon *ngIf="showIcon" [style]="iconStyle" [style.color]="iconColor.color">{{ icon }}</jnks-iot-icon>
        <div *ngIf="showLabel" [class.jnks-iot-label-value-card-label]="!settings.autoScale" [style]="labelStyle" [style.color]="labelColor.color"
             [innerHTML]="label$ | async | safe:'html'"></div>
      </div>
      <div class="jnks-iot-label-value-card-value" [style]="valueStyle" [style.color]="valueColor.color">{{ valueText }}</div>
    </div>
  </div>
</div>
