<section class="jnks-iot-widget-settings flex flex-col" [formGroup]="roundSwitchWidgetSettingsForm">
  <fieldset class="fields-group">
    <legend class="group-title" translate>widgets.rpc.common-settings</legend>
    <mat-form-field class="mat-block flex-1">
      <mat-label translate>widgets.rpc.switch-title</mat-label>
      <input matInput formControlName="title">
    </mat-form-field>
  </fieldset>
  <jnks-iot-switch-rpc-settings [aliasController]="aliasController"
                          [targetDevice]="targetDevice"
                          formControlName="switchRpcSettings">
  </jnks-iot-switch-rpc-settings>
</section>
