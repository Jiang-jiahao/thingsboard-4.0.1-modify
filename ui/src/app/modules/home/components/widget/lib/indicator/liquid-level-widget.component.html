<div class="jnks-iot-liquid-level-panel" [style.padding]="padding" [style]="backgroundStyle$ | async"
     [class.jnks-iot-liquid-level-pointer]="hasCardClickAction" (click)="cardClick($event)">
  <div class="jnks-iot-liquid-level-overlay" [style]="overlayStyle"></div>
  <ng-container *ngTemplateOutlet="widgetTitlePanel"></ng-container>
  <div #liquidLevelContent class="jnks-iot-liquid-level-content"></div>
  <div *ngIf="errorsMsg.length" class="jnks-iot-liquid-level-error">
    <div class="jnks-iot-liquid-level-error-container">
      <div *ngFor="let error of errorsMsg">
        {{ error }}
      </div>
    </div>
  </div>
</div>
