<div class="flex flex-row" *ngIf="addMode || editMode; else docLinkTemplate">
  <div class="jnks-iot-edit-link flex flex-1 flex-col" [class.edit-mode]="editMode" [formGroup]="editDocLinkFormGroup">
    <jnks-iot-material-icon-select required formControlName="icon"></jnks-iot-material-icon-select>
    <mat-form-field class="mat-block flex-1">
      <mat-label translate>widgets.documentation.name</mat-label>
      <input required matInput formControlName="name">
      <mat-error *ngIf="editDocLinkFormGroup.get('name').hasError('required')">
        {{ 'widgets.documentation.name-required' | translate }}
      </mat-error>
    </mat-form-field>
    <mat-form-field class="mat-block flex-1">
      <mat-label translate>widgets.documentation.link</mat-label>
      <input required matInput formControlName="link">
      <mat-error *ngIf="editDocLinkFormGroup.get('link').hasError('required')">
        {{ 'widgets.documentation.link-required' | translate }}
      </mat-error>
    </mat-form-field>
    <div *ngIf="addMode" class="flex flex-row items-stretch justify-end gap-2">
      <button *ngIf="!addOnly" mat-button color="primary" (click)="cancelAdd()">{{ 'action.cancel' | translate }}</button>
      <button mat-raised-button color="primary" (click)="add()">{{ 'action.add' | translate }}</button>
    </div>
  </div>
  <div *ngIf="editMode" class="jnks-iot-edit-buttons flex flex-row">
    <button mat-icon-button (click)="apply()"><jnks-iot-icon>check</jnks-iot-icon></button>
    <button mat-icon-button (click)="cancelEdit()"><jnks-iot-icon>close</jnks-iot-icon></button>
  </div>
</div>
<ng-template #docLinkTemplate>
  <div class="flex flex-row">
    <div class="jnks-iot-link flex-1">
      <div class="jnks-iot-link-container">
        <div class="jnks-iot-link-icon-container">
          <jnks-iot-icon color="primary">{{ docLink.icon }}</jnks-iot-icon>
        </div>
        <div class="jnks-iot-link-text">{{ docLink.name | customTranslate }}</div>
      </div>
    </div>
    <div class="jnks-iot-edit-buttons flex flex-row items-center justify-start">
      <button mat-icon-button
              matTooltip="{{ 'action.edit' | translate }}"
              matTooltipPosition="above"
              (click)="switchToEditMode()">
        <jnks-iot-icon>edit</jnks-iot-icon>
      </button>
      <button mat-icon-button
              matTooltip="{{ 'action.delete' | translate }}"
              matTooltipPosition="above"
              (click)="delete()">
        <jnks-iot-icon>delete</jnks-iot-icon>
      </button>
    </div>
  </div>
</ng-template>
