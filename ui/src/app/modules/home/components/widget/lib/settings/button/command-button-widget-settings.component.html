<ng-container [formGroup]="commandButtonWidgetSettingsForm">
  <div class="jnks-iot-form-panel">
    <div class="jnks-iot-form-panel-title" translate>widgets.command-button.behavior</div>
    <div class="jnks-iot-form-row space-between">
      <div class="fixed-title-width" jnks-iot-hint-tooltip-icon="{{'widgets.command-button.on-click-hint' | translate}}" translate>widgets.command-button.on-click</div>
      <jnks-iot-set-value-action-settings class="flex-1"
                                    panelTitle="{{ 'widgets.command-button.on-click' | translate }}"
                                    [aliasController]="aliasController"
                                    [targetDevice]="targetDevice"
                                    [widgetType]="widgetType"
                                    formControlName="onClickState"></jnks-iot-set-value-action-settings>
    </div>
    <div class="jnks-iot-form-row">
      <div class="fixed-title-width" jnks-iot-hint-tooltip-icon="{{'widgets.button-state.disabled-state-hint' | translate}}" translate>widgets.button-state.disabled-state</div>
      <jnks-iot-get-value-action-settings class="flex-1"
                                    panelTitle="{{ 'widgets.button-state.disabled-state' | translate }}"
                                    [valueType]="valueType.BOOLEAN"
                                    stateLabel="{{ 'widgets.button-state.disabled' | translate }}"
                                    [aliasController]="aliasController"
                                    [targetDevice]="targetDevice"
                                    [widgetType]="widgetType"
                                    formControlName="disabledState"></jnks-iot-get-value-action-settings>
    </div>
  </div>
  <div class="jnks-iot-form-panel">
    <div class="jnks-iot-form-panel-title" translate>widget-config.appearance</div>
    <jnks-iot-widget-button-appearance
      [borderRadius]="borderRadius"
      formControlName="appearance">
    </jnks-iot-widget-button-appearance>
  </div>
</ng-container>
