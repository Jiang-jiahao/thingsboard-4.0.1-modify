<ng-container [formGroup]="countWidgetConfigForm">
  <jnks-iot-image-cards-select rowHeight="3:1"
                         [cols]="{columns: 2,
                                    breakpoints: {
                                      'lt-md': 1
                                    }}"
                         label="{{ 'widgets.count.layout' | translate }}" formControlName="layout">
    <jnks-iot-image-cards-select-option *ngFor="let layout of countCardLayouts"
                                  [value]="layout"
                                  [image]="countCardLayoutImageMap.get(layout)">
      {{ countCardLayoutTranslationMap.get(layout) | translate }}
    </jnks-iot-image-cards-select-option>
  </jnks-iot-image-cards-select>
  <div class="jnks-iot-form-row">
    <mat-slide-toggle class="mat-slide" formControlName="autoScale">
      {{ 'widgets.count.auto-scale' | translate }}
    </mat-slide-toggle>
  </div>
  <div class="jnks-iot-form-row column-xs">
    <mat-slide-toggle class="mat-slide fixed-title-width" formControlName="showLabel">
      {{ 'widgets.count.label' | translate }}
    </mat-slide-toggle>
    <div class="flex flex-1 flex-row items-center justify-start gap-2">
      <mat-form-field class="flex" appearance="outline" subscriptSizing="dynamic">
        <input matInput formControlName="label" placeholder="{{ 'widget-config.set' | translate }}">
      </mat-form-field>
      <jnks-iot-font-settings formControlName="labelFont"
                        [previewText]="countWidgetConfigForm.get('label').value">
      </jnks-iot-font-settings>
      <jnks-iot-color-settings formControlName="labelColor" settingsKey="{{'widgets.count.label' | translate }}">
      </jnks-iot-color-settings>
    </div>
  </div>
  <div class="jnks-iot-form-row column-xs">
    <mat-slide-toggle class="mat-slide fixed-title-width" formControlName="showIcon">
      {{ 'widgets.count.icon' | translate }}
    </mat-slide-toggle>
    <div class="flex flex-1 flex-row items-center justify-start gap-2">
      <mat-form-field appearance="outline" class="number flex" subscriptSizing="dynamic">
        <input matInput type="number" min="0" formControlName="iconSize" placeholder="{{ 'widget-config.set' | translate }}">
      </mat-form-field>
      <jnks-iot-css-unit-select class="flex-1" formControlName="iconSizeUnit"></jnks-iot-css-unit-select>
      <jnks-iot-material-icon-select asBoxInput
                               iconClearButton
                               [color]="countWidgetConfigForm.get('iconColor').value?.color"
                               [backgroundColor]="countWidgetConfigForm.get('iconBackgroundColor').enabled
                                                          ? countWidgetConfigForm.get('iconBackgroundColor').value?.color
                                                          : ''"
                               formControlName="icon">
      </jnks-iot-material-icon-select>
      <jnks-iot-color-settings formControlName="iconColor" settingsKey="{{'widgets.count.icon' | translate }}">
      </jnks-iot-color-settings>
    </div>
  </div>
  <div class="jnks-iot-form-row column-xs">
    <mat-slide-toggle class="mat-slide fixed-title-width" formControlName="showIconBackground">
      {{ 'widgets.count.icon-background' | translate }}
    </mat-slide-toggle>
    <div class="flex flex-1 flex-row items-center justify-start gap-2">
      <mat-form-field appearance="outline" class="number flex" subscriptSizing="dynamic">
        <input matInput type="number" min="0" formControlName="iconBackgroundSize" placeholder="{{ 'widget-config.set' | translate }}">
      </mat-form-field>
      <jnks-iot-css-unit-select class="flex-1" formControlName="iconBackgroundSizeUnit"></jnks-iot-css-unit-select>
      <jnks-iot-color-settings formControlName="iconBackgroundColor" settingsKey="{{'widgets.count.icon-background' | translate }}">
      </jnks-iot-color-settings>
    </div>
  </div>
  <div class="jnks-iot-form-row space-between">
    <div translate>widgets.count.value</div>
    <div class="flex flex-row items-center justify-start gap-2">
      <jnks-iot-font-settings formControlName="valueFont"
                        previewText="10">
      </jnks-iot-font-settings>
      <jnks-iot-color-settings formControlName="valueColor" settingsKey="{{'widgets.count.value' | translate }}">
      </jnks-iot-color-settings>
    </div>
  </div>
  <div class="jnks-iot-form-row column-xs">
    <mat-slide-toggle class="mat-slide fixed-title-width" formControlName="showChevron">
      {{ 'widgets.count.chevron' | translate }}
    </mat-slide-toggle>
    <div class="flex flex-1 flex-row items-center justify-start gap-2">
      <mat-form-field appearance="outline" class="number flex" subscriptSizing="dynamic">
        <input matInput type="number" min="0" formControlName="chevronSize" placeholder="{{ 'widget-config.set' | translate }}">
      </mat-form-field>
      <jnks-iot-css-unit-select class="flex-1" formControlName="chevronSizeUnit"></jnks-iot-css-unit-select>
      <jnks-iot-color-input asBoxInput
                      colorClearButton
                      formControlName="chevronColor">
      </jnks-iot-color-input>
    </div>
  </div>
</ng-container>
