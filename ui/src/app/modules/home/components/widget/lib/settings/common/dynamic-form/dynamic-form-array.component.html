<div class="jnks-iot-dynamic-form-array jnks-iot-form-panel stroked" [class.no-padding-right]="!disabled || !propertiesFormArray().controls.length">
  <mat-expansion-panel class="jnks-iot-settings" expanded>
    <mat-expansion-panel-header class="flex flex-row flex-wrap">
      <mat-panel-title>
        <div class="jnks-iot-form-panel-title">{{ title }}</div>
      </mat-panel-title>
    </mat-expansion-panel-header>
    <ng-template matExpansionPanelContent>
      <div *ngIf="propertiesFormArray().controls.length; else noProperties" class="jnks-iot-dynamic-form-array-body jnks-iot-drop-list"
           cdkDropList cdkDropListOrientation="vertical"
           [cdkDropListDisabled]="!dragEnabled"
           (cdkDropListDropped)="propertyDrop($event)">
        <div cdkDrag [cdkDragDisabled]="!dragEnabled"
             class="jnks-iot-draggable jnks-iot-dynamic-form-array-row"
             *ngFor="let propertyControl of propertiesFormArray().controls; trackBy: trackByProperty; let $index = index;">
          <div class="jnks-iot-dynamic-form-item-index-container">
            <div class="jnks-iot-dynamic-form-item-index">{{$index + 1}}</div>
          </div>
          <jnks-iot-dynamic-form class="flex-1"
                           [properties]="[itemProperty]"
                           [formControl]="propertyControl"
                           isArrayItem noPadding noBorder>
          </jnks-iot-dynamic-form>
          <div class="jnks-iot-dynamic-form-array-buttons">
            <button mat-icon-button
                    *ngIf="!disabled"
                    type="button"
                    (click)="removeProperty($index)"
                    matTooltip="{{ 'action.delete' | translate }}"
                    matTooltipPosition="above">
              <mat-icon>delete</mat-icon>
            </button>
            <button mat-icon-button
                    *ngIf="!disabled"
                    type="button"
                    cdkDragHandle
                    [class.jnks-iot-hidden]="!dragEnabled"
                    matTooltip="{{ 'action.drag' | translate }}"
                    matTooltipPosition="above">
              <mat-icon>drag_indicator</mat-icon>
            </button>
          </div>
        </div>
      </div>
      <div *ngIf="!disabled || !propertiesFormArray().controls.length" [class.invisible]="disabled">
        <button type="button" mat-stroked-button color="primary" (click)="addProperty()">
          <mat-icon>add</mat-icon>
          {{ 'action.add' | translate }}
        </button>
      </div>
    </ng-template>
  </mat-expansion-panel>
</div>

<ng-template #noProperties>
  <span class="jnks-iot-prompt flex items-center justify-center">{{ 'dynamic-form.property.no-items' | translate }}</span>
</ng-template>
