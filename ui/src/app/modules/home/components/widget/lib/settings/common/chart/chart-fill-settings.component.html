<ng-container [formGroup]="fillSettingsFormGroup">
  <div class="jnks-iot-form-row column">
    <div class="jnks-iot-form-row no-border no-padding space-between">
      <div>{{ titleText | translate }}</div>
      <jnks-iot-toggle-select formControlName="type">
        <jnks-iot-toggle-option *ngFor="let type of chartFillTypes" [value]="type">{{ chartFillTypeTranslationMap.get(type) | translate }}</jnks-iot-toggle-option>
      </jnks-iot-toggle-select>
    </div>
    <ng-container *ngIf="fillSettingsFormGroup.get('type').value === ChartFillType.opacity">
      <div class="jnks-iot-form-row space-between column-xs">
        <div translate>widgets.chart.opacity</div>
        <mat-form-field class="medium-width number" appearance="outline" subscriptSizing="dynamic">
          <input matInput type="number" formControlName="opacity" min="0" max="1"
                 step="0.1" placeholder="{{ 'widget-config.set' | translate }}"/>
        </mat-form-field>
      </div>
    </ng-container>
    <ng-container *ngIf="fillSettingsFormGroup.get('type').value === ChartFillType.gradient" formGroupName="gradient">
      <div class="jnks-iot-form-row space-between column-xs">
        <div translate>widgets.chart.gradient-stops</div>
        <div class="flex flex-row items-center justify-start gap-2">
          <div class="jnks-iot-small-label" translate>widgets.chart.gradient-start</div>
          <mat-form-field appearance="outline" class="number" subscriptSizing="dynamic">
            <input matInput formControlName="start" min="0" max="100" step="1"
                   type="number" placeholder="{{ 'widget-config.set' | translate }}">
          </mat-form-field>
          <div class="jnks-iot-small-label" translate>widgets.chart.gradient-end</div>
          <mat-form-field appearance="outline" class="number" subscriptSizing="dynamic">
            <input matInput formControlName="end" min="0" max="100" step="1"
                   type="number" placeholder="{{ 'widget-config.set' | translate }}">
          </mat-form-field>
        </div>
      </div>
    </ng-container>
  </div>
</ng-container>
