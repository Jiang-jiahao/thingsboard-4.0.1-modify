<ng-container [formGroup]="scadaSymbolObjectSettingsFormGroup">
  <div *ngIf="behaviorGroups?.length" class="jnks-iot-form-panel" formGroupName="behavior">
    <div class="jnks-iot-form-panel-title" translate>scada.behavior.behavior</div>
    <ng-container *ngFor="let behaviorGroup of behaviorGroups">
      <div *ngIf="behaviorGroup.title" class="jnks-iot-form-panel stroked">
        <mat-expansion-panel class="jnks-iot-settings" expanded>
          <mat-expansion-panel-header class="flex flex-row flex-wrap">
            <mat-panel-title>
              <div class="jnks-iot-form-panel-title">{{ behaviorGroup.title | customTranslate }}</div>
            </mat-panel-title>
          </mat-expansion-panel-header>
          <ng-template matExpansionPanelContent>
            <ng-container *ngTemplateOutlet="behaviorsTpl; context:{behaviors: behaviorGroup.behaviors}"></ng-container>
          </ng-template>
        </mat-expansion-panel>
      </div>
      <ng-container *ngIf="!behaviorGroup.title">
        <ng-container *ngTemplateOutlet="behaviorsTpl; context:{behaviors: behaviorGroup.behaviors}"></ng-container>
      </ng-container>
    </ng-container>
  </div>
  <jnks-iot-dynamic-form formControlName="properties"
                   title="{{ 'widget-config.appearance' | translate }}"
                   [properties]="metadata?.properties">
    <ng-container class="jnks-iot-properties-content"><ng-content select=".jnks-iot-scada-symbol-appearance-properties"></ng-content></ng-container>
  </jnks-iot-dynamic-form>
</ng-container>

<ng-template #behaviorsTpl let-behaviors="behaviors">
  <ng-container *ngFor="let behavior of behaviors">
    <ng-container *ngTemplateOutlet="behaviorTpl; context:{behavior: behavior}"></ng-container>
  </ng-container>
</ng-template>

<ng-template #behaviorTpl let-behavior="behavior">
  <ng-container [formGroup]="scadaSymbolObjectSettingsFormGroup">
    <div class="jnks-iot-form-row flex-wrap overflow-auto" formGroupName="behavior">
      <div class="fixed-title-width fixed-title-height" jnks-iot-hint-tooltip-icon="{{ behavior.hint | customTranslate }}">{{ behavior.name | customTranslate }}</div>
      <jnks-iot-get-value-action-settings *ngIf="behavior.type === ScadaSymbolBehaviorType.value"
                                    class="jnks-iot-flex"
                                    panelTitle="{{ behavior.name | customTranslate }}"
                                    [valueType]="behavior.valueType"
                                    [trueLabel]="behavior.trueLabel | customTranslate"
                                    [falseLabel]="behavior.falseLabel | customTranslate"
                                    [stateLabel]="behavior.stateLabel | customTranslate"
                                    [aliasController]="aliasController"
                                    [targetDevice]="targetDevice"
                                    [widgetType]="widgetType"
                                    formControlName="{{ behavior.id }}">
      </jnks-iot-get-value-action-settings>
      <jnks-iot-set-value-action-settings *ngIf="behavior.type === ScadaSymbolBehaviorType.action"
                                    class="jnks-iot-flex"
                                    panelTitle="{{ behavior.name | customTranslate }}"
                                    [valueType]="behavior.valueType"
                                    [aliasController]="aliasController"
                                    [targetDevice]="targetDevice"
                                    [widgetType]="widgetType"
                                    formControlName="{{ behavior.id }}">
      </jnks-iot-set-value-action-settings>
      <jnks-iot-widget-action-settings *ngIf="behavior.type === ScadaSymbolBehaviorType.widgetAction"
                                 class="jnks-iot-flex"
                                 panelTitle="{{ behavior.name | customTranslate }}"
                                 [callbacks]="callbacks"
                                 [widgetType]="widgetType"
                                 formControlName="{{ behavior.id }}">
      </jnks-iot-widget-action-settings>
    </div>
  </ng-container>
</ng-template>
