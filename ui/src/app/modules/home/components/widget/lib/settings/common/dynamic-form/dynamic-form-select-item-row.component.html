<div [formGroup]="selectItemRowFormGroup" class="jnks-iot-form-table-row jnks-iot-dynamic-form-select-item-row">
  <jnks-iot-value-input class="jnks-iot-value-field"
                  shortBooleanField
                  [allowedValueTypes]="[ValueType.STRING, ValueType.INTEGER, ValueType.DOUBLE, ValueType.BOOLEAN]"
                  formControlName="value">
  </jnks-iot-value-input>
  <mat-form-field class="jnks-iot-inline-field jnks-iot-label-field" appearance="outline" subscriptSizing="dynamic">
    <input required matInput formControlName="label" placeholder="{{ 'widget-config.set' | translate }}">
  </mat-form-field>
  <div class="jnks-iot-form-table-row-cell-buttons">
    <button *ngIf="!disabled"
            type="button"
            mat-icon-button
            (click)="selectItemRemoved.emit()"
            matTooltip="{{ 'dynamic-form.property.remove-option' | translate }}"
            matTooltipPosition="above">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
</div>
