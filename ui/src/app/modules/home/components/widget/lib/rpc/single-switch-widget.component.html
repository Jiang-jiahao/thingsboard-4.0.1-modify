<div #singleSwitchPanel class="jnks-iot-single-switch-panel" [class.auto-scale]="autoScale" [style.pointer-events]="ctx.isEdit ? 'none' : 'all'" [style.padding]="padding" [style]="backgroundStyle$ | async">
  <div class="jnks-iot-single-switch-overlay" [style]="overlayStyle" [style.inset]="overlayInset"></div>
  <div class="jnks-iot-single-switch-title-panel">
    <ng-container *ngTemplateOutlet="widgetTitlePanel"></ng-container>
  </div>
  <div #singleSwitchContent class="jnks-iot-single-switch-content" [class]="this.layout" [class.no-label]="!showIcon && !showLabel" [class.auto-scale]="autoScale">
    <div *ngIf="showIcon || showLabel" #singleSwitchLabelRow class="jnks-iot-single-switch-label-row">
      <jnks-iot-icon *ngIf="showIcon" [style]="iconStyle"
               [style.color]="(disabled || (loading$ | async)) ? disabledColor : settings.iconColor">{{ icon }}</jnks-iot-icon>
      <div *ngIf="showLabel" class="jnks-iot-single-switch-label" [style]="labelStyle"
           [style.color]="(disabled || (loading$ | async)) ? disabledColor : settings.labelColor">{{ label$ | async }}</div>
    </div>
    <div #singleSwitchToggleRow class="jnks-iot-single-switch-slide-toggle-row">
      <div *ngIf="showOffLabel" [style]="offLabelStyle"
           [style.color]="(disabled || (loading$ | async)) ? disabledColor : settings.offLabelColor">{{ offLabel }}</div>
      <mat-slide-toggle class="jnks-iot-single-switch-toggle" [disabled]="disabled || (loading$ | async)" [(ngModel)]="value" (click)="!disabled && onToggleChange($event)">
      </mat-slide-toggle>
      <div *ngIf="showOnLabel" [style]="onLabelStyle"
           [style.color]="(disabled || (loading$ | async)) ? disabledColor : settings.onLabelColor">{{ onLabel }}</div>
    </div>
  </div>
  <mat-progress-bar class="jnks-iot-action-widget-progress" style="height: 4px;" color="accent" mode="indeterminate" *ngIf="loading$ | async"></mat-progress-bar>
</div>
