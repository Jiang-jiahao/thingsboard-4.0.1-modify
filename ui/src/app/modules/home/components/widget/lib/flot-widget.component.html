<div class="jnks-iot-absolute-fill flex" [class]="legendContainerLayoutType">
  <jnks-iot-legend *ngIf="displayLegend && isLegendFirst"
             [style]="legendStyle"
             [legendConfig]="legendConfig"
             [legendData]="legendData"
             (legendKeyHiddenChange)="onLegendKeyHiddenChange($event)">
  </jnks-iot-legend>
  <div class="flex-1" #flotElement></div>
  <jnks-iot-legend *ngIf="displayLegend && !isLegendFirst"
             [style]="legendStyle"
             [legendConfig]="legendConfig"
             [legendData]="legendData"
             (legendKeyHiddenChange)="onLegendKeyHiddenChange($event)">
  </jnks-iot-legend>
</div>
