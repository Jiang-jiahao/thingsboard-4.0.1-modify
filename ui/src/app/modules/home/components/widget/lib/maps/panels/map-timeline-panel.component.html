<div class="jnks-iot-map-timeline-panel" [class.col]="column">
  @if(hasData) {
    <mat-slider
      [disabled]="disabled"
      [min]="minTimeIndex"
      [max]="maxTimeIndex">
      <input matSliderThumb [(ngModel)]="index" (input)="onIndexChange(ngSliderThumb.value)" #ngSliderThumb="matSliderThumb">
    </mat-slider>
    <div class="jnks-iot-timeline-controls">
      <div class="flex flex-1 flex-row items-center justify-start">
        <div class="jnks-iot-map-timeline-timestamp" *ngIf="settings.showTimestamp" [innerHTML]="timestampFormat.formatted"></div>
      </div>
      <div class="jnks-iot-timeline-buttons flex flex-1 flex-row items-center justify-center gap-3">
        <button mat-mini-fab color="primary"
                [disabled]="index === minTimeIndex"
                class="jnks-iot-timeline-button-32 jnks-iot-primary-fill"
                (click)="fastRewind()">
          <mat-icon>fast_rewind</mat-icon>
        </button>
        <button mat-mini-fab color="primary"
                [disabled]="index === minTimeIndex"
                class="jnks-iot-timeline-button-32 jnks-iot-primary-fill"
                (click)="movePrev()">
          <mat-icon>skip_previous</mat-icon>
        </button>
        @if(playing) {
          <button mat-mini-fab color="primary" class="jnks-iot-primary-fill" (click)="pause()">
            <mat-icon>pause</mat-icon>
          </button>
        } @else {
          <button mat-mini-fab color="primary"
                  [disabled]="index === maxTimeIndex"
                  class="jnks-iot-primary-fill" (click)="play()">
            <mat-icon>play_arrow</mat-icon>
          </button>
        }
        <button mat-mini-fab color="primary"
                [disabled]="index === maxTimeIndex"
                class="jnks-iot-timeline-button-32 jnks-iot-primary-fill"
                (click)="moveNext()">
          <mat-icon>skip_next</mat-icon>
        </button>
        <button mat-mini-fab color="primary"
                [disabled]="index === maxTimeIndex"
                class="jnks-iot-timeline-button-32 jnks-iot-primary-fill"
                (click)="fastForward()">
          <mat-icon>fast_forward</mat-icon>
        </button>
      </div>
      <div class="flex flex-1 flex-row items-center justify-end">
        <mat-select class="w-auto" [(ngModel)]="speed" (selectionChange)="speedUpdated()" aria-label="Speed selector">
          <mat-select-trigger><span style="padding-right: 10px;">{{speed}}x</span></mat-select-trigger>
          <mat-option [value]="speedValue" *ngFor="let speedValue of settings.speedOptions">{{speedValue}}x</mat-option>
        </mat-select>
      </div>
    </div>
  } @else {
    <div class="jnks-iot-map-timeline-no-data flex flex-1 items-center justify-center" translate>widgets.maps.timeline.no-trips-data-available</div>
  }
</div>
