<ng-container [formGroup]="scadaSymbolWidgetSettingsForm">
  <div class="jnks-iot-form-panel">
    <div class="jnks-iot-form-panel-title" translate>scada.symbol.symbol</div>
    <jnks-iot-scada-symbol-input required
                           formControlName="scadaSymbolUrl"></jnks-iot-scada-symbol-input>
  </div>
  <jnks-iot-scada-symbol-object-settings
    formControlName="scadaSymbolObjectSettings"
    [scadaSymbolUrl]="scadaSymbolWidgetSettingsForm.get('scadaSymbolUrl').value"
    [aliasController]="aliasController"
    [targetDevice]="targetDevice"
    [widgetType]="widgetType"
    [callbacks]="callbacks">
  </jnks-iot-scada-symbol-object-settings>
  <div class="jnks-iot-form-panel">
    <div class="jnks-iot-form-panel-title" translate>widget-config.card-appearance</div>
    <div class="jnks-iot-form-row space-between">
      <div>{{ 'widgets.background.background' | translate }}</div>
      <jnks-iot-background-settings formControlName="background">
      </jnks-iot-background-settings>
    </div>
    <div class="jnks-iot-form-row space-between">
      <div>{{ 'widget-config.card-padding' | translate }}</div>
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <input matInput formControlName="padding" placeholder="{{ 'widget-config.set' | translate }}">
      </mat-form-field>
    </div>
  </div>
</ng-container>
