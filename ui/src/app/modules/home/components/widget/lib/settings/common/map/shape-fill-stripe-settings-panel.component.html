<div class="jnks-iot-shape-fill-stripe-settings-panel" [formGroup]="shapeFillStripeSettingsFormGroup">
  <div class="jnks-iot-shape-fill-stripe-settings-title" translate>widgets.maps.data-layer.shape.stripe-pattern</div>
  <div class="jnks-iot-shape-fill-stripe-settings-panel-body">
    <div class="jnks-iot-form-panel no-padding no-border">
      <div class="jnks-iot-form-row space-between">
        <div translate>widgets.maps.data-layer.shape.first-stripe</div>
        <div class="flex flex-row items-center gap-2">
          <mat-form-field appearance="outline" class="number" subscriptSizing="dynamic">
            <input matInput type="number" min="0" formControlName="weight" placeholder="{{ 'widget-config.set' | translate }}">
            <span matSuffix>px</span>
          </mat-form-field>
          <jnks-iot-data-layer-color-settings
            [context]="context"
            [dsType]="dsType"
            [dsEntityAliasId]="dsEntityAliasId"
            [dsDeviceId]="dsDeviceId"
            helpId="{{ dataLayerType === 'polygons' ? 'widget/lib/map/polygon_stroke_color_fn' : 'widget/lib/map/circle_stroke_color_fn' }}" formControlName="color"></jnks-iot-data-layer-color-settings>
        </div>
      </div>
      <div class="jnks-iot-form-row space-between">
        <div translate>widgets.maps.data-layer.shape.second-stripe</div>
        <div class="flex flex-row items-center gap-2">
          <mat-form-field appearance="outline" class="number" subscriptSizing="dynamic">
            <input matInput type="number" min="0" formControlName="spaceWeight" placeholder="{{ 'widget-config.set' | translate }}">
            <span matSuffix>px</span>
          </mat-form-field>
          <jnks-iot-data-layer-color-settings
            [context]="context"
            [dsType]="dsType"
            [dsEntityAliasId]="dsEntityAliasId"
            [dsDeviceId]="dsDeviceId"
            helpId="{{ dataLayerType === 'polygons' ? 'widget/lib/map/polygon_stroke_color_fn' : 'widget/lib/map/circle_stroke_color_fn' }}" formControlName="spaceColor"></jnks-iot-data-layer-color-settings>
        </div>
      </div>
      <div class="jnks-iot-form-row space-between">
        <div translate>widgets.maps.data-layer.shape.angle</div>
        <mat-form-field appearance="outline" class="number" subscriptSizing="dynamic">
          <input matInput formControlName="angle" type="number" min="0" max="180" placeholder="{{ 'widget-config.set' | translate }}">
          <div matSuffix>deg</div>
        </mat-form-field>
      </div>
      <div class="jnks-iot-shape-fill-stripe-settings-preview">
        <div class="jnks-iot-shape-fill-stripe-settings-preview-title" translate>
          widgets.background.preview
        </div>
        <div class="jnks-iot-shape-fill-stripe-settings-preview-box mat-elevation-z4" [style]="stripePreviewStyle">
        </div>
      </div>
    </div>
  </div>
  <div class="jnks-iot-shape-fill-stripe-settings-panel-buttons">
    <span class="flex-1"></span>
    <button mat-button
            color="primary"
            type="button"
            (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button
            color="primary"
            type="button"
            (click)="applyShapeFillStripeSettings()"
            [disabled]="shapeFillStripeSettingsFormGroup.invalid || !shapeFillStripeSettingsFormGroup.dirty">
      {{ 'action.apply' | translate }}
    </button>
  </div>
</div>
