<div #labelCardPanel class="jnks-iot-label-card-panel" [style.padding]="padding" [style]="backgroundStyle$ | async"
     [class.jnks-iot-label-card-pointer]="hasCardClickAction" (click)="cardClick($event)">
  <div class="jnks-iot-label-card-overlay" [style]="overlayStyle"></div>
  <div class="jnks-iot-label-card-title-panel">
    <ng-container *ngTemplateOutlet="widgetTitlePanel"></ng-container>
  </div>
  <div #labelCardContent class="jnks-iot-label-card-content">
    <div #labelCardRow class="jnks-iot-label-card-row">
      <jnks-iot-icon *ngIf="showIcon" [style]="iconStyle">{{ icon }}</jnks-iot-icon>
      <div [class.jnks-iot-label-card-label]="!settings.autoScale" [style]="labelStyle" [innerHTML]="label | safe:'html'"></div>
    </div>
  </div>
</div>
