<div class="jnks-iot-form-row no-border no-padding column-lt-md" style="gap: 10px;" [formGroup]="thresholdFormGroup">
  <jnks-iot-value-source style="flex: 1" [aliasController]="aliasController" formControlName="valueSource"></jnks-iot-value-source>
  <div class="jnks-iot-form-row no-border no-padding" style="gap: 10px;">
      <mat-form-field appearance="outline" class="number lt-md:flex-1" subscriptSizing="dynamic">
        <input matInput formControlName="lineWidth" type="number" min="0" placeholder="{{ 'widgets.chart.line-width' | translate }}">
      </mat-form-field>
      <jnks-iot-color-input asBoxInput
                      formControlName="color">
      </jnks-iot-color-input>
      <button *ngIf="!disabled" mat-icon-button
              class="jnks-iot-box-button"
              type="button"
              (click)="removeThreshold.emit()"
              matTooltip="{{ 'action.remove' | translate }}"
              matTooltipPosition="above">
        <mat-icon>delete</mat-icon>
      </button>
  </div>
</div>
