<form class="jnks-iot-edit-links-dialog" [formGroup]="editLinksFormGroup">
  <mat-toolbar style="background: transparent;">
    <h2>{{ (mode === 'docs' ? 'widgets.documentation.title' : 'widgets.quick-links.title') | translate }}</h2>
    <span class="flex-1"></span>
    <button mat-icon-button
            (click)="close()"
            type="button">
      <jnks-iot-icon class="material-icons">close</jnks-iot-icon>
    </button>
  </mat-toolbar>
  <div mat-dialog-content>
    <div class="jnks-iot-drop-list" cdkDropList cdkDropListOrientation="vertical"
         (cdkDropListDropped)="linkDrop($event)" [cdkDropListDisabled]="editMode || addMode">
      <div cdkDrag class="jnks-iot-draggable flex flex-row items-center justify-start" *ngFor="let linkControl of linksFormArray().controls; trackBy: trackByLink;
               let $index = index; last as isLast;"
           [class.pb-2]="!isLast">
        <ng-container [ngSwitch]="mode">
          <ng-template [ngSwitchCase]="'docs'">
            <jnks-iot-doc-link class="flex-1" #docLink [formControl]="linkControl"
                         [disableEdit]="editMode || addMode"
                         (editModeChanged)="editMode = $event"
                         (docLinkUpdated)="update()"
                         (docLinkDeleted)="deleteLink($index)">
            </jnks-iot-doc-link>
            <ng-container *ngIf="!docLink.isEditing()">
              <ng-container *ngTemplateOutlet="dragHandle"></ng-container>
            </ng-container>
          </ng-template>
          <ng-template [ngSwitchCase]="'quickLinks'">
            <jnks-iot-quick-link class="flex-1" #quickLink [formControl]="linkControl"
                           [disableEdit]="editMode || addMode"
                           (editModeChanged)="editMode = $event"
                           (quickLinkUpdated)="update()"
                           (quickLinkDeleted)="deleteLink($index)">
            </jnks-iot-quick-link>
            <ng-container *ngIf="!quickLink.isEditing()">
              <ng-container *ngTemplateOutlet="dragHandle"></ng-container>
            </ng-container>
          </ng-template>
        </ng-container>
        <ng-template #dragHandle>
          <div cdkDragHandle
               matTooltip="{{ 'action.drag' | translate }}"
               matTooltipPosition="above"
               class="jnks-iot-drag-handle">
            <jnks-iot-icon>drag_indicator</jnks-iot-icon>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
  <div mat-dialog-actions>
    <div *ngIf="!editMode && !addMode" class="jnks-iot-add-link-button flex-1"
         matTooltip="{{ (mode === 'docs' ? 'widgets.documentation.add-link' : 'widgets.quick-links.add-link') | translate }}"
         matTooltipPosition="above"
         (click)="addLink()">
      <jnks-iot-icon class="jnks-iot-add-icon">add</jnks-iot-icon>
    </div>
    <ng-container *ngIf="addMode">
      <ng-container [ngSwitch]="mode">
        <ng-template [ngSwitchCase]="'docs'">
          <jnks-iot-doc-link class="flex-1" [(ngModel)]="addingLink"
                       [ngModelOptions]="{standalone: true}"
                       (docLinkAdded)="linkAdded($event)"
                       (docLinkAddCanceled)="addMode = false">
          </jnks-iot-doc-link>
        </ng-template>
        <ng-template [ngSwitchCase]="'quickLinks'">
          <jnks-iot-quick-link class="flex-1" [(ngModel)]="addingLink"
                       [ngModelOptions]="{standalone: true}"
                       (quickLinkAdded)="linkAdded($event)"
                       (quickLinkAddCanceled)="addMode = false">
          </jnks-iot-quick-link>
        </ng-template>
      </ng-container>
    </ng-container>
  </div>
</form>
