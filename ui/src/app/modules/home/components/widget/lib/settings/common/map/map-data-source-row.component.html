<div [formGroup]="dataSourceFormGroup" class="jnks-iot-form-table-row jnks-iot-map-data-source-row">
  <div class="jnks-iot-source-field">
    <mat-form-field class="jnks-iot-ds-type-field jnks-iot-inline-field" appearance="outline" subscriptSizing="dynamic">
      <mat-select formControlName="dsType">
        <mat-option *ngFor="let type of datasourceTypes" [value]="type">
          {{ datasourceTypesTranslations.get(type) | translate }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <jnks-iot-entity-autocomplete
      class="jnks-iot-device-field"
      *ngIf="dataSourceFormGroup.get('dsType').value === DatasourceType.device"
      required
      inlineField
      placeholder="{{ 'device.select-device' | translate }}"
      [entityType]="EntityType.DEVICE"
      formControlName="dsDeviceId">
    </jnks-iot-entity-autocomplete>
    <jnks-iot-entity-alias-select
      class="jnks-iot-entity-alias-field"
      *ngIf="dataSourceFormGroup.get('dsType').value === DatasourceType.entity"
      inlineField
      jnksIotRequired
      [aliasController]="context.aliasController"
      formControlName="dsEntityAliasId"
      [callbacks]="context.callbacks">
    </jnks-iot-entity-alias-select>
  </div>
  <jnks-iot-filter-select
    class="jnks-iot-filter-field"
    inlineField
    [aliasController]="context.aliasController"
    formControlName="dsFilterId"
    [callbacks]="context.callbacks">
  </jnks-iot-filter-select>
  <div class="jnks-iot-form-table-row-cell-buttons">
    <div class="jnks-iot-remove-button">
      <button type="button"
              mat-icon-button
              (click)="dataSourceRemoved.emit()"
              matTooltip="{{ 'widgets.maps.data-layer.remove-datasource' | translate }}"
              matTooltipPosition="above">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  </div>
</div>
