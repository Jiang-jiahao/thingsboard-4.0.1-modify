<div class="jnks-iot-marker-image-settings-panel" [formGroup]="markerImageSettingsFormGroup">
  <div class="jnks-iot-marker-image-settings-title" translate>widgets.maps.data-layer.marker.marker-image</div>
  <div class="flex flex-row">
    <jnks-iot-toggle-select formControlName="type" class="flex-1">
      <jnks-iot-toggle-option [value]="MarkerImageType.image">
        {{ 'widgets.maps.data-layer.marker.marker-image-type-image' | translate }}
      </jnks-iot-toggle-option>
      <jnks-iot-toggle-option [value]="MarkerImageType.function">
        {{ 'widgets.maps.data-layer.marker.marker-image-type-function' | translate }}
      </jnks-iot-toggle-option>
    </jnks-iot-toggle-select>
  </div>
  <div class="jnks-iot-marker-image-settings-panel-body" [class.!hidden]="markerImageSettingsFormGroup.get('type').value !== MarkerImageType.image">
    <div class="jnks-iot-form-panel no-padding no-border">
      <jnks-iot-gallery-image-input required formControlName="image"></jnks-iot-gallery-image-input>
      <div class="jnks-iot-form-row space-between">
        <div>{{ 'widgets.maps.data-layer.marker.custom-marker-image-size' | translate }}</div>
        <mat-form-field appearance="outline" class="number" subscriptSizing="dynamic">
          <input matInput formControlName="imageSize" type="number" min="1" step="1" placeholder="{{ 'widget-config.set' | translate }}">
          <div matSuffix>px</div>
        </mat-form-field>
      </div>
    </div>
  </div>
  <div class="jnks-iot-marker-image-settings-panel-body" [class.!hidden]="markerImageSettingsFormGroup.get('type').value !== MarkerImageType.function">
    <div class="jnks-iot-form-panel no-padding no-border">
      <jnks-iot-js-func formControlName="imageFunction"
                  withModules
                  [functionArgs]="['data', 'images', 'dsData']"
                  [globalVariables]="functionScopeVariables"
                  functionTitle="{{ 'widgets.maps.data-layer.marker.marker-image-function' | translate }}"
                  helpId="widget/lib/map/marker_image_fn"
                  [helpPopupStyle]="{width: '900px'}">
      </jnks-iot-js-func>
      <jnks-iot-multiple-gallery-image-input label="{{ 'widgets.maps.data-layer.marker.marker-images' | translate }}"
                                       formControlName="images">
      </jnks-iot-multiple-gallery-image-input>
    </div>
  </div>
  <div class="jnks-iot-marker-image-settings-panel-buttons">
    <span class="flex-1"></span>
    <button mat-button
            color="primary"
            type="button"
            (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button
            color="primary"
            type="button"
            (click)="applyMarkerImageSettings()"
            [disabled]="markerImageSettingsFormGroup.invalid || !markerImageSettingsFormGroup.dirty">
      {{ 'action.apply' | translate }}
    </button>
  </div>
</div>
