<div class="jnks-iot-action-settings-panel" [formGroup]="widgetActionFormGroup">
  <div class="jnks-iot-action-settings-title">{{ panelTitle }}</div>
  <div class="jnks-iot-action-settings-panel-content">
    <jnks-iot-widget-action
      formControlName="widgetAction"
      [callbacks]="callbacks"
      [widgetType]="widgetType"
      [withName]="withName"
      [actionNames]="actionNames"
      [additionalWidgetActionTypes]="additionalWidgetActionTypes">
    </jnks-iot-widget-action>
  </div>
  <div class="jnks-iot-action-settings-panel-buttons">
    <button mat-button
            color="primary"
            type="button"
            (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-raised-button
            color="primary"
            type="button"
            (click)="applyWidgetAction()"
            [disabled]="widgetActionFormGroup.invalid || !widgetActionFormGroup.dirty">
      {{ applyTitle }}
    </button>
  </div>
</div>
