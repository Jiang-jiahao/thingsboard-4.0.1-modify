<div class="jnks-iot-custom-action-pretty" jnks-iot-fullscreen [fullscreen]="fullscreen">
  <div class="jnks-iot-action-expand-button flex flex-row items-center justify-end" [class.jnks-iot-fullscreen-editor]="fullscreen">
    <button *ngIf="!fullscreen"
            class="lt-md:!hidden"
            mat-icon-button
            matTooltip="{{ 'widget.toggle-fullscreen' | translate }}"
            matTooltipPosition="above"
            (click)="fullscreen = true">
      <mat-icon>fullscreen</mat-icon>
    </button>
    <button *ngIf="fullscreen"
            mat-button
            matTooltip="{{ 'widget.toggle-fullscreen' | translate }}"
            matTooltipPosition="above"
            (click)="fullscreen = false">
      <mat-icon>fullscreen_exit</mat-icon>
      <span translate>widget.toggle-fullscreen</span>
    </button>
  </div>
  <div class="jnks-iot-custom-action-editor" [class.jnks-iot-fullscreen-editor]="fullscreen">
    <div *ngIf="!fullscreen; else fullscreenEditor">
      <jnks-iot-custom-action-pretty-resources-tabs [hasCustomFunction]="true"
                                              [helpId]="helpId"
                                              [action]="action" (actionUpdated)="onActionUpdated($event ? true : false)">
      </jnks-iot-custom-action-pretty-resources-tabs>
    </div>
    <ng-template #fullscreenEditor>
      <div class="jnks-iot-fullscreen-panel jnks-iot-layout-fill flex flex-row">
        <div #leftPanel class="jnks-iot-split jnks-iot-content">
          <jnks-iot-custom-action-pretty-resources-tabs [hasCustomFunction]="false"
                                                  [helpId]="helpId"
                                                  [action]="action" (actionUpdated)="onActionUpdated($event ? true : false)">
          </jnks-iot-custom-action-pretty-resources-tabs>
        </div>
        <div #rightPanel class="jnks-iot-split jnks-iot-content right-panel">
          <jnks-iot-js-func
            [(ngModel)]="action.customFunction"
            (ngModelChange)="onActionUpdated()"
            withModules
            [fillHeight]="true"
            [functionArgs]="['$event', 'widgetContext', 'entityId', 'entityName', 'htmlTemplate', 'additionalParams', 'entityLabel']"
            [disableUndefinedCheck]="true"
            [validationArgs]="[]"
            [editorCompleter]="customPrettyActionEditorCompleter"
            functionTitle="{{ 'widget-action.custom-pretty-function' | translate }}"
            [helpId]="helpId"
            [helpPopupStyle]="{width: '900px'}">
          </jnks-iot-js-func>
        </div>
      </div>
    </ng-template>
  </div>
</div>
