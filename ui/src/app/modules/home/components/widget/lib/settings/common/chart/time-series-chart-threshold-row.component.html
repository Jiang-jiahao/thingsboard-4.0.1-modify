<div [formGroup]="thresholdFormGroup" class="jnks-iot-form-table-row jnks-iot-time-series-threshold-row">
  <div class="jnks-iot-threshold-source-field">
    <mat-form-field class="jnks-iot-inline-field jnks-iot-threshold-type-field" appearance="outline" subscriptSizing="dynamic">
      <mat-select formControlName="type">
        <mat-option *ngFor="let type of timeSeriesThresholdTypes" [value]="type">
          {{ timeSeriesThresholdTypeTranslations.get(type) | translate }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <jnks-iot-entity-alias-input
      *ngIf="thresholdFormGroup.get('type').value === TimeSeriesChartThresholdType.entity"
      [aliasController]="aliasController"
      required
      formControlName="entityAlias">
    </jnks-iot-entity-alias-input>
  </div>
  <div class="jnks-iot-threshold-key-value-field">
    <mat-form-field *ngIf="thresholdFormGroup.get('type').value === TimeSeriesChartThresholdType.constant"
                    appearance="outline" class="jnks-iot-inline-field number" subscriptSizing="dynamic"
                    [class.jnks-iot-suffix-absolute]="!thresholdFormGroup.get('value').value">
      <input required matInput formControlName="value" type="number" placeholder="{{ 'widget-config.set' | translate }}">
      <mat-icon matSuffix
                matTooltipPosition="above"
                matTooltipClass="jnks-iot-error-tooltip"
                [matTooltip]="'widgets.time-series-chart.threshold.threshold-value-required' | translate"
                *ngIf="thresholdFormGroup.get('value').hasError('required')
                       && thresholdFormGroup.get('value').touched"
                class="jnks-iot-error">
        warning
      </mat-icon>
    </mat-form-field>
    <jnks-iot-data-key-input
      *ngIf="thresholdFormGroup.get('type').value === TimeSeriesChartThresholdType.latestKey"
      required
      requiredText="widgets.time-series-chart.threshold.key-required"
      [datasourceType]="datasource?.type"
      [entityAliasId]="datasource?.entityAliasId"
      [deviceId]="datasource?.deviceId"
      [aliasController]="aliasController"
      [dataKeyType]="datasource?.type === DatasourceType.function ? DataKeyType.function : null"
      [dataKeyTypes]="[DataKeyType.attribute, DataKeyType.timeseries]"
      [callbacks]="dataKeyCallbacks"
      [editable]="false"
      [formControl]="latestKeyFormControl">
    </jnks-iot-data-key-input>
    <jnks-iot-data-key-input
      *ngIf="thresholdFormGroup.get('type').value === TimeSeriesChartThresholdType.entity"
      required
      requiredText="widgets.time-series-chart.threshold.entity-key-required"
      [datasourceType]="DatasourceType.entity"
      [aliasController]="aliasController"
      [entityAlias]="thresholdFormGroup.get('entityAlias').value"
      [dataKeyTypes]="[DataKeyType.attribute, DataKeyType.timeseries]"
      [callbacks]="dataKeyCallbacks"
      [editable]="false"
      [formControl]="entityKeyFormControl">
    </jnks-iot-data-key-input>
  </div>
  <div *ngIf="!hideYAxis" class="jnks-iot-y-axis-field">
    <mat-form-field class="jnks-iot-inline-field fixed-height" appearance="outline" subscriptSizing="dynamic">
      <mat-select formControlName="yAxisId">
        <mat-option *ngFor="let yAxis of yAxisIds" [value]="yAxis">
          {{ yAxis }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div class="jnks-iot-color-field">
    <jnks-iot-color-input asBoxInput
                    colorClearButton
                    formControlName="lineColor">
    </jnks-iot-color-input>
  </div>
  <div class="jnks-iot-units-field">
    <jnks-iot-unit-input formControlName="units">
    </jnks-iot-unit-input>
  </div>
  <div class="jnks-iot-decimals-field">
    <mat-form-field appearance="outline" class="jnks-iot-inline-field number" subscriptSizing="dynamic">
      <input matInput formControlName="decimals" type="number" min="0" max="15" step="1" placeholder="{{ 'widget-config.set' | translate }}">
    </mat-form-field>
  </div>
  <div class="jnks-iot-form-table-row-cell-buttons">
    <jnks-iot-time-series-chart-threshold-settings
        [widgetConfig]="widgetConfig"
        [yAxisIds]="yAxisIds"
        [hideYAxis]="hideYAxis"
        icon="settings"
        [formControl]="thresholdSettingsFormControl">
    </jnks-iot-time-series-chart-threshold-settings>
    <button type="button"
            mat-icon-button
            (click)="thresholdRemoved.emit()"
            matTooltip="{{ 'widgets.time-series-chart.threshold.remove-threshold' | translate }}"
            matTooltipPosition="above">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
</div>
