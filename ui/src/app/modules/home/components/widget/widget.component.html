<div class="jnks-iot-absolute-fill flex flex-col" jnks-iot-toast>
  <div class="flex-1" id="widget-container">
    <ng-container #widgetContent></ng-container>
  </div>
</div>
<div class="jnks-iot-absolute-fill jnks-iot-widget-error" *ngIf="widgetErrorData">
  <span [innerHtml]="('Widget Error:<br/><br/>' + widgetErrorData.message) | safe:'html'"></span>
</div>
<div class="jnks-iot-absolute-fill jnks-iot-widget-no-data" *ngIf="displayNoData">
  <span style="display: flex;"
        class="jnks-iot-absolute-fill flex items-center justify-center">{{ noDataDisplayMessageText }}</span>
</div>
<div class="jnks-iot-absolute-fill jnks-iot-widget-loading flex flex-col items-center justify-center" [class.!hidden]="!loadingData">
  <mat-spinner color="accent" mode="indeterminate" diameter="40"></mat-spinner>
</div>
