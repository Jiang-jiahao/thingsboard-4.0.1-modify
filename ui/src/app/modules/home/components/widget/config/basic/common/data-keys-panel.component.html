<div class="jnks-iot-form-panel jnks-iot-data-keys-panel"
     [class.no-border]="hidePanel"
     [class.no-padding]="hidePanel">
  <div *ngIf="!hidePanel" class="jnks-iot-form-panel-title">{{ panelTitle }}</div>
  <div class="jnks-iot-form-table">
    <div class="jnks-iot-form-table-header no-padding-right">
      <div *ngIf="hasAdditionalLatestDataKeys" class="jnks-iot-form-table-header-cell jnks-iot-source-header" translate>datakey.source</div>
      <div class="jnks-iot-form-table-header-cell jnks-iot-key-header" translate>datakey.key</div>
      <div class="jnks-iot-form-table-header-cell jnks-iot-label-header" translate>datakey.label</div>
      <div *ngIf="timeSeriesChart && showTimeSeriesType" class="jnks-iot-form-table-header-cell jnks-iot-time-series-type-header" translate>widgets.time-series-chart.series.type</div>
      <div *ngIf="timeSeriesChart" class="jnks-iot-form-table-header-cell jnks-iot-y-axis-header" translate>widgets.time-series-chart.axis.y-axis</div>
      <div *ngIf="!hideDataKeyColor" class="jnks-iot-form-table-header-cell jnks-iot-color-header" translate>datakey.color</div>
      <div *ngIf="!hideUnits" class="jnks-iot-form-table-header-cell jnks-iot-units-header" translate>widget-config.units-short</div>
      <div *ngIf="!hideDecimals" class="jnks-iot-form-table-header-cell jnks-iot-decimals-header" translate>widget-config.decimals-short</div>
      <div class="jnks-iot-form-table-header-cell jnks-iot-actions-header"></div>
    </div>
    <div *ngIf="keysFormArray().controls.length; else noKeys" class="jnks-iot-form-table-body jnks-iot-drop-list"
         cdkDropList cdkDropListOrientation="vertical"
         [cdkDropListDisabled]="!dragEnabled"
         (cdkDropListDropped)="keyDrop($event)">
      <div cdkDrag [cdkDragDisabled]="!dragEnabled"
           class="jnks-iot-draggable-form-table-row"
           *ngFor="let keyControl of keysFormArray().controls; trackBy: trackByKey; let $index = index;">
        <jnks-iot-data-key-row class="flex-1"
                         [formControl]="keyControl"
                         required
                         [datasourceType]="datasourceType"
                         [deviceId]="deviceId"
                         [entityAliasId]="entityAliasId"
                         [hasAdditionalLatestDataKeys]="hasAdditionalLatestDataKeys"
                         [hideDataKeyColor]="hideDataKeyColor"
                         [hideDecimals]="hideDecimals"
                         [timeSeriesChart]="timeSeriesChart"
                         [showTimeSeriesType]="showTimeSeriesType"
                         [yAxisIds]="yAxisIds"
                         [hideUnits]="hideUnits"
                         [hideDataKeyDecimals]="hideDataKeyDecimals"
                         [hideDataKeyUnits]="hideDataKeyUnits"
                         [dataKeyType]="dataKeyType"
                         [singleRow]="false"
                         [keySettingsTitle]="keySettingsTitle"
                         [removeKeyTitle]="removeKeyTitle"
                         (keyRemoved)="removeKey($index)">
        </jnks-iot-data-key-row>
        <div class="jnks-iot-form-table-row-cell-buttons">
          <button mat-icon-button
                  type="button"
                  cdkDragHandle
                  class="lt-lg:!hidden"
                  [class.jnks-iot-hidden]="!dragEnabled"
                  matTooltip="{{ 'action.drag' | translate }}"
                  matTooltipPosition="above">
            <mat-icon>drag_indicator</mat-icon>
          </button>
        </div>
      </div>
    </div>
    <jnks-iot-error *ngIf="errorText" noMargin [error]="errorText" style="padding-left: 12px;"></jnks-iot-error>
  </div>
  <div>
    <button type="button" mat-stroked-button color="primary" (click)="addKey()">
      {{ addKeyTitle }}
    </button>
  </div>
</div>
<ng-template #noKeys>
  <span class="jnks-iot-prompt flex items-center justify-center">{{ noKeysText }}</span>
</ng-template>
