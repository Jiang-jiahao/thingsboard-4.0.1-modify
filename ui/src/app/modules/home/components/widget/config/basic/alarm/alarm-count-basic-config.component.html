<ng-container [formGroup]="alarmCountWidgetConfigForm">
  <jnks-iot-datasources
    [configMode]="basicMode"
    hideDatasourcesMode
    hideDatasourceLabel
    hideDataKeys
    hideAlarmFilter
    displayDatasourceFilterForBasicMode
    formControlName="datasources">
  </jnks-iot-datasources>
  <div class="jnks-iot-form-panel">
    <div class="flex flex-row items-center justify-between">
      <div class="jnks-iot-form-panel-title" translate>alarm.filter</div>
      <button mat-button color="primary"
              (click)="alarmFilterConfig.reset()">
        {{ 'action.reset' | translate }}
      </button>
    </div>
    <jnks-iot-alarm-filter-config #alarmFilterConfig buttonMode="false"
                            propagatedFilter="false"
                            formControlName="alarmFilterConfig"
                            [initialAlarmFilterConfig]="{ statusList: [alarmSearchStatus.ACTIVE] }"></jnks-iot-alarm-filter-config>
  </div>
  <div class="jnks-iot-form-panel">
    <div class="jnks-iot-form-panel-title" translate>widget-config.appearance</div>
    <jnks-iot-count-widget-settings alarmElseEntity="true" formControlName="settings"></jnks-iot-count-widget-settings>
  </div>
  <div class="jnks-iot-form-panel">
    <div class="jnks-iot-form-panel-title" translate>widget-config.card-appearance</div>
    <div class="jnks-iot-form-row space-between">
      <div>{{ 'widgets.background.background' | translate }}</div>
      <jnks-iot-color-input asBoxInput
                      colorClearButton
                      formControlName="backgroundColor">
      </jnks-iot-color-input>
    </div>
    <div class="jnks-iot-form-row space-between column-lt-md">
      <div translate>widget-config.show-card-buttons</div>
      <mat-chip-listbox multiple formControlName="cardButtons">
        <mat-chip-option value="fullscreen">{{ 'fullscreen.fullscreen' | translate }}</mat-chip-option>
      </mat-chip-listbox>
    </div>
    <div class="jnks-iot-form-row space-between">
      <div>{{ 'widget-config.card-border-radius' | translate }}</div>
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <input matInput formControlName="borderRadius" placeholder="{{ 'widget-config.set' | translate }}">
      </mat-form-field>
    </div>
  </div>
  <jnks-iot-widget-actions-panel
    formControlName="actions">
  </jnks-iot-widget-actions-panel>
</ng-container>
