<button mat-icon-button #showNotificationButton (click)="showNotification($event, showNotificationButton)">
  <mat-icon class="material-icons tb-notification-bell-icon" aria-hidden="false"
            [matBadge]="(count$ | async)" [matBadgeHidden]="!(count$ | async)"
            matBadgeColor="warn" matBadgeSize="medium" matBadgePosition="above after">notifications</mat-icon>
</button>
