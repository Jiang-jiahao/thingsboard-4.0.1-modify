<div class="jnks-iot-css flex flex-col"  [class]="{'jnks-iot-disabled': disabled, 'fill-height': fillHeight}"
     jnks-iot-fullscreen
     [fullscreen]="fullscreen">
  <div style="height: 40px;" class="jnks-iot-css-toolbar flex flex-row items-center justify-start">
    <label class="jnks-iot-title no-padding" [class]="{'jnks-iot-error': !disabled && (hasErrors || required && !modelValue), 'jnks-iot-required': !disabled && required}">{{ label }}</label>
    <span class="flex-1"></span>
    <button type='button' *ngIf="!disabled" mat-button class="tidy" (click)="beautifyCss()">
      {{'js-func.tidy' | translate }}
    </button>
    <fieldset style="width: initial">
      <div matTooltip="{{(fullscreen ? 'fullscreen.exit' : 'fullscreen.expand') | translate}}"
           matTooltipPosition="above"
           style="border-radius: 50%"
           (click)="fullscreen = !fullscreen">
        <button type='button' mat-icon-button class="jnks-iot-mat-32">
          <mat-icon class="material-icons">{{ fullscreen ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
        </button>
      </div>
    </fieldset>
  </div>
  <div id="jnks-iot-css-panel" class="jnks-iot-css-content-panel flex flex-col">
    <div #cssEditor id="jnks-iot-css-input" [class.fill-height]="fillHeight"></div>
  </div>
</div>
