<div [formGroup]="moduleRowFormGroup" class="jnks-iot-form-table-row jnks-iot-js-func-module-row">
  <mat-form-field class="jnks-iot-inline-field jnks-iot-alias-field" appearance="outline" subscriptSizing="dynamic">
    <input required matInput formControlName="alias" placeholder="{{ 'widget-config.set' | translate }}">
    <mat-icon matSuffix
              matTooltipPosition="above"
              matTooltipClass="jnks-iot-error-tooltip"
              [matTooltip]="'js-func.invalid-module-alias-name' | translate"
              *ngIf="moduleRowFormGroup.get('alias').invalid && moduleRowFormGroup.get('alias').touched"
              class="jnks-iot-error">
      warning
    </mat-icon>
  </mat-form-field>
  <jnks-iot-resource-autocomplete class="jnks-iot-module-link-field"
                            #resourceAutocomplete
                            formControlName="moduleLink"
                            inlineField
                            hideRequiredMarker required
                            [subType]="ResourceSubType.MODULE"
                            [allowAutocomplete]="true"
                            placeholder="{{ 'widget-config.set' | translate }}">
  </jnks-iot-resource-autocomplete>
  <div class="jnks-iot-form-table-row-cell-buttons">
    <button type="button"
            mat-icon-button
            (click)="moduleRemoved.emit()"
            matTooltip="{{ 'js-func.remove-module' | translate }}"
            matTooltipPosition="above">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
</div>
