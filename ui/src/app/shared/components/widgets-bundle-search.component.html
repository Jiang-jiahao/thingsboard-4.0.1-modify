<div class="input-wrapper flex items-center justify-start gap-4" [class.focus]="focus">
  <mat-icon>search</mat-icon>
  <input type="text"
         [(ngModel)]="searchText"
         (ngModelChange)="updateSearchText()"
         (focus)="toggleFocus()"
         (blur)="toggleFocus()"
         [placeholder]=placeholder>
  <button type="button" *ngIf="searchText" mat-icon-button (click)="clear($event)">
    <mat-icon class="close">close</mat-icon>
  </button>
</div>
