<div class="jnks-iot-image-gallery-dialog">
  <button class="jnks-iot-image-gallery-close jnks-iot-mat-20"
          mat-icon-button
          (click)="cancel()"
          type="button">
    <mat-icon>close</mat-icon>
  </button>
  <jnks-iot-image-gallery
    pageMode="false"
    [imageSubType]="data.imageSubType"
    dialogMode
    mode="grid"
    selectionMode
    (imageSelected)="imageSelected($event)">
  </jnks-iot-image-gallery>
</div>
