<mat-toolbar color="primary">
  <h2>{{ 'image.embed-image' | translate }}</h2>
  <span class="flex-1"></span>
  <button mat-icon-button
          (click)="cancel()"
          type="button">
    <mat-icon class="material-icons">close</mat-icon>
  </button>
</mat-toolbar>
<mat-progress-bar color="warn" mode="indeterminate" *ngIf="isLoading$ | async">
</mat-progress-bar>
<div style="height: 4px;" *ngIf="!(isLoading$ | async)"></div>
<div mat-dialog-content>
  <div class="jnks-iot-form-panel stroked jnks-iot-slide-toggle" *ngIf="!readonly || image.public">
    <mat-expansion-panel class="jnks-iot-settings" [expanded]="image.public" disabled>
      <mat-expansion-panel-header class="flex flex-row flex-wrap">
        <mat-panel-title>
          <div *ngIf="!readonly" jnks-iot-hint-tooltip-icon="{{ 'image.embed-to-html-hint' | translate }}"
               class="jnks-iot-form-row no-border no-padding">
            <mat-slide-toggle class="mat-slide flex items-stretch justify-center" [formControl]="publicStatusControl" (click)="$event.stopPropagation()">
              <div class="jnks-iot-form-panel-title">{{ 'image.embed-to-html' | translate }}</div>
            </mat-slide-toggle>
          </div>
          <div *ngIf="readonly" class="jnks-iot-form-panel-title" translate>image.embed-to-html</div>
        </mat-panel-title>
      </mat-expansion-panel-header>
      <ng-template matExpansionPanelContent>
        <div class="jnks-iot-embed-image-text" [innerHTML]="'image.embed-to-html-text' | translate"></div>
        <jnks-iot-markdown usePlainMarkdown
                     containerClass="jnks-iot-embed-image-code"
                     [data]="embedToHtmlCode()"></jnks-iot-markdown>
      </ng-template>
    </mat-expansion-panel>
  </div>
  <div class="jnks-iot-form-panel stroked">
    <div class="jnks-iot-form-panel-title" translate>image.embed-to-angular-template</div>
    <div class="jnks-iot-embed-image-text" [innerHTML]="'image.embed-to-angular-template-text' | translate"></div>
    <jnks-iot-markdown usePlainMarkdown
                 containerClass="jnks-iot-embed-image-code"
                 [data]="embedToAngularTemplateCode()"></jnks-iot-markdown>
  </div>
</div>
