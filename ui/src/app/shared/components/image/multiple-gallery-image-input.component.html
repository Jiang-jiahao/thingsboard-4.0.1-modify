<div class="jnks-iot-container">
  <label class="jnks-iot-title" *ngIf="label" [class]="{'jnks-iot-error': !disabled && (required && !imageUrls.length), 'jnks-iot-required': !disabled && required}">{{label}}</label>
  <div class="images-container flex flex-row gap-2" dndDropzone [dndHorizontal]="true" dndEffectAllowed="move"
       [class.no-images]="!imageUrls.length"
       [dndDisableIf]="disabled" (dndDrop)="imageDrop($event)">
    <div dndPlaceholderRef class="image-card image-dnd-placeholder"></div>
    <div *ngFor="let imageUrl of imageUrls; let $index = index;"
         (dndStart)="imageDragStart($index)"
         (dndEnd)="imageDragEnd()"
         [dndDraggable]="imageUrl"
         [dndDisableIf]="disabled"
         dndEffectAllowed="move"
         [class.image-dragging]="dragIndex === $index"
         class="image-card flex flex-col">
      <span class="image-title">{{ 'image-input.images' | translate }} [{{ $index }}]</span>
      <div class="image-content-container flex flex-row">
        <div dndHandle *ngIf="!disabled" class="jnks-iot-image-action-container jnks-iot-drag-handle">
          <mat-icon color="primary">drag_indicator</mat-icon>
        </div>
        <div class="jnks-iot-image-preview-container">
          <img class="jnks-iot-image-preview" [src]="imageUrl | image: {preview: true} | async" />
        </div>
        <div *ngIf="!disabled" class="jnks-iot-image-action-container">
          <button mat-icon-button color="primary"
                  type="button"
                  (click)="clearImage($index)"
                  matTooltip="{{ 'action.remove' | translate }}"
                  matTooltipPosition="above">
            <mat-icon>close</mat-icon>
          </button>
        </div>
      </div>
    </div>
    <div class="no-images-prompt" *ngIf="!imageUrls.length">{{ 'image-input.no-images' | translate }}</div>
  </div>
  <div *ngIf="!disabled" class="jnks-iot-image-select-container">
    <div class="jnks-iot-image-container" *ngIf="linkType === ImageLinkType.external">
      <img *ngIf="externalLinkControl.value; else noImage" class="jnks-iot-image-preview" [src]="externalLinkControl.value | image | async">
    </div>
    <div *ngIf="linkType === ImageLinkType.external" class="jnks-iot-image-info-container">
      <div class="jnks-iot-external-image-container">
        <div class="jnks-iot-external-link-label">
          {{ 'image.image-link' | translate }}
        </div>
        <div class="jnks-iot-external-link-input-container">
          <mat-form-field class="jnks-iot-inline-field" appearance="outline" subscriptSizing="dynamic">
            <input matInput [formControl]="externalLinkControl" placeholder="{{ 'widget-config.set' | translate }}">
          </mat-form-field>
          <button class="jnks-iot-image-decline-btn"
                  type="button"
                  mat-icon-button
                  matTooltip="{{ 'action.decline' | translate }}"
                  matTooltipPosition="above"
                  (click)="declineLink($event)">
            <mat-icon>close</mat-icon>
          </button>
          <button class="jnks-iot-image-apply-btn"
                  type="button"
                  [disabled]="!externalLinkControl.value"
                  color="primary"
                  mat-icon-button
                  matTooltip="{{ 'action.apply' | translate }}"
                  matTooltipPosition="above"
                  (click)="applyLink($event)">
            <mat-icon>check</mat-icon>
          </button>
        </div>
      </div>
    </div>
    <div *ngIf="linkType === ImageLinkType.none" class="jnks-iot-image-select-buttons-container">
      <button mat-stroked-button
              type="button"
              color="primary"
              class="jnks-iot-image-select-button"
              (click)="toggleGallery($event)">
        <jnks-iot-icon matButtonIcon>filter</jnks-iot-icon>
        <span translate>image.browse-from-gallery</span>
      </button>
      <button mat-stroked-button
              type="button"
              color="primary"
              class="jnks-iot-image-select-button"
              (click)="setLink($event)">
        <jnks-iot-icon matButtonIcon>link</jnks-iot-icon>
        <span translate>image.set-link</span>
      </button>
    </div>
  </div>
</div>

<ng-template #noImage>
  <div class="jnks-iot-no-image">{{ 'image.no-image-selected' | translate }}</div>
</ng-template>
