<div class="flex flex-col" style="background: #fff;" [class.fill-height]="fillHeight"
     jnks-iot-fullscreen
     [fullscreen]="fullscreen" (fullscreenChanged)="onFullscreen()">
  <div class="jnks-iot-json-object-toolbar flex flex-row items-center justify-start">
    <label class="jnks-iot-title no-padding"
           [class]="{'jnks-iot-required': jsonRequired,
                     'jnks-iot-readonly': readonly,
                     'jnks-iot-error': !objectValid}">{{ label }}</label>
    <span class="flex-1"></span>
    <button type="button"
            mat-button *ngIf="!readonly && !disabled" class="tidy" (click)="beautifyJSON()">
      {{'js-func.tidy' | translate }}
    </button>
    <button type="button"
            mat-button *ngIf="!readonly && !disabled" class="tidy" (click)="minifyJSON()">
      {{'js-func.mini' | translate }}
    </button>
    <button mat-icon-button class="jnks-iot-mat-32" (click)="fullscreen = !fullscreen"
            matTooltip="{{(fullscreen ? 'fullscreen.exit' : 'fullscreen.expand') | translate}}"
            matTooltipPosition="above">
      <mat-icon class="material-icons">{{ fullscreen ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
    </button>
  </div>
  <div id="jnks-iot-json-panel" jnks-iot-toast toastTarget="{{toastTargetId}}"
       class="jnks-iot-json-object-panel flex flex-col">
    <div #jsonEditor id="jnks-iot-json-input" [style]="editorStyle" [class.fill-height]="fillHeight"></div>
  </div>
</div>
