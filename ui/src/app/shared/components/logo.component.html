<div class="jnks-iot-brand-logo" aria-label="logo">
  <div class="jnks-iot-logo-emblem">
    <img [src]="brandLogo" alt="GENENKOSY" class="jnks-iot-logo-brand-img"/>
  </div>
  <div class="jnks-iot-logo-copy">
    <span class="jnks-iot-logo-text">{{ brandName }}</span>
    <span class="jnks-iot-logo-subtitle">{{ brandSubtitle }}</span>
  </div>
</div>
