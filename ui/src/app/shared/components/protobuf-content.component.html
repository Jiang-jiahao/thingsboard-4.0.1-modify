<div class="flex flex-col"  [class.fill-height]="fillHeight"
     jnks-iot-fullscreen
     [fullscreen]="fullscreen" (fullscreenChanged)="onFullscreen()">
  <div style="height: 40px;" class="jnks-iot-protobuf-content-toolbar flex flex-row items-center justify-start">
    <label class="jnks-iot-title no-padding">{{ label }}</label>
    <span class="flex-1"></span>
    <button type="button"
            mat-button *ngIf="!readonly && !disabled" class="tidy" (click)="beautifyProtobuf()">
      {{'js-func.tidy' | translate }}
    </button>
    <fieldset style="width: initial">
      <div matTooltip="{{(fullscreen ? 'fullscreen.exit' : 'fullscreen.expand') | translate}}"
           matTooltipPosition="above"
           style="border-radius: 50%"
           (click)="fullscreen = !fullscreen">
        <button type='button' mat-icon-button class="jnks-iot-mat-32">
          <mat-icon class="material-icons">{{ fullscreen ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
        </button>
      </div>
    </fieldset>
  </div>
  <div id="jnks-iot-protobuf-panel" jnks-iot-toast
       class="jnks-iot-protobuf-content-panel flex flex-col">
    <div #protobufEditor id="jnks-iot-protobuf-input" [style]="editorStyle" [class.fill-height]="fillHeight"></div>
  </div>
</div>
