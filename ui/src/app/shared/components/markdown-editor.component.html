<div class="markdown-content" [class.jnks-iot-edit-mode]="!readonly"
     jnks-iot-fullscreen [fullscreen]="fullscreen" (fullscreenChanged)="onFullscreen()">
  <div style="min-height: 40px;" class="markdown-editor-toolbar flex flex-row items-center justify-start">
    <label class="jnks-iot-title no-padding" [class]="{'jnks-iot-error': !disabled && required && !markdownValue, 'jnks-iot-required': !disabled && required}">{{ label }}</label>
    <span class="flex-1"></span>
    <button [class.!hidden]="editorMode"
            type="button"
            mat-button (click)="toggleEditMode()">{{ 'markdown.edit' | translate }}</button>
    <button [class.!hidden]="!editorMode"
            type="button"
            mat-button (click)="toggleEditMode()">{{ 'markdown.preview' | translate }}</button>
    <div *ngIf = "helpId" [jnks-iot-help-popup]="helpId"></div>
    <fieldset style="width: initial">
      <div matTooltip="{{(fullscreen ? 'fullscreen.exit' : 'fullscreen.expand') | translate}}"
           matTooltipPosition="above"
           style="border-radius: 50%"
           (click)="fullscreen = !fullscreen">
        <button type='button' mat-icon-button class="jnks-iot-mat-32">
          <mat-icon class="material-icons">{{ fullscreen ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
        </button>
      </div>
    </fieldset>
  </div>
  <div [class.!hidden]="readonly || disabled" class="markdown-content-editor">
    <div [class.!hidden]="!editorMode" #markdownEditor class="jnks-iot-markdown-editor"></div>
    <div [class.!hidden]="editorMode" class="jnks-iot-markdown-view-container">
      <jnks-iot-markdown [data]="renderValue" lineNumbers fallbackToPlainMarkdown></jnks-iot-markdown>
    </div>
  </div>
  <div *ngIf="readonly || disabled" class="jnks-iot-markdown-view-container">
    <jnks-iot-markdown [data]="renderValue" lineNumbers fallbackToPlainMarkdown></jnks-iot-markdown>
  </div>
</div>
