<section class="flex flex-row">
  <div *ngIf="displayUserInfo" class="jnks-iot-user-info flex flex-row lt-lg:!hidden">
    <mat-icon class="material-icons jnks-iot-mini-avatar">account_circle</mat-icon>
    <div class="flex flex-col items-stretch justify-center">
      <span *ngIf="userDisplayName$ | async; let userDisplayName" class="jnks-iot-user-display-name">{{ userDisplayName }}</span>
      <span *ngIf="authorityName$ | async; let authorityName" class="jnks-iot-user-authority">{{ authorityName | translate }}</span>
    </div>
  </div>
  <button mat-icon-button [matMenuTriggerFor]="userMenu">
    <mat-icon class="material-icons">more_vert</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu" xPosition="before">
    <div class="jnks-iot-user-menu-items" *ngIf="authority$ | async; let authority">
      <button mat-menu-item (click)="openAccount()">
        <mat-icon class="material-icons">account_circle</mat-icon>
        <span translate>account.account</span>
      </button>
      <ng-container *ngIf="theme$ | async as theme">
        <button mat-menu-item (click)="toggleTheme()">
          <mat-icon class="material-icons">{{ theme === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
          <span>{{ (theme === 'dark' ? 'home.switch-to-light-theme' : 'home.switch-to-dark-theme') | translate }}</span>
        </button>
      </ng-container>
      <button mat-menu-item (click)="logout()">
        <mat-icon class="material-icons">exit_to_app</mat-icon>
        <span translate>home.logout</span>
      </button>
    </div>
  </mat-menu>
</section>
