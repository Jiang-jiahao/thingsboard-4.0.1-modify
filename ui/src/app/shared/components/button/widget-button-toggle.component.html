<div #toggleGroupContainer class="jnks-iot-toggle-container">
  <mat-button-toggle-group #widgetButton
                           class="jnks-iot-toggle-header"
                           [ngModel]="value"
                           (change)="clicked.emit($event)"
                           [style.border-radius]="computedBorderRadius"
                           [style.border-color]="disabled ? 'rgba(0,0,0,0.38)': computedBorderColor"
                           [style.border-width]="computedBorderWidth"
                           [class.jnks-iot-pointer-events]="disableEvents"
                           [class.jnks-iot-disabled-state]="disabled"
                           [class.jnks-iot-disabled]="disabled">
    <mat-button-toggle [value]="true" [disabled]="disabled" [class.jnks-iot-hover-state]="hovered">
      <div #leftButtonContent class="jnks-iot-widget-button-content" *ngIf="appearance.leftAppearance.showIcon || appearance.leftAppearance.showLabel">
        <jnks-iot-icon matButtonIcon *ngIf="appearance.leftAppearance.showIcon" [style]="leftIconStyle">{{ appearance.leftAppearance.icon }}</jnks-iot-icon>
        <span *ngIf="appearance.leftAppearance.showLabel" [style]="leftLabelStyle" class="jnks-iot-widget-button-label">{{ leftLabel$ | async }}</span>
      </div>
    </mat-button-toggle>
    <mat-button-toggle [value]="false" [disabled]="disabled" [class.jnks-iot-hover-state]="hovered">
      <div #rightButtonContent class="jnks-iot-widget-button-content" *ngIf="appearance.rightAppearance.showIcon || appearance.rightAppearance.showLabel">
        <jnks-iot-icon matButtonIcon *ngIf="appearance.rightAppearance.showIcon" [style]="rightIconStyle">{{ appearance.rightAppearance.icon }}</jnks-iot-icon>
        <span *ngIf="appearance.rightAppearance.showLabel" [style]="rightLabelStyle" class="jnks-iot-widget-button-label">{{ rightLabel$ | async }}</span>
      </div>
    </mat-button-toggle>
  </mat-button-toggle-group>
</div>
