<div class="jnks-iot-container">
  <label class="jnks-iot-title" *ngIf="label" [class]="{'jnks-iot-error': !disabled && (required && !safeImageUrl), 'jnks-iot-required': !disabled && required}">{{label}}</label>
  <ng-container #flow="flow"
                [flowConfig]="{singleFile: true, allowDuplicateUploads: true}">
    <div class="jnks-iot-image-select-container">
      <div class="image-container" *ngIf="showPreview && (safeImageUrl || disabled)" [class]="{'disabled': disabled}">
        <div class="jnks-iot-image-preview-container">
          <div class="jnks-iot-image-preview-text" *ngIf="!safeImageUrl && disabled; else elseBlock">{{ 'dashboard.empty-image' | translate }}</div>
          <ng-template #elseBlock><img class="jnks-iot-image-preview" [src]="safeImageUrl" /></ng-template>
        </div>
        <button *ngIf="safeImageUrl && showClearButton && !disabled"
                mat-icon-button color="primary"
                class="jnks-iot-mat-24"
                type="button"
                (click)="clearImage()"
                matTooltip="{{ 'action.remove' | translate }}"
                matTooltipPosition="above">
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <div *ngIf="!disabled" class="drop-area jnks-iot-flow-drop"
           flowDrop
           [flow]="flow.flowJs">
        <div class="upload-label">
          <mat-icon class="jnks-iot-mat-32">cloud_upload</mat-icon>
          <div class="upload-text-area">
            <span class="hide-xs" translate>image-input.drag-and-drop</span>
            <div class="upload-button-area">
              <span class="hide-xs" translate>image-input.or</span>
              <button type="button" mat-button color="primary" class="browse-file">
                <label for="{{inputId}}">{{'image-input.browse' | translate}}</label>
              </button>
              <input class="file-input" flowButton type="file" [flow]="flow.flowJs" [flowAttributes]="{accept: accept}" id="{{inputId}}">
            </div>
          </div>
        </div>
      </div>
      <button *ngIf="!showPreview && safeImageUrl && showClearButton && !disabled"
              mat-icon-button color="primary"
              class="jnks-iot-mat-24"
              type="button"
              (click)="clearImage()"
              matTooltip="{{ 'action.remove' | translate }}"
              matTooltipPosition="above">
        <mat-icon>close</mat-icon>
      </button>
  </div>
  </ng-container>
  <div *ngIf="(showFileName && fileName) || (maxSizeByte && !disabled)" class="jnks-iot-image-info-container">
    <div *ngIf="showFileName && fileName" class="jnks-iot-image-file-name" [title]="fileName">{{ fileName }}</div>
    <div *ngIf="maxSizeByte && !disabled" class="jnks-iot-image-file-hint" translate [translateParams]="{ size: maxSizeByte | fileSize}">dashboard.maximum-upload-file-size</div>
  </div>
</div>
