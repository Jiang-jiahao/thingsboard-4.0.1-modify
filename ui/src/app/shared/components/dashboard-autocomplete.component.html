<mat-form-field [formGroup]="selectDashboardFormGroup"
                [class]="{'jnks-iot-inline-field': inlineField, 'flex': inlineField,
                          'jnks-iot-suffix-absolute': (inlineField && !selectDashboardFormGroup.get('dashboard').value)}"
                class="mat-block"
                [floatLabel]="floatLabel"
                [appearance]="inlineField ? 'outline' : appearance"
                [subscriptSizing]="inlineField ? 'dynamic' : subscriptSizing">
  <mat-label *ngIf="!inlineField && label">{{ label }}</mat-label>
  <input matInput type="text"
         #dashboardInput
         placeholder="{{ placeholder }}"
         formControlName="dashboard"
         (focusin)="onFocus()"
         [required]="required"
         [matAutocomplete]="dashboardAutocomplete"
         [class.!hidden]="useDashboardLink && disabled && selectDashboardFormGroup.get('dashboard').value">
  <a *ngIf="useDashboardLink && selectDashboardFormGroup.get('dashboard').value && disabled"
     [attr.aria-label]="'dashboard.open-dashboard' | translate"
     [routerLink]=dashboardURL>
    {{ displayDashboardFn(selectDashboardFormGroup.get('dashboard').value) | customTranslate }}
  </a>
  <button *ngIf="selectDashboardFormGroup.get('dashboard').value && !disabled"
          type="button"
          matSuffix mat-icon-button aria-label="Clear"
          (click)="clear()">
    <mat-icon class="material-icons">close</mat-icon>
  </button>
  <mat-icon matSuffix
            matTooltipPosition="above"
            matTooltipClass="jnks-iot-error-tooltip"
            [matTooltip]="requiredText | translate"
            *ngIf="inlineField && requiredText && selectDashboardFormGroup.get('dashboard').hasError('required')
                            && selectDashboardFormGroup.get('dashboard').touched"
            class="jnks-iot-error">
    warning
  </mat-icon>
  <mat-autocomplete
    class="jnks-iot-autocomplete"
    #dashboardAutocomplete="matAutocomplete"
    [displayWith]="displayDashboardFn">
    <mat-option *ngFor="let dashboard of filteredDashboards | async" [value]="dashboard">
      <span [innerHTML]="dashboard.title | customTranslate | highlight:searchText"></span>
    </mat-option>
    <mat-option *ngIf="!(filteredDashboards | async)?.length" [value]="null">
      <div (click)="$event.stopPropagation()">
        <div *ngIf="!textIsNotEmpty(searchText); else searchNotEmpty">
          <span>{{ 'dashboard.no-dashboards-text' | translate }}</span>
        </div>
        <ng-template #searchNotEmpty>
          <span>
          {{ translate.get('dashboard.no-dashboards-matching', {entity: searchText}) | async }}
          </span>
        </ng-template>
      </div>
    </mat-option>
  </mat-autocomplete>
  <mat-error *ngIf="!inlineField">
    <ng-content select="[jnks-iot-error]"></ng-content>
  </mat-error>
  <mat-hint *ngIf="!inlineField">
    <ng-content select="[jnks-iot-hint]"></ng-content>
  </mat-hint>
</mat-form-field>
