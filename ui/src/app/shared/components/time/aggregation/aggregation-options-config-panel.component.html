<form [formGroup]="aggregationOptionsConfigForm" class="jnks-iot-aggregation-options-form jnks-iot-form-panel no-border">
  <div class="jnks-iot-form-panel-title">{{ 'timewindow.edit-aggregation-functions-list' | translate }}</div>
  <div class="jnks-iot-form-hint jnks-iot-primary-fill">{{ 'timewindow.edit-aggregation-functions-list-hint' | translate }}</div>
  <div class="jnks-iot-form-table no-gap no-padding">
    <div class="jnks-iot-form-table-header">
      <div class="jnks-iot-form-table-header-cell">{{"timewindow.allowed-aggregation-functions" | translate }}</div>
    </div>
    <div class="jnks-iot-form-table-body">
      <mat-selection-list formControlName="allowedAggregationTypes">
        <mat-list-option *ngFor="let type of allAggregationTypes" [value]="type" togglePosition="before" color="primary">
          {{ aggregationTypesTranslations.get(aggregationTypes[type]) | translate }}
        </mat-list-option>
      </mat-selection-list>
    </div>
  </div>
  <div class="jnks-iot-flex flex-end no-gap">
    <button type="button"
            mat-button
            (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button type="button"
            mat-raised-button
            color="primary"
            (click)="update()"
            [disabled]="aggregationOptionsConfigForm.invalid || !aggregationOptionsConfigForm.dirty">
      {{ 'action.apply' | translate }}
    </button>
  </div>
</form>
