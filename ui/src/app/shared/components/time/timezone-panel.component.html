<form [formGroup]="timezoneForm">
  <section class="jnks-iot-form-row column-xs space-between">
    <div>{{ 'timezone.timezone' | translate }}</div>
    <jnks-iot-timezone-select [localBrowserTimezonePlaceholderOnEmpty]="localBrowserTimezonePlaceholderOnEmpty"
                        formControlName="timezone"
                        subscriptSizing="dynamic"
                        appearance="outline"
                        displayLabel="false" class="flex">
    </jnks-iot-timezone-select>
  </section>
</form>
<div class="jnks-iot-timezone-panel-actions jnks-iot-flex flex-end no-gap">
  <button type="button"
          mat-button
          [disabled]="(isLoading$ | async)"
          (click)="cancel()">
    {{ 'action.cancel' | translate }}
  </button>
  <button type="button"
          mat-raised-button
          color="primary"
          (click)="update()"
          [disabled]="(isLoading$ | async) || timezoneForm.invalid || !timezoneForm.dirty">
    {{ 'action.apply' | translate }}
  </button>
</div>
