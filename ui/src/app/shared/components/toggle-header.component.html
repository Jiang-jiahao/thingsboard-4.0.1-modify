<button mat-icon-button
        type="button"
        [disabled]="!leftPaginationEnabled"
        (click)="handlePaginatorClick('before', $event)"
        (touchstart)="handlePaginatorTouchStart('before', $event)"
        class="jnks-iot-toggle-header-pagination-button"
        [class.fill-height]="fillHeight"
        [class.jnks-iot-mat-32]="!isMdLg"
        [class.jnks-iot-mat-24]="isMdLg">
  <mat-icon>chevron_left</mat-icon>
</button>
<div #toggleGroupContainer class="jnks-iot-toggle-container"
     [class.jnks-iot-disable-pagination]="disablePagination"
     [class.fill-height]="fillHeight"
     [class.extra-padding]="extraPadding"
     *ngIf="(useSelect$ | async) === false; else select" >
  <mat-button-toggle-group #toggleGroup
                           class="jnks-iot-toggle-header"
                           [class.jnks-iot-fill]="(appearance === 'fill' || appearance === 'fill-invert')"
                           [class.jnks-iot-invert]="appearance === 'fill-invert'"
                           [class.jnks-iot-primary-fill]="primaryBackground"
                           [class.jnks-iot-ignore-md-lg]="ignoreMdLgSize"
                           [class.jnks-iot-disabled]="disabled"
                           [name]="name"
                           [(ngModel)]="value"
                           (ngModelChange)="valueChange.emit(value)">
    <mat-button-toggle *ngFor="let option of options; trackBy: trackByHeaderOption" [value]="option.value" [disabled]="disabled" [class.jnks-iot-toggle-button-error]="(option.error$ | async) && value !== option.value">
      {{ option.name }}
      <mat-icon matTooltipPosition="above"
                matTooltipClass="jnks-iot-error-tooltip"
                [matTooltip]="(option.error$ | async)"
                *ngIf="(option.error$ | async) && value !== option.value"
                class="jnks-iot-error jnks-iot-error-icon">
        warning
      </mat-icon>
    </mat-button-toggle>
  </mat-button-toggle-group>
</div>
<button mat-icon-button
        type="button"
        [disabled]="!rightPaginationEnabled"
        (click)="handlePaginatorClick('after', $event)"
        (touchstart)="handlePaginatorTouchStart('after', $event)"
        class="jnks-iot-toggle-header-pagination-button"
        [class.fill-height]="fillHeight"
        [class.jnks-iot-mat-32]="!isMdLg"
        [class.jnks-iot-mat-24]="isMdLg">
  <mat-icon>chevron_right</mat-icon>
</button>
<ng-template #select>
  <mat-form-field appearance="outline" class="jnks-iot-toggle-header-select"
                  [class.fill-height]="fillHeight"
                  subscriptSizing="dynamic">
    <mat-select [(ngModel)]="value" (ngModelChange)="valueChange.emit($event)" [disabled]="disabled">
      <mat-option *ngFor="let option of options" [value]="option.value"> {{ option.name }}</mat-option>
    </mat-select>
  </mat-form-field>
</ng-template>
