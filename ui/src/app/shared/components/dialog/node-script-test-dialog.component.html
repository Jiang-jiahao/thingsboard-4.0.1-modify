<form class="jnks-iot-node-script-test-dialog"
      [formGroup]="nodeScriptTestFormGroup" (ngSubmit)="save()">
  <mat-toolbar class="flex flex-row" color="primary">
    <h2>{{ 'rulenode.test-script-function' | translate }} ({{ (scriptLang === scriptLanguage.JS ? 'rulenode.script-lang-java-script' : 'rulenode.script-lang-tbel') | translate }})</h2>
    <span class="flex-1"></span>
    <button mat-icon-button
            (click)="cancel()"
            type="button">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-toolbar>
  <div mat-dialog-content class="flex-1" style="position: relative;">
    <div class="jnks-iot-absolute-fill">
      <div #topPanel class="jnks-iot-split jnks-iot-split-vertical">
        <div #topLeftPanel class="jnks-iot-split jnks-iot-content">
          <div class="jnks-iot-resize-container">
            <div class="jnks-iot-editor-area-title-panel">
              <label translate>rulenode.message</label>
            </div>
            <div formGroupName="payload" class="flex flex-col" style="height: 100%;">
              <div class="flex flex-row">
                <jnks-iot-message-type-autocomplete
                  style="margin-bottom: 0; min-width: 300px;"
                  formControlName="msgType"
                  required>
                </jnks-iot-message-type-autocomplete>
              </div>
              <jnks-iot-json-content
                #payloadContent
                class="flex-1"
                formControlName="msg"
                label="{{ 'rulenode.message' | translate }}"
                [contentType]="contentTypes.JSON"
                validateContent
                [fillHeight]="true">
              </jnks-iot-json-content>
            </div>
          </div>
        </div>
        <div #topRightPanel class="jnks-iot-split jnks-iot-content">
          <div jnks-iot-toast class="jnks-iot-resize-container">
            <div class="jnks-iot-editor-area-title-panel">
              <label translate>rulenode.metadata</label>
            </div>
            <jnks-iot-key-val-map
              subscriptSizing="dynamic"
              formControlName="metadata"
              [isValueRequired]="false"
              titleText="rulenode.metadata">
            </jnks-iot-key-val-map>
          </div>
        </div>
      </div>
      <div #bottomPanel class="jnks-iot-split jnks-iot-split-vertical">
        <div #bottomLeftPanel class="jnks-iot-split jnks-iot-content">
          <div class="jnks-iot-resize-container">
            <div class="jnks-iot-editor-area-title-panel jnks-iot-js-function" [class.jnks-iot-js-function-help]="data.helpId">
              <label>{{ functionTitle }}</label>
            </div>
            <jnks-iot-js-func
              formControlName="script"
              functionName="{{ data.functionName }}"
              [functionArgs]="data.argNames"
              [validationArgs]="[data.msg, data.metadata, data.msgType]"
              [disableUndefinedCheck]="scriptLang === scriptLanguage.TBEL"
              [scriptLanguage]="scriptLang"
              resultType="object"
              [helpId]="data.helpId"
              [fillHeight]="true">
            </jnks-iot-js-func>
          </div>
        </div>
        <div #bottomRightPanel class="jnks-iot-split jnks-iot-content">
          <div class="jnks-iot-resize-container">
            <div class="jnks-iot-editor-area-title-panel">
              <label translate>rulenode.output</label>
            </div>
            <jnks-iot-json-content
              class="flex-1"
              formControlName="output"
              label="{{ 'rulenode.output' | translate }}"
              [contentType]="contentTypes.JSON"
              validateContent="false"
              readonly="true"
              [fillHeight]="true">
            </jnks-iot-json-content>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div mat-dialog-actions class="flex flex-row">
    <button mat-button mat-raised-button color="primary"
            type="button"
            (click)="test()"
            [disabled]="(isLoading$ | async) || nodeScriptTestFormGroup.invalid">
      {{ 'rulenode.test' | translate }}
    </button>
    <span class="flex-1"></span>
    <button mat-button color="primary"
            type="button"
            cdkFocusInitial
            [disabled]="(isLoading$ | async)"
            (click)="cancel()">
      {{ 'action.cancel' | translate }}
    </button>
    <button mat-button mat-raised-button color="primary"
            type="submit"
            [disabled]="(isLoading$ | async) || nodeScriptTestFormGroup.get('script').invalid || !nodeScriptTestFormGroup.get('script').dirty">
      {{ 'action.save' | translate }}
    </button>
  </div>
</form>
