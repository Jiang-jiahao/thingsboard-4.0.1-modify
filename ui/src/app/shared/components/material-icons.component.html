<div class="jnks-iot-material-icons-panel">
  <div *ngIf="showTitle" class="jnks-iot-material-icons-title" translate>icon.icons</div>
  <mat-form-field class="jnks-iot-material-icons-search jnks-iot-inline-field" appearance="outline" subscriptSizing="dynamic">
    <mat-icon matPrefix>search</mat-icon>
    <input matInput [formControl]="searchIconControl" placeholder="{{ 'icon.search-icon' | translate }}"/>
    <button *ngIf="searchIconControl.value"
            type="button"
            matSuffix mat-icon-button aria-label="Clear"
            (click)="clearSearch()">
      <mat-icon class="material-icons">close</mat-icon>
    </button>
  </mat-form-field>
  <cdk-virtual-scroll-viewport [class.!hidden]="notFound" #iconsPanel
                               [itemSize]="iconsRowHeight" class="jnks-iot-material-icons-viewport"
                               [style.width]="iconsPanelWidth"
                               [style.height]="iconsPanelHeight">
    <div *cdkVirtualFor="let iconRow of iconRows$ | async" class="jnks-iot-material-icons-row">
      <ng-container *ngFor="let icon of iconRow">
        <button *ngIf="icon.name === selectedIcon"
                class="jnks-iot-select-icon-button"
                mat-raised-button
                color="primary"
                (click)="selectIcon(icon)"
                matTooltip="{{ icon.displayName }}"
                matTooltipPosition="above"
                type="button">
          <jnks-iot-icon matButtonIcon>{{icon.name}}</jnks-iot-icon>
        </button>
        <button *ngIf="icon.name !== selectedIcon"
                class="jnks-iot-select-icon-button"
                mat-button
                (click)="selectIcon(icon)"
                matTooltip="{{ icon.displayName }}"
                matTooltipPosition="above"
                type="button">
          <jnks-iot-icon matButtonIcon>{{icon.name}}</jnks-iot-icon>
        </button>
      </ng-container>
    </div>
  </cdk-virtual-scroll-viewport>
  <ng-container *ngIf="notFound">
    <div class="jnks-iot-no-data-available" [style.width]="iconsPanelWidth">
      <div class="jnks-iot-no-data-bg"></div>
      <div class="jnks-iot-no-data-text">{{ 'icon.no-icons-found' | translate:{iconSearch: searchIconControl.value} }}</div>
    </div>
  </ng-container>
  <div class="jnks-iot-material-icons-panel-buttons" *ngIf="iconClearButton || !showAllSubject.value">
    <button *ngIf="iconClearButton"
            mat-button
            color="primary"
            type="button"
            (click)="clearIcon()"
            [disabled]="!selectedIcon">
      {{ 'action.clear' | translate }}
    </button>
    <span class="flex-1"></span>
    <button *ngIf="!showAllSubject.value" class="jnks-iot-material-icons-show-more" mat-button color="primary" (click)="showAllSubject.next(true)">
      {{ 'action.show-more' | translate }}
    </button>
  </div>
</div>
