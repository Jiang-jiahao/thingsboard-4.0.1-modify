<div class="jnks-iot-svg-xml flex flex-col"  [class]="{'jnks-iot-disabled': disabled, 'fill-height': fillHeight, 'no-label': noLabel}"
     jnks-iot-fullscreen
     [fullscreen]="fullscreen">
  <div style="min-height: 40px;" class="jnks-iot-svg-xml-toolbar flex flex-row items-center justify-start">
    <label *ngIf="!noLabel" class="jnks-iot-title no-padding" [class]="{'jnks-iot-error': !disabled && (hasErrors || required && !modelValue), 'jnks-iot-required': !disabled && required}">{{ label }}</label>
    <span class="flex-1"></span>
    <fieldset style="width: initial">
      <div matTooltip="{{(fullscreen ? 'fullscreen.exit' : 'fullscreen.expand') | translate}}"
           matTooltipPosition="above"
           style="border-radius: 50%"
           (click)="fullscreen = !fullscreen">
        <button type='button' mat-icon-button class="jnks-iot-mat-32">
          <mat-icon class="material-icons">{{ fullscreen ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon>
        </button>
      </div>
    </fieldset>
  </div>
  <div id="jnks-iot-svg-xml-panel" class="jnks-iot-svg-xml-content-panel flex flex-col">
    <div #svgXmlEditor id="jnks-iot-svg-xml-input" [style]="fillHeight ? {} : {minHeight: minHeight}" [class.fill-height]="fillHeight"></div>
  </div>
</div>
