<!doctype html>
<html lang="en" style="width: 100%; height: 100%;">
<head>
  <meta charset="utf-8">
  <title>杰能科世物联网平台</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="preload" href="assets/jnks-brand-emblem.png" as="image" type="image/png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/jnks-favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/jnks-favicon-16.png">
  <link rel="apple-touch-icon" sizes="48x48" href="assets/jnks-favicon-48.png">
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.ttf" as="font" type="font/ttf" crossorigin="anonymous" />
  <link rel="preload" href="assets/fonts/MaterialIconsRound-Regular.otf" as="font" type="font/otf" crossorigin="anonymous" />
  <link rel="stylesheet" href="assets/fonts/material-icons.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style type="text/css">

    body, html {
      height: 100%;
      overflow: hidden;
      margin: 0;
      background: linear-gradient(165deg, #eef2f7 0%, #e8eef6 45%, #f4f7fb 100%);
      font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
    }

    .tb-loading-spinner {
      z-index: 9999;
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .tb-app-loader-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 36px 40px 32px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid rgba(12, 35, 64, 0.08);
      box-shadow:
        0 4px 24px rgba(12, 35, 64, 0.08),
        0 1px 3px rgba(15, 23, 42, 0.06);
      min-width: 220px;
      animation: tb-loader-fade-in 0.35s ease-out both;
    }

    .tb-app-loader-emblem-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tb-app-loader-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(30, 73, 118, 0.12);
      border-top-color: #1e4976;
      border-right-color: #3b6ea8;
      animation: tb-loader-spin 0.9s linear infinite;
    }

    .tb-app-loader-emblem {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      overflow: hidden;
      background: #060f18;
      border: 2px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 2px 12px rgba(12, 35, 64, 0.2);
      animation: tb-loader-emblem-pulse 2s ease-in-out infinite;
    }

    .tb-app-loader-emblem img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: left center;
    }

    .tb-app-loader-title {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #0c2340;
    }

    .tb-app-loader-subtitle {
      margin: -14px 0 0;
      font-size: 12px;
      font-weight: 500;
      color: #64748b;
    }

    .tb-app-loader-track {
      width: 168px;
      height: 4px;
      border-radius: 4px;
      background: rgba(30, 73, 118, 0.12);
      overflow: hidden;
    }

    .tb-app-loader-bar {
      width: 42%;
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #0c2340, #1e4976 55%, #3b6ea8);
      animation: tb-loader-slide 1.2s ease-in-out infinite;
    }

    @keyframes tb-loader-fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes tb-loader-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes tb-loader-emblem-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    @keyframes tb-loader-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }

  </style>
</head>
<body class="tb-default">
  <tb-root></tb-root>
  <div id="tb-loading-spinner" class="tb-loading-spinner" role="status" aria-live="polite" aria-label="正在加载">
    <div class="tb-app-loader-card">
      <div class="tb-app-loader-emblem-wrap">
        <div class="tb-app-loader-ring" aria-hidden="true"></div>
        <div class="tb-app-loader-emblem">
          <img src="assets/jnks-brand-emblem.png" alt="" width="56" height="56"/>
        </div>
      </div>
      <p class="tb-app-loader-title">JnksIOT</p>
      <p class="tb-app-loader-subtitle">杰能科世物联网平台</p>
      <div class="tb-app-loader-track" aria-hidden="true">
        <div class="tb-app-loader-bar"></div>
      </div>
    </div>
  </div>
</body>
</html>
